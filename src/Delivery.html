<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Delivery</title><style>:root{--g:#075b34;--bg:#f4f7f4;--line:#dfe7e1;--muted:#6b776e;--ink:#142019;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}.topline{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:20px}.sub{font-size:11px;opacity:.82}.online{background:#ffffff25;border:1px solid #ffffff40;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.wrap{max-width:680px;margin:auto;padding:14px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:11px;box-shadow:0 4px 16px #0000000a}.login{margin-top:28px}.field,input{width:100%;border:1px solid #dce5dd;border-radius:13px;padding:12px 13px;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,button{border:0;background:var(--g);color:#fff;border-radius:13px;padding:12px 14px;font-weight:900}.secondary{background:#edf7f0;color:var(--g)}.callBtn{background:#eef6ff;color:#235c91}.danger{background:#fff1f0;color:var(--danger)}.muted{color:var(--muted);font-size:12px;line-height:1.45}.hero{background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff}.hero .muted{color:#fff;opacity:.8}.big{font-size:25px;font-weight:950}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.stat{background:#ffffff18;border:1px solid #ffffff28;border-radius:13px;padding:9px}.stat b{display:block;font-size:17px}.pill{display:inline-flex;padding:6px 8px;border-radius:999px;background:#eaf7ee;color:#08753f;font-size:10px;font-weight:950}.hub{background:linear-gradient(135deg,#fff8e7,#fff)}.activeCard h2{margin:8px 0 4px;font-size:22px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.otpBox{margin-top:10px;background:#f7faf7;border:1px solid var(--line);border-radius:14px;padding:10px}.queue{display:grid;gap:8px}.q{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#fff}.seq{width:34px;height:34px;border-radius:50%;background:#eaf7ee;color:var(--g);display:grid;place-items:center;font-weight:950}.toast{position:fixed;z-index:100;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#153824;color:#fff;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.gps{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800}.gps i{width:8px;height:8px;border-radius:50%;background:#98a39a}.gps.live i{background:#55ec8f;box-shadow:0 0 0 5px #55ec8f22}.sticky{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:15}.stickyIn{max-width:680px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:390px){.row,.actions{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.wrap{padding:11px 11px 100px}}</style></head><body><div id="toast" class="toast"></div><div class="top"><div class="topline"><div><div class="brand">🥥 Native Elaneeru Delivery</div><div class="sub">B2C delivery partner</div></div><span class="online">V9</span></div></div><div class="wrap"><div id="login" class="card login"><h2 style="margin-top:0">Delivery partner login</h2><div class="row"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Mobile number"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"></div><button style="width:100%;margin-top:9px" onclick="login()">Go Online</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div id="app" class="hidden"><div id="hero" class="card hero"></div><div id="active"></div><div class="card"><b>Next deliveries</b><div id="queue" class="queue" style="margin-top:10px"></div></div></div></div><div id="sticky" class="sticky hidden"><div class="stickyIn"><div><div id="gpsState" class="gps"><i></i><span>GPS idle</span></div><div id="syncState" class="muted">Ready</div></div><button class="secondary" onclick="refresh()">↻ Refresh</button></div></div><script>const $=id=>document.getElementById(id);let MOB='',PIN='',DATA=null,WATCH=null,LAST=0,BUSY=false;function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){const e=$('toast');e.textContent=s;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}function setBusy(v,s){BUSY=v;$('syncState').textContent=s||(v?'Working…':'Ready')}function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}async function login(){if(BUSY)return;MOB=$('mobile').value.trim();PIN=$('pin').value.trim();setBusy(true,'Signing in…');try{await rpc('driverLoginV8',[MOB,PIN,'B2C']);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('sticky').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e.message;toast(e.message)}finally{setBusy(false)}}async function refresh(){if(BUSY)return;setBusy(true,'Syncing route…');try{DATA=await rpc('getDriverDayRouteV8',[MOB,PIN,'B2C',today()]);render();const a=currentStop();if(DATA?.route?.hubPickedUp&&a&&!['COMPLETED','CANCELLED'].includes(String(a.status).toUpperCase()))startGps(a.stopId)}catch(e){toast(e.message)}finally{setBusy(false)}}function currentStop(){return (DATA?.stops||[]).find(x=>!['COMPLETED','CANCELLED'].includes(String(x.status).toUpperCase()))||null}function render(){const r=DATA?.route,s=DATA?.stops||[],a=currentStop();if(!r){stopGps();$('hero').innerHTML='<div class="big">You’re all caught up 🎉</div><div class="muted">No B2C route assigned for today.</div>';$('active').innerHTML='';$('queue').innerHTML='';return}$('hero').innerHTML=`<div class="muted">TODAY'S DELIVERY RUN</div><div class="big">${r.completedStops}/${r.totalStops} completed</div><div class="stats"><div class="stat"><span class="muted">Road KM</span><b>${Number(r.roadKm||0).toFixed(1)}</b></div><div class="stat"><span class="muted">Est. time</span><b>${Math.round(r.estimatedMinutes||0)}m</b></div><div class="stat"><span class="muted">Stops</span><b>${r.totalStops}</b></div></div>`;if(!r.hubPickedUp){stopGps();const total=s.reduce((q,x)=>q+Number(x.requiredQty||0),0);$('active').innerHTML=`<div class="card hub"><span class="pill">STEP 1 · HUB PICKUP</span><h2>Collect today’s packages</h2><div class="muted">${esc(DATA.hub?.name||'Native Elaneeru Hub')}<br>${r.totalStops} customer orders · ${total} total items</div><div class="actions"><button class="secondary" onclick="nav(${Number(DATA.hub?.lat||0)},${Number(DATA.hub?.lng||0)})">🧭 Navigate to Hub</button><button onclick="hubPickup('${esc(r.routeId)}')">📦 Confirm Pickup</button></div></div>`;$('queue').innerHTML=s.slice(0,4).map(queueItem).join('');return}if(!a){stopGps();$('active').innerHTML='<div class="card"><div class="big">Route completed ✅</div><div class="muted">All assigned deliveries are finished.</div></div>';$('queue').innerHTML='';return}$('active').innerHTML=`<div class="card activeCard"><span class="pill">CURRENT DELIVERY · STOP ${a.sequence}</span><h2>${esc(a.name)}</h2><div class="muted">${esc(a.address)}<br>${Number(a.requiredQty||0)} items · ${Number(a.roadKm||0).toFixed(1)} km · ETA ${esc(a.eta||'')}</div><div class="actions"><button class="secondary" onclick="nav(${Number(a.lat||0)},${Number(a.lng||0)})">🧭 Navigate</button><button class="callBtn" onclick="callCustomer('${esc(a.mobile||'')}')">☎ Call Customer</button></div>${!a.checkInAt?`<button style="width:100%;margin-top:9px" onclick="checkin('${esc(a.stopId)}')">📍 I’ve Reached Customer</button>`:`<div class="otpBox"><div class="muted">Customer reached ✓ · Ask customer for delivery OTP</div><div class="row" style="margin-top:8px"><input id="otp" inputmode="numeric" maxlength="6" placeholder="Customer OTP"><input id="remarks" placeholder="Remarks (optional)"></div><div class="actions"><button onclick="deliver('${esc(a.stopId)}')">✅ Verify OTP & Deliver</button><button class="secondary" onclick="checkout('${esc(a.stopId)}')">Finish & Next →</button></div></div>`}</div>`;$('queue').innerHTML=s.filter(x=>x.sequence>a.sequence&&!['COMPLETED','CANCELLED'].includes(String(x.status).toUpperCase())).slice(0,5).map(queueItem).join('')||'<div class="muted">No more deliveries after this stop.</div>'}function queueItem(x){return `<div class="q"><div class="seq">${x.sequence}</div><div><b>${esc(x.name)}</b><div class="muted">${esc(x.address)} · ${Number(x.requiredQty||0)} items</div></div><div class="muted">${Number(x.roadKm||0).toFixed(1)} km</div></div>`}function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:5000}))}async function hubPickup(routeId){if(BUSY)return;setBusy(true,'Confirming hub pickup…');try{const p=await pos();const r=await rpc('driverHubPickupV83',[MOB,PIN,'B2C',routeId,p.coords.latitude,p.coords.longitude]);toast(`Pickup confirmed · ${r.totalStops} stops`);await refresh()}catch(e){toast(e.message)}finally{setBusy(false)}}async function checkin(id){if(BUSY)return;setBusy(true,'Checking in…');try{const p=await pos();await rpc('driverCheckInV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude]);startGps(id);toast('Customer reached');await refresh()}catch(e){toast(e.message)}finally{setBusy(false)}}async function deliver(id){if(BUSY)return;const otp=$('otp')?.value.trim();if(!otp)return toast('Enter customer OTP');setBusy(true,'Completing delivery…');try{const p=await pos();await rpc('driverDeliverV8',[MOB,PIN,'B2C',id,otp,p.coords.latitude,p.coords.longitude,$('remarks')?.value||'']);toast('Delivery completed ✅');await refresh()}catch(e){toast(e.message)}finally{setBusy(false)}}async function checkout(id){if(BUSY)return;setBusy(true,'Closing stop…');try{const p=await pos();const r=await rpc('driverCheckOutV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude]);stopGps();toast(r.routeCompleted?'Route completed 🎉':'Moving to next delivery');await refresh()}catch(e){toast(e.message)}finally{setBusy(false)}}function startGps(id){stopGps();$('gpsState').classList.add('live');$('gpsState').querySelector('span').textContent='GPS live';WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await rpc('updateDriverLiveV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}$('gpsState')?.classList.remove('live');const s=$('gpsState')?.querySelector('span');if(s)s.textContent='GPS idle'}function nav(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}function callCustomer(m){if(m)location.href='tel:'+String(m).replace(/\D/g,'')}</script></body></html>
