<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075d32"><title>Native Elaneeru Bunch</title><style>
:root{--g:#08783f;--dk:#064c2b;--bg:#f2f7f3;--line:#d9e7dc;--ink:#14251b;--muted:#637168;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Arial}header{position:sticky;top:0;z-index:8;padding:14px 16px;background:linear-gradient(135deg,var(--dk),#119451);color:white}.head,.wrap{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:950}.tiny{font-size:11px;opacity:.82}.wrap{padding:12px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 4px 18px #103b2010}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.field,.btn{width:100%;min-height:46px;border-radius:12px;font:inherit}.field{border:1px solid var(--line);padding:11px;background:#fff}.btn{border:0;padding:11px 13px;background:var(--g);color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.btn.alt{background:#e9f6ed;color:var(--g)}h2{font-size:16px;margin:1px 0 12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}.tab{background:#e5eee7;color:#45604e}.tab.on{background:var(--g);color:white}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f7ec;color:#08713d;font-size:10px;font-weight:950}.msg{margin:8px 2px;color:var(--red);font-size:12px}.ok{color:#08713d}.label{text-align:center}.barcode{font-family:monospace;font-weight:900;letter-spacing:1px;word-break:break-all}.big{font-size:30px;font-weight:950}.row{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #edf2ee}.row:last-child{border:0}.meta{font-size:12px;color:var(--muted)}video{width:100%;max-height:260px;border-radius:14px;background:#111;display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}@media print{header,.tabs,#login,.noPrint,.msg{display:none!important}.wrap{padding:0}.card{border:0;box-shadow:none}.label{display:block!important}}
</style></head><body><header><div class="head"><div><div class="brand">🥥 Bunch Scanner</div><div class="tiny">Count → label → scan → assign</div></div><span class="badge">LIVE STOCK</span></div></header><main class="wrap"><section id="login" class="card grid"><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="Employee mobile"><input id="pin" class="field" inputmode="numeric" type="password" placeholder="PIN"><button id="loginBtn" class="btn full" onclick="login()">Start shift</button><div class="meta full">Only staff given Bunch Scanning access can enter.</div></section><div id="msg" class="msg"></div><div id="app" hidden><section class="card"><div class="row"><div><b id="who"></b><div id="role" class="meta"></div></div><button class="btn alt noPrint" style="width:auto" onclick="refresh()">Refresh</button></div></section><div class="tabs noPrint"><button id="makeTab" class="btn tab on" onclick="showTab('make')">Create bunch</button><button id="assignTab" class="btn tab" onclick="showTab('assign')">Assign vendor</button></div><section id="make" class="card"><h2>Create barcode after counting</h2><div class="grid"><select id="product" class="field"></select><input id="qty" class="field" type="number" min="1" inputmode="numeric" placeholder="Coconut count"><input id="location" class="field full" value="HUB" placeholder="Location"><button id="createBtn" class="btn full" onclick="createBunch()">Create bunch barcode</button></div><div id="label" class="label" hidden><p class="badge">BUNCH READY</p><div id="labelProduct"></div><div id="labelQty" class="big"></div><svg id="bars" width="100%" height="100" aria-label="barcode"></svg><div id="labelCode" class="barcode"></div><p class="meta">Paste this label on the counted bunch</p><button class="btn noPrint" onclick="print()">Print label</button></div></section><section id="assign" class="card" hidden><h2>Scan and assign to end vendor</h2><select id="order" class="field"></select><div style="height:9px"></div><input id="scan" class="field" autocomplete="off" placeholder="Scan or enter bunch barcode"><div style="height:9px"></div><div class="grid noPrint"><button class="btn alt" onclick="camera()">Use camera</button><button id="assignBtn" class="btn" onclick="assignBunch()">Assign full bunch</button></div><video id="video" playsinline></video><div id="progress"></div></section><section class="card"><h2>Shared recent activity</h2><div id="recent"></div></section></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),rpc=(f,a=[])=>new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>j(new Error(e&&e.message?e.message:String(e))))[f](...a));let M='',P='',D=null,stream=null;
function message(t,ok){$('msg').className='msg'+(ok?' ok':'');$('msg').textContent=t||''}
async function login(){const b=$('loginBtn');b.disabled=true;b.textContent='Opening…';try{M=$('mobile').value.replace(/\D/g,'').slice(-10);P=$('pin').value.trim();if(!/^\d{10}$/.test(M)||P.length<4)throw Error('Enter your staff mobile and PIN.');await refresh();$('login').hidden=true;$('app').hidden=false}catch(e){message(e.message)}finally{b.disabled=false;b.textContent='Start shift'}}
async function refresh(){try{D=await rpc('getBunchWorkspaceV944',[M,P]);render()}catch(e){message(e.message)}}
function render(){const u=D.user||{};$('who').textContent='Hi, '+(u.name||'Employee');$('role').textContent=(u.role||'STAFF')+' · shared allocation';$('product').innerHTML=(D.products||[]).map(p=>`<option value="${esc(p.productId)}">${esc(p.productName)} · ${esc(p.unit)}</option>`).join('');$('order').innerHTML='<option value="">Choose end-vendor order</option>'+(D.orders||[]).map(o=>`<option value="${esc(o.orderId)}">${esc(o.vendorName)} · ${esc(o.orderId)} · ${o.lines.map(x=>x.remainingQty+' '+x.productName+' left').join(', ')}</option>`).join('');$('recent').innerHTML=(D.bunches||[]).slice(0,20).map(b=>`<div class="row"><div><b>${esc(b.productName)} · ${b.originalQty}</b><div class="meta">${esc(b.barcode)} · ${esc(b.createdAt)}</div></div><span class="badge">${esc(b.status)}</span></div>`).join('')||'<div class="meta">No bunches created yet.</div>';message('Updated for every employee.',true)}
function showTab(id){$('make').hidden=id!=='make';$('assign').hidden=id!=='assign';$('makeTab').classList.toggle('on',id==='make');$('assignTab').classList.toggle('on',id==='assign');if(id==='assign')$('scan').focus()}
async function createBunch(){const b=$('createBtn');b.disabled=true;try{const r=await rpc('createBunchV944',[M,P,{productId:$('product').value,qty:Number($('qty').value),location:$('location').value}]),x=r.bunch;$('label').hidden=false;$('labelProduct').textContent=x.productName;$('labelQty').textContent=x.originalQty+' coconuts';$('labelCode').textContent=x.barcode;drawCode39(x.barcode);$('scan').value=x.barcode;message('Bunch created and stock increased.',true);await refresh()}catch(e){message(e.message)}finally{b.disabled=false}}
async function assignBunch(){const b=$('assignBtn');b.disabled=true;try{if(!$('order').value)throw Error('Choose the end-vendor order.');if(!$('scan').value.trim())throw Error('Scan the bunch barcode.');const r=await rpc('assignBunchToVendorV944',[M,P,$('scan').value,$('order').value]);$('progress').innerHTML=`<div class="row"><div><b>${r.qty} assigned by ${esc(r.assignedBy)}</b><div class="meta">${r.remainingToAssign} still required for this product</div></div><span class="badge">DONE</span></div>`;$('scan').value='';message('Bunch assigned safely.',true);await refresh()}catch(e){message(e.message)}finally{b.disabled=false;$('scan').focus()}}
async function camera(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices){message('Camera scanning is not supported here. Use the phone scanner or type the code.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('video');v.srcObject=stream;v.style.display='block';await v.play();const detector=new BarcodeDetector({formats:['code_39','code_128','qr_code']});const tick=async()=>{if(!stream)return;try{const codes=await detector.detect(v);if(codes[0]){$('scan').value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());stream=null;v.style.display='none';message('Barcode captured.',true);return}}catch(e){}requestAnimationFrame(tick)};tick()}catch(e){message('Camera could not start. Check browser permission.')}}
function drawCode39(value){const patterns={'0':'101001101101','1':'110100101011','2':'101100101011','3':'110110010101','4':'101001101011','5':'110100110101','6':'101100110101','7':'101001011011','8':'110100101101','9':'101100101101','A':'110101001011','B':'101101001011','C':'110110100101','D':'101011001011','E':'110101100101','F':'101101100101','G':'101010011011','H':'110101001101','I':'101101001101','J':'101011001101','K':'110101010011','L':'101101010011','M':'110110101001','N':'101011010011','O':'110101101001','P':'101101101001','Q':'101010110011','R':'110101011001','S':'101101011001','T':'101011011001','U':'110010101011','V':'100110101011','W':'110011010101','X':'100101101011','Y':'110010110101','Z':'100110110101','-':'100101011011','*':'100101101101'};let bits='';('*'+value.toUpperCase()+'*').split('').forEach(c=>bits+=(patterns[c]||patterns['-'])+'0');const svg=$('bars'),w=Math.max(1,Math.floor(700/bits.length));svg.setAttribute('viewBox',`0 0 ${bits.length*w} 100`);svg.innerHTML=bits.split('').map((x,i)=>x==='1'?`<rect x="${i*w}" y="4" width="${w}" height="88"/>`:'').join('')}
$('scan').addEventListener('keydown',e=>{if(e.key==='Enter')assignBunch()});
</script></body></html>
