<!doctype html><html><head><base target="_top"><style>body{margin:0;background:#f5f7f5;font:14px Arial;color:#172019}.top{background:#075b34;color:#fff;padding:18px}.wrap{max-width:980px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid #e2e9e4;border-radius:16px;padding:15px;margin:12px 0}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{width:100%;padding:10px;box-sizing:border-box;border:1px solid #d6dfd9;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#075b34;color:#fff;font-weight:bold;cursor:pointer}.btn.alt{background:#eaf5ed;color:#075b34}.hide{display:none}.muted{color:#66756c;font-size:12px}.line{display:grid;grid-template-columns:2fr 80px 110px 42px;gap:7px;margin:7px 0}.po{border-top:1px solid #e6ece7;padding:12px 0}.status{display:inline-block;background:#eaf5ed;color:#075b34;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:bold}@media(max-width:650px){.row{grid-template-columns:1fr}.line{grid-template-columns:1fr 70px 90px 42px}}</style></head><body><div class="top"><b>🥥 Native Elaneeru · Purchase Orders</b><div class="muted" style="color:#cce8d7">Supplier purchasing, receiving and printable POs</div></div><div class="wrap"><section id="login" class="card"><h2>Admin login</h2><input id="email" class="field" type="email" placeholder="Admin email"><br><br><input id="pin" class="field" type="password" placeholder="PIN"><br><br><button class="btn" onclick="openConsole()">Open Purchase Orders</button><div id="msg" class="muted"></div></section><section id="app" class="hide"><div class="card"><h2 style="margin-top:0">Create supplier PO</h2><div class="row"><select id="supplier" class="field"></select><input id="poDate" class="field" type="date"><input id="expectedDate" class="field" type="date"></div><div class="row" style="margin-top:9px"><input id="location" class="field" value="Native Elaneeru Hub"><input id="notes" class="field" placeholder="Notes for supplier"><button class="btn" onclick="createPO()">Create PO</button></div><h3>Items</h3><div id="lines"></div><button class="btn alt" onclick="addLine()">+ Add product</button></div><div class="card"><h2 style="margin-top:0">Recent purchase orders</h2><div id="orders"></div></div></section></div><script>let E='',P='',D={products:[],suppliers:[],orders:[]};const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function call(n,a){return new Promise((ok,bad)=>google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[n](...a))}function today(){return new Date().toISOString().slice(0,10)}async function openConsole(){E=$('email').value.trim().toLowerCase();P=$('pin').value.trim();try{if(!E||P.length<4)throw Error('Enter Admin email and PIN.');D=await call('getPurchaseOrderConsoleV931',[E,P]);$('login').classList.add('hide');$('app').classList.remove('hide');$('poDate').value=today();render()}catch(e){$('msg').textContent=e.message||e}}function productOptions(){return '<option value="">Select product</option>'+D.products.map(p=>'<option value="'+esc(p.productId)+'" data-price="'+Number(p.price||0)+'">'+esc(p.productName)+' · ₹'+Number(p.price||0)+'</option>').join('')}function addLine(x={}){const d=document.createElement('div');d.className='line';d.innerHTML='<select class="field product">'+productOptions()+'</select><input class="field qty" type="number" min="1" value="'+Number(x.quantity||1)+'"><input class="field rate" type="number" min="0" value="'+Number(x.unitPrice||0)+'"><button class="btn alt" onclick="this.parentNode.remove()">×</button>';d.querySelector('.product').value=x.productId||'';d.querySelector('.product').onchange=function(){d.querySelector('.rate').value=this.options[this.selectedIndex].dataset.price||0};$('lines').append(d)}function render(){$('supplier').innerHTML='<option value="">Select supplier</option>'+D.suppliers.map(s=>'<option value="'+esc(s.supplierId)+'">'+esc(s.supplierName)+' · '+esc(s.mobile)+'</option>').join('');$('lines').innerHTML='';addLine();$('orders').innerHTML=(D.orders||[]).map(po=>'<div class="po"><b>'+esc(po.poId)+'</b> <span class="status">'+esc(po.status)+'</span><div class="muted">'+esc(po.supplierName)+' · '+esc(po.poDate)+' · ₹'+Number(po.subTotal||0)+'</div><div class="muted">'+po.items.map(i=>esc(i.productName)+' × '+Number(i.quantity)).join(' · ')+'</div><button class="btn alt" onclick="printPO(\''+esc(po.poId)+'\')">Print</button></div>').join('')||'<div class="muted">No purchase orders yet.</div>'}async function createPO(){try{const items=[...document.querySelectorAll('#lines .line')].map(r=>({productId:r.querySelector('.product').value,quantity:r.querySelector('.qty').value,unitPrice:r.querySelector('.rate').value}));const r=await call('createPurchaseOrderV931',[E,P,{supplierId:$('supplier').value,poDate:$('poDate').value,expectedDate:$('expectedDate').value,deliveryLocation:$('location').value,notes:$('notes').value,items}]);alert('PO '+r.poId+' created.');D=await call('getPurchaseOrderConsoleV931',[E,P]);render()}catch(e){alert(e.message||e)}}function printPO(id){const po=D.orders.find(x=>x.poId===id);if(!po)return;const w=open('','_blank');w.document.write('<h1>Native Elaneeru</h1><h2>Purchase Order '+esc(po.poId)+'</h2><p><b>Supplier:</b> '+esc(po.supplierName)+'<br><b>Expected:</b> '+esc(po.expectedDate||'Not specified')+'</p><table border="1" cellspacing="0" cellpadding="8"><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Total</th></tr>'+po.items.map(i=>'<tr><td>'+esc(i.productName)+'</td><td>'+i.quantity+'</td><td>₹'+i.unitPrice+'</td><td>₹'+i.lineTotal+'</td></tr>').join('')+'</table><h3>Total ₹'+po.subTotal+'</h3><p>'+esc(po.notes||'')+'</p><script>print()<\/script>');w.document.close()}</script></body></html>
