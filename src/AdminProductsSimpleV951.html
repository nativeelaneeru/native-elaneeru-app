</style>
<script>
(function(){
  if(window.NEL_ADMIN_PRODUCTS_V951)return;window.NEL_ADMIN_PRODUCTS_V951=true;
  var PRODUCTS=[],EDITING='',FILTER='ALL',STATUS_FILTER='ALL';
  function q(id){return document.getElementById(id)}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
  function admin(){return {email:String(typeof E!=='undefined'?E:'').trim(),pin:String(typeof P!=='undefined'?P:'').trim()}}
  function val(id){return String(q(id)&&q(id).value||'').trim()}
  function num(id){return Number(q(id)&&q(id).value||0)}
  function checked(id){return !!(q(id)&&q(id).checked)}
  function msg(t,ok){var x=q('pcMsg');if(x){x.textContent=t||'';x.style.color=ok?'#155b2b':'#9a3412'}}
  function rpc(name,args){return new Promise(function(resolve,reject){var r=google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))});r[name].apply(r,args||[])})}
  function image(p,ch){var u=ch==='B2B'?(p.b2bImageUrl||p.b2cImageUrl||p.sharedImageUrl):(p.b2cImageUrl||p.sharedImageUrl);return u?'<img src="'+esc(u)+'" alt="'+esc(p.productName)+'" loading="lazy" onerror="this.remove();this.parentNode.textContent=\'📦\'">':'📦'}
  function availability(p){if(p&&p.availability)return p.availability;var a=p&&p.b2cStatus==='LIVE',b=p&&p.b2bStatus==='LIVE';return a&&b?'BOTH':b?'B2B':'B2C'}
  function manualStatus(p,ch){var k=ch==='B2B'?'b2bOperationalStatus':'b2cOperationalStatus',raw=p&&p[k];if(raw)return raw;return p&&p[(ch==='B2B'?'b2b':'b2c')+'Status']==='LIVE'?'LIVE':'NOT LIVE'}
  function effectiveStatus(p,ch){var k=ch==='B2B'?'b2bEffectiveStatus':'b2cEffectiveStatus';return String(p&&p[k]||manualStatus(p,ch)||'NOT LIVE').toUpperCase()}
  function filtered(){
    var s=val('pcSearch').toLowerCase();
    return PRODUCTS.filter(function(p){
      var av=availability(p);if(FILTER!=='ALL'&&av!==FILTER&&av!=='BOTH')return false;
      if(STATUS_FILTER!=='ALL'&&effectiveStatus(p,'B2C')!==STATUS_FILTER&&effectiveStatus(p,'B2B')!==STATUS_FILTER)return false;
      return !s||[p.productId,p.productName,p.category].some(function(x){return String(x||'').toLowerCase().includes(s)});
    });
  }
  function priceMeta(label,sell,base){sell=Number(sell||0);base=Number(base||0);return label+' ₹'+sell+(base>sell?' · base ₹'+base:'')}
  function chip(ch,status){status=String(status||'NOT LIVE').toUpperCase();var cls=status==='LIVE'?'live':status==='OOS'?'oos':'off';return '<span class="pcChip '+cls+'">'+ch+' '+status+'</span>'}
  function renderList(){
    var host=q('pcList');if(!host)return;var list=filtered();if(q('pcCount'))q('pcCount').textContent=list.length+' / '+PRODUCTS.length+' products';
    host.innerHTML=list.length?list.map(function(p){
      var av=availability(p),b2c=av==='B2C'||av==='BOTH',b2b=av==='B2B'||av==='BOTH',stock=(p.stockTracked&&p.availableQty!=null?' · Stock '+Number(p.availableQty):'');
      return '<div class="pcItem '+(EDITING===p.productId?'active':'')+'" onclick="editProductV951(\''+esc(p.productId)+'\')"><div class="pcThumb">'+image(p,b2c?'B2C':'B2B')+'</div><div><div class="pcName">'+esc(p.productName)+'</div><div class="pcCode">'+esc(p.productId)+' · '+esc(p.category)+' · '+esc(p.unit||'pc')+'</div><div class="pcMeta">'+(b2c?priceMeta('B2C',p.b2cPrice,p.b2cBasePrice):'')+(b2c&&b2b?' · ':'')+(b2b?priceMeta('B2B',p.b2bPrice,p.b2bBasePrice):'')+stock+'</div><div class="pcChips">'+chip('B2C',b2c?effectiveStatus(p,'B2C'):'NOT LIVE')+chip('B2B',b2b?effectiveStatus(p,'B2B'):'NOT LIVE')+'</div></div></div>';
    }).join(''):'<div class="muted" style="padding:14px">No matching products.</div>';
  }
  function preview(id,url,fallback){var h=q(id);if(!h)return;url=String(url||fallback||'').trim();h.innerHTML=url?'<img src="'+esc(url)+'" alt="Product image" onerror="this.parentNode.textContent=\'Image could not be loaded.\'">':'No image selected'}
  function syncSections(){var av=val('pcAvailability')||'B2C',b2c=av==='B2C'||av==='BOTH',b2b=av==='B2B'||av==='BOTH';if(q('pcB2cSection'))q('pcB2cSection').style.display=b2c?'block':'none';if(q('pcB2bSection'))q('pcB2bSection').style.display=b2b?'block':'none';preview('pcB2cPreview',val('pcB2cImage'));preview('pcB2bPreview',val('pcB2bImage'),val('pcB2cImage'))}
  function setTenderGuard(isTender){['pcB2cStatus','pcB2bStatus'].forEach(function(id){var s=q(id);if(!s)return;var o=s.querySelector('option[value="NOT LIVE"]');if(o)o.disabled=!!isTender})}
  function reset(){

    if(q('pcUnit'))q('pcUnit').value='pc';if(q('pcB2cMoq'))q('pcB2cMoq').value='1';if(q('pcB2bMoq'))q('pcB2bMoq').value='20';if(q('pcStep'))q('pcStep').value='1';
    if(q('pcAvailability')){q('pcAvailability').value='B2C';q('pcAvailability').disabled=false}if(q('pcB2cStatus'))q('pcB2cStatus').value='LIVE';if(q('pcB2bStatus'))q('pcB2bStatus').value='LIVE';setTenderGuard(false);
    if(q('pcBarcode'))q('pcBarcode').checked=true;if(q('pcId'))q('pcId').disabled=false;if(q('pcB2cFile'))q('pcB2cFile').value='';if(q('pcB2bFile'))q('pcB2bFile').value='';
    if(q('pcEditorTitle'))q('pcEditorTitle').textContent='Add product';msg('LIVE = visible/orderable when stock exists · NOT LIVE = hidden · OOS = visible but ordering blocked.',true);syncSections();renderList();
  }
  function payload(){return {productId:val('pcId').toUpperCase(),productName:val('pcName'),category:val('pcCategory'),unit:val('pcUnit')||'pc',availability:val('pcAvailability')||'B2C',b2cOperationalStatus:val('pcB2cStatus')||'LIVE',b2bOperationalStatus:val('pcB2bStatus')||'LIVE',b2cBasePrice:num('pcB2cBasePrice'),b2cPrice:num('pcB2cPrice'),b2bBasePrice:num('pcB2bBasePrice'),b2bPrice:num('pcB2bPrice'),b2cMoq:num('pcB2cMoq')||1,b2bMoq:num('pcB2bMoq')||1,qtyStep:num('pcStep')||1,bundleQty1:num('pcBq1'),bundlePrice1:num('pcBp1'),bundleQty2:num('pcBq2'),bundlePrice2:num('pcBp2'),barcodeRequired:checked('pcBarcode')?'YES':'NO',b2cImageUrl:val('pcB2cImage'),b2bImageUrl:val('pcB2bImage'),sortOrder:num('pcSort'),description:val('pcDescription')}}
  async function readFile(file){return await new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(String(r.result||''))};r.onerror=function(){reject(new Error('Unable to read image.'))};r.readAsDataURL(file)})}
  async function uploadIfNeeded(a,file,id){if(!file)return '';if(file.size>3*1024*1024)throw new Error('Each product image must be 3 MB or smaller.');var data=await readFile(file),u=await rpc('uploadProductImageAdminV928',[a.email,a.pin,{productId:id,fileName:file.name,mimeType:file.type,base64:data}]);if(!u||!u.url)throw new Error('Image upload failed.');return u.url}
  window.loadProductsV951=async function(){var a=admin();if(!a.email||!a.pin)return msg('Admin session is required.',false);msg('Loading products and stock status…',true);try{var d=await rpc('getProductsAdminV951',[a.email,a.pin]);PRODUCTS=d&&Array.isArray(d.products)?d.products:[];renderList();msg('Ready · '+PRODUCTS.length+' products · LIVE / NOT LIVE / OOS controls active.',true)}catch(e){msg(e.message,false)}};
  window.editProductV951=function(id){
    var p=PRODUCTS.find(function(x){return x.productId===id});if(!p)return;EDITING=id;
    var map={pcId:p.productId,pcName:p.productName,pcCategory:p.category,pcUnit:p.unit||'pc',pcAvailability:availability(p),pcB2cStatus:manualStatus(p,'B2C'),pcB2bStatus:manualStatus(p,'B2B'),pcB2cBasePrice:p.b2cBasePrice||p.b2cPrice,pcB2cPrice:p.b2cPrice,pcB2bBasePrice:p.b2bBasePrice||p.b2bPrice,pcB2bPrice:p.b2bPrice,pcB2cMoq:p.b2cMoq||1,pcB2bMoq:p.b2bMoq||1,pcStep:p.qtyStep||1,pcBq1:p.bundleQty1,pcBp1:p.bundlePrice1,pcBq2:p.bundleQty2,pcBp2:p.bundlePrice2,pcB2cImage:p.b2cImageUrl||p.sharedImageUrl||'',pcB2bImage:p.b2bImageUrl||'',pcSort:p.sortOrder,pcDescription:p.description};
    Object.keys(map).forEach(function(k){if(q(k))q(k).value=map[k]==null?'':map[k]});q('pcBarcode').checked=p.barcodeRequired==='YES';q('pcId').disabled=true;q('pcAvailability').disabled=id==='TC';setTenderGuard(id==='TC');q('pcEditorTitle').textContent='Edit '+p.productName;if(q('pcB2cFile'))q('pcB2cFile').value='';if(q('pcB2bFile'))q('pcB2bFile').value='';syncSections();renderList();
    var note=id==='TC'?'Tender Coconut stays in both apps. Use OOS when unavailable; full NOT LIVE is protected.':'Choose LIVE, NOT LIVE or OOS separately for each enabled channel.';if(p.stockTracked)note+=' Current tracked stock: '+Number(p.availableQty||0)+'.';msg(note,true);q('pcEditor').scrollIntoView({behavior:'smooth',block:'start'});
  };
  window.saveProductV951=async function(){
    var a=admin(),p=payload(),btn=q('pcSave');if(!p.productId||!p.productName||!p.category)return msg('Product ID, name and category are required.',false);
    var b2c=p.availability==='B2C'||p.availability==='BOTH',b2b=p.availability==='B2B'||p.availability==='BOTH';
    if(b2c&&p.b2cPrice<=0)return msg('Enter a B2C selling price.',false);if(b2b&&p.b2bPrice<=0)return msg('Enter a B2B selling price.',false);
    if(b2c&&p.b2cBasePrice>0&&p.b2cBasePrice<p.b2cPrice)return msg('B2C Base Price must be equal to or higher than Selling Price.',false);
    if(b2b&&p.b2bBasePrice>0&&p.b2bBasePrice<p.b2bPrice)return msg('B2B Base Price must be equal to or higher than Selling Price.',false);
    btn.disabled=true;btn.textContent='Saving…';
    try{
      var f1=q('pcB2cFile')&&q('pcB2cFile').files[0],f2=q('pcB2bFile')&&q('pcB2bFile').files[0];
      if(f1){msg('Uploading B2C image…',true);p.b2cImageUrl=await uploadIfNeeded(a,f1,p.productId);q('pcB2cImage').value=p.b2cImageUrl}
      if(f2){msg('Uploading B2B image…',true);p.b2bImageUrl=await uploadIfNeeded(a,f2,p.productId);q('pcB2bImage').value=p.b2bImageUrl}
      var r=await rpc('saveProductAdminV951',[a.email,a.pin,p]);if(!r||r.success===false)throw new Error(r&&r.error||'Product could not be saved.');msg((r.created?'Created ':'Updated ')+(r.product&&r.product.productName||p.productName)+'. Status saved by channel.',true);await window.loadProductsV951();window.editProductV951(p.productId);
    }catch(e){msg(e.message,false)}finally{btn.disabled=false;btn.textContent='Save product'}
  };
  window.setProductFilterV951=function(v){FILTER=v||'ALL';renderList()};window.setProductStatusFilterV951=function(v){STATUS_FILTER=v||'ALL';renderList()};window.searchProductsV951=renderList;window.syncProductChannelsV951=syncSections;window.previewProductChannelsV951=syncSections;window.resetProductV951=reset;
  function statusSelect(id){return '<select id="'+id+'" class="pcStatusSelect"><option value="LIVE">LIVE</option><option value="NOT LIVE">NOT LIVE</option><option value="OOS">OOS — Out of Stock</option></select>'}
  function panelHtml(){return '<div id="adminProductsV951"><div class="pcHead"><div><h3 style="margin:0">Products</h3><div class="muted">Channel, price and operational status control for B2C + B2B.</div></div><div class="pcActions"><button class="secondary" type="button" onclick="loadProductsV951()">Refresh</button><button type="button" onclick="resetProductV951()">+ Add product</button></div></div><div class="pcToolbar"><input id="pcSearch" placeholder="Search product, ID or category" oninput="searchProductsV951()"><select onchange="setProductFilterV951(this.value)"><option value="ALL">All channels</option><option value="B2C">B2C products</option><option value="B2B">B2B products</option></select><select onchange="setProductStatusFilterV951(this.value)"><option value="ALL">All statuses</option><option value="LIVE">LIVE</option><option value="OOS">OOS</option><option value="NOT LIVE">NOT LIVE</option></select><span id="pcCount" class="muted"></span></div><div class="pcLayout"><div id="pcList" class="pcList"></div><div id="pcEditor" class="pcEditor"><div class="pcHead"><h3 id="pcEditorTitle" style="margin:0">Add product</h3><button class="secondary" type="button" onclick="resetProductV951()">Clear</button></div><div id="pcMsg" class="pcMessage"></div><div class="pcSection"><h4>1. Product</h4><div class="pcGrid"><div><label>Product ID</label><input id="pcId" placeholder="MILK500"></div><div><label>Product name</label><input id="pcName" placeholder="Fresh Milk 500 ml"></div><div><label>Category</label><input id="pcCategory" placeholder="Milk / Grocery / Coconuts"></div><div><label>Unit</label><input id="pcUnit" value="pc" placeholder="pc, pack, litre"></div></div></div><div class="pcSection"><h4>2. Where should we sell it?</h4><select id="pcAvailability" class="pcAvailability" onchange="syncProductChannelsV951()"><option value="B2C">B2C only — Customers</option><option value="BOTH">Both — Customers + Vendors</option><option value="B2B">B2B only — Vendors</option></select><div class="pcHint">Channel selection is separate from status. OOS keeps the product visible but blocks ordering.</div></div><div id="pcB2cSection" class="pcSection"><h4>3A. B2C customer app</h4><div class="pcGrid"><div class="pcFull"><label>B2C Status</label>'+statusSelect('pcB2cStatus')+'</div><div class="pcStatusHelp"><b>LIVE</b> = shown and orderable when stock exists · <b>NOT LIVE</b> = hidden from customers · <b>OOS</b> = shown as Out of Stock and cannot be ordered.</div><div><label>Base price ₹ <span class="muted">(customer visible)</span></label><input id="pcB2cBasePrice" type="number" min="0" step="0.01" placeholder="e.g. 65"></div><div><label>Selling price ₹ <span class="muted">(charged)</span></label><input id="pcB2cPrice" type="number" min="0" step="0.01" placeholder="e.g. 60"></div><div class="pcPriceHint">When Base Price is higher than Selling Price, customers see the base price crossed out and the saving. If left blank, Base Price defaults to Selling Price and no fake discount is shown.</div><div><label>Minimum quantity</label><input id="pcB2cMoq" type="number" min="1" value="1"></div><div></div><div><label>Offer qty 1</label><input id="pcBq1" type="number" min="0"></div><div><label>Offer total price 1 ₹</label><input id="pcBp1" type="number" min="0" step="0.01"></div><div><label>Offer qty 2</label><input id="pcBq2" type="number" min="0"></div><div><label>Offer total price 2 ₹</label><input id="pcBp2" type="number" min="0" step="0.01"></div><div class="pcFull"><label>B2C image URL</label><input id="pcB2cImage" placeholder="Paste URL or upload below" oninput="previewProductChannelsV951()"><input id="pcB2cFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-top:6px"><div id="pcB2cPreview" class="pcPreview">No image selected</div></div></div></div><div id="pcB2bSection" class="pcSection"><h4>3B. B2B vendor app</h4><div class="pcGrid"><div class="pcFull"><label>B2B Status</label>'+statusSelect('pcB2bStatus')+'</div><div class="pcStatusHelp"><b>LIVE</b> = shown and orderable when stock exists · <b>NOT LIVE</b> = hidden from vendors · <b>OOS</b> = shown as Out of Stock and cannot be ordered.</div><div><label>Base price ₹ <span class="muted">(vendor visible)</span></label><input id="pcB2bBasePrice" type="number" min="0" step="0.01" placeholder="e.g. 43"></div><div><label>Default selling price ₹ <span class="muted">(charged)</span></label><input id="pcB2bPrice" type="number" min="0" step="0.01" placeholder="e.g. 40"></div><div class="pcPriceHint">Vendors see the crossed-out Base Price only when it is above their current selling/negotiated price. Vendor-specific negotiated pricing can still override the default selling price.</div><div><label>Vendor MOQ</label><input id="pcB2bMoq" type="number" min="1" value="20"></div><div><label>Quantity step</label><input id="pcStep" type="number" min="1" value="1"></div><div class="pcFull"><label>B2B image URL <span class="muted">(optional)</span></label><input id="pcB2bImage" placeholder="Leave blank to use the B2C/shared image" oninput="previewProductChannelsV951()"><input id="pcB2bFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-top:6px"><div id="pcB2bPreview" class="pcPreview">Uses B2C/shared image when blank</div><div class="pcHint">Only add a separate B2B image when vendors need a different pack/bulk visual.</div></div></div></div><details><summary>Optional operations settings</summary><div class="pcGrid" style="margin-top:9px"><div><label>Sort order</label><input id="pcSort" type="number" min="0"></div><div><label><input id="pcBarcode" type="checkbox" checked style="width:auto"> Barcode required</label></div><div class="pcFull"><label>Description</label><textarea id="pcDescription" placeholder="Short product description"></textarea></div></div></details><div class="pcActions" style="margin-top:12px"><button id="pcSave" type="button" onclick="saveProductV951()">Save product</button><span class="pcHint">Selling price powers checkout; Base Price is presentation only.</span></div></div></div></div>'}
  window.openAdminProductsV951=function(){var dash=q('dash'),tabs=dash&&dash.querySelector('.tabs'),p=q('adminProductsPanel');if(!tabs||!p)return;['orders','customers','feedback','tickets','delivery','routeplan','access','adminBarcodePanel','vendorPricingPanel','adminGrowthPanel'].forEach(function(id){var x=q(id);if(x)x.classList.add('hidden')});tabs.querySelectorAll('button').forEach(function(b){b.classList.remove('active')});var t=q('tAdminProducts');if(t)t.classList.add('active');p.classList.remove('hidden');if(!q('adminProductsV951')){p.innerHTML=panelHtml();reset()}window.loadProductsV951()}
