<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root{--green:#126b32;--green2:#0b4f24;--mint:#eaf7ef;--bg:#f5f7f6;--ink:#17231b;--muted:#68746c;--line:#dfe7e1;--blue:#eaf5ff;--red:#b42318;--amber:#9a6700}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
    button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
    .top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 14px #163a2012}
    .brand{height:72px;padding:12px 22px;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;object-fit:contain}.brand b{font-size:20px;color:var(--green2)}.brand small{display:block;color:var(--muted);margin-top:3px}.spacer{flex:1}
    .identity{display:flex;align-items:center;gap:12px;min-width:0}.identityText{min-width:0}.identityText strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;background:var(--mint);color:var(--green2);font-size:12px;font-weight:800}.due{background:#fff0ed;color:var(--red)}
    .tabs{display:flex;overflow:auto;padding:0 16px;border-top:1px solid #eef2ef}.tabs button{border:0;background:transparent;padding:15px 18px;color:#546159;white-space:nowrap;border-bottom:3px solid transparent;font-weight:700}.tabs button.active{color:var(--green);border-color:var(--green)}
    .wrap{max-width:1500px;margin:auto;padding:18px}.login{max-width:430px;margin:8vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 50px #163a2015}.login input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 13px;margin:5px 0}.primary{border:0;background:var(--green);color:#fff;border-radius:12px;padding:12px 18px;font-weight:800}.login .primary{width:100%;margin-top:8px}
    .searchbar{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px}.searchbar input{flex:1;min-width:160px;border:0;outline:0;font-size:16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 6px 22px #163a200b}.empty{padding:36px;text-align:center;color:var(--muted)}
    .results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.result{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left}.result:hover{border-color:#91caa4;background:#fbfefc}.result b{display:block}.result small{display:block;color:var(--muted);margin-top:5px}.result .mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;font-size:20px;margin-top:5px}
    .profileGrid{display:grid;grid-template-columns:1.1fr 1.25fr 1fr 1fr;gap:12px}.section h3{margin:0 0 12px}.kv{padding:9px 0;border-top:1px solid #edf1ee}.kv:first-of-type{border-top:0}.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.kv b{display:block;margin-top:4px;word-break:break-word}.photo{width:100%;height:150px;object-fit:cover;border-radius:12px;background:#eef3ef}
    .ordersLayout{display:grid;grid-template-columns:minmax(330px,43%) 1fr;gap:12px;min-height:570px}.orderList{padding:0;overflow:hidden}.orderFilters{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--line);overflow:auto}.orderFilters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;white-space:nowrap}.orderFilters button.active{background:var(--green);color:#fff;border-color:var(--green)}.orderRows{max-height:650px;overflow:auto}.orderRow{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px;text-align:left}.orderRow.active{background:var(--mint);box-shadow:inset 4px 0 var(--green)}.orderRow:hover{background:#f8fbf9}.orderTop{display:flex;justify-content:space-between;gap:8px}.orderItems{color:var(--muted);font-size:12px;margin-top:8px}.status{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef3f0;font-size:11px;font-weight:800}.status.delivered{background:#e7f8eb;color:#176b2e}.status.cancelled{background:#fff0ed;color:var(--red)}
    .detailHead{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:13px}.detailGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:8px}.detailGrid .kv{padding:13px;border-bottom:1px solid #edf1ee}.itemTable{width:100%;border-collapse:collapse;margin-top:14px}.itemTable th,.itemTable td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.itemTable th{color:var(--muted);font-size:11px;text-transform:uppercase}.right{text-align:right!important}
    .simpleTable{width:100%;border-collapse:collapse}.simpleTable th,.simpleTable td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.simpleTable th{color:var(--muted)}
    .toast{position:fixed;right:18px;bottom:18px;background:#173d24;color:#fff;padding:12px 16px;border-radius:12px;z-index:30}
    @media(max-width:1100px){.results{grid-template-columns:repeat(2,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.profileGrid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.brand{height:auto;padding:10px 14px}.identity .badge{display:none}.wrap{padding:10px}.results{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}.profileGrid{grid-template-columns:1fr}.ordersLayout{grid-template-columns:1fr}.orderRows{max-height:360px}.detailGrid{grid-template-columns:repeat(2,1fr)}.tabs{padding:0}.tabs button{padding:13px 12px}.spacer{display:none}.brand small{font-size:10px}}
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><div><b>🥥 Native Elaneeru Customer 360</b><small>Vendor intelligence • Orders • Credit • Service</small></div><div class="spacer"></div><div id="identity" class="identity hidden"><div class="identityText"><strong id="headName"></strong><small id="headMeta"></small></div><span id="headStatus" class="badge"></span></div></div>
    <div id="tabs" class="tabs hidden"><button class="active" data-tab="profile">Customer Profile</button><button data-tab="orders">Orders</button><button data-tab="credit">Credit & Collections</button><button data-tab="tickets">Tickets & Interactions</button><button data-tab="pricing">Vendor Prices</button></div>
  </div>
  <main class="wrap">
    <section id="login" class="login"><h2>Admin Login</h2><p class="muted">Customer and order information is restricted to authorized operations staff.</p><input id="email" type="email" autocomplete="username" placeholder="Admin email"><input id="pin" type="password" autocomplete="current-password" placeholder="Admin PIN"><button id="loginBtn" class="primary">Open Customer 360</button><div id="loginMsg" class="muted" style="margin-top:9px"></div></section>
    <section id="app" class="hidden">
      <div class="searchbar"><span aria-hidden="true">🔎</span><input id="query" placeholder="Search business, owner, mobile, Vendor ID, area or pincode"><button id="searchBtn" class="primary">Search</button></div>
      <div id="searchResults" class="results"></div>
      <div id="workspace" class="hidden"><div id="summary" class="summary"></div><div id="profile" class="tabPane"></div><div id="orders" class="tabPane hidden"></div><div id="credit" class="tabPane hidden"></div><div id="tickets" class="tabPane hidden"></div><div id="pricing" class="tabPane hidden"></div></div>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
<script>
(function(){
  'use strict';
  let AUTH={email:'',pin:''},DATA=null,FILTER='ALL',SELECTED='';
  const $=id=>document.getElementById(id),safe=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
  function call(fn,args){return new Promise((resolve,reject)=>{try{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));runner[fn].apply(runner,args||[])}catch(e){reject(e)}})}
  function toast(msg){const x=$('toast');x.textContent=msg;x.classList.remove('hidden');clearTimeout(window._c360t);window._c360t=setTimeout(()=>x.classList.add('hidden'),2800)}
  async function login(){const email=$('email').value.trim().toLowerCase(),pin=$('pin').value.trim(),b=$('loginBtn');if(!email||pin.length<4){$('loginMsg').textContent='Enter your Admin email and PIN.';return}b.disabled=true;b.textContent='Signing in…';try{const ok=await call('adminLogin',[email,pin]);if(ok!==true)throw new Error('Invalid Admin email or PIN.');AUTH={email,pin};$('login').classList.add('hidden');$('app').classList.remove('hidden');$('query').focus()}catch(e){$('loginMsg').textContent=e.message}finally{b.disabled=false;b.textContent='Open Customer 360'}}
  async function search(){const q=$('query').value.trim(),host=$('searchResults'),b=$('searchBtn');b.disabled=true;b.textContent='Searching…';host.innerHTML='<div class="card empty">Loading vendors…</div>';try{const d=await call('searchCustomer360V947',[AUTH.email,AUTH.pin,q]);const rows=d&&Array.isArray(d.vendors)?d.vendors:[];host.innerHTML=rows.length?rows.map(v=>'<button class="result" data-id="'+safe(v.vendorId)+'"><b>'+safe(v.businessName||v.ownerName||'Unnamed vendor')+'</b><small>'+safe(v.ownerName)+' • '+safe(v.mobile)+'</small><small>'+safe([v.area,v.pincode,v.vendorId].filter(Boolean).join(' • '))+'</small><div class="mini"><span class="badge">'+safe(v.status||'UNKNOWN')+'</span><span class="badge">'+Number(v.orderCount||0)+' orders</span><span class="badge">'+money(v.lifetimeValue)+'</span></div></button>').join(''):'<div class="card empty">No matching vendor found.</div>';host.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openVendor(x.dataset.id))}catch(e){host.innerHTML='<div class="card empty">'+safe(e.message)+'</div>'}finally{b.disabled=false;b.textContent='Search'}}
  async function openVendor(id){$('searchResults').innerHTML='<div class="card empty">Loading complete vendor profile…</div>';try{DATA=await call('getCustomer360ProfileV947',[AUTH.email,AUTH.pin,id]);if(!DATA||DATA.success===false)throw new Error(DATA&&DATA.error||'Profile unavailable.');SELECTED='';FILTER='ALL';render();$('workspace').classList.remove('hidden');$('tabs').classList.remove('hidden');$('identity').classList.remove('hidden');$('searchResults').innerHTML='';showTab('profile')}catch(e){toast(e.message)}}
  function render(){const v=DATA.vendor||{},m=DATA.metrics||{};$('headName').textContent=v.businessName||v.ownerName||v.vendorId;$('headMeta').textContent=[v.ownerName,v.mobile,v.vendorId].filter(Boolean).join(' • ');$('headStatus').textContent=v.status||'UNKNOWN';$('summary').innerHTML=[['Lifetime GMV',money(m.lifetimeGmv)],['Orders',m.orderCount||0],['Delivered',m.delivered||0],['Avg. Order',money(m.averageOrderValue)],['Outstanding',money(v.outstanding)],['Last Order',m.lastOrder||'—']].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');renderProfile();renderOrders();renderCredit();renderTickets();renderPricing()}
  function kv(k,v){return '<div class="kv"><span>'+safe(k)+'</span><b>'+safe(v||'—')+'</b></div>'}
  function renderProfile(){const v=DATA.vendor||{},m=DATA.metrics||{};$('profile').innerHTML='<div class="profileGrid"><section class="card section"><h3>Business Information</h3>'+kv('Business name',v.businessName)+kv('Owner',v.ownerName)+kv('Vendor type',v.vendorType)+kv('Status',v.status)+kv('Onboarding ID',v.onboardingId)+kv('Created',v.createdAt)+'</section><section class="card section"><h3>Delivery Information</h3>'+kv('Address',v.address)+kv('Area',v.area)+kv('Pincode',v.pincode)+kv('Delivery frequency',v.deliveryFrequency)+kv('Preferred time',v.preferredTime)+(v.mapUrl?'<a class="primary" style="display:inline-block;text-decoration:none;margin-top:10px" target="_blank" rel="noopener" href="'+safe(v.mapUrl)+'">Open location</a>':'')+'</section><section class="card section"><h3>Customer Information</h3>'+kv('Mobile',v.mobile)+kv('WhatsApp',v.whatsapp)+kv('Payment type',v.paymentType)+kv('Credit days',v.creditDays)+kv('Credit limit',money(v.creditLimit))+kv('MOQ',v.moq)+'</section><section class="card section"><h3>Business History</h3>'+kv('Order frequency',m.frequency)+kv('Lifetime GMV',money(m.lifetimeGmv))+kv('Delivered orders',m.delivered)+kv('Cancelled orders',m.cancelled)+kv('Return rate',Number(m.returnRate||0).toFixed(1)+'%')+kv('Last activity',m.lastOrder)+'</section></div>'}
  function statusClass(s){s=String(s||'').toLowerCase();return s.includes('deliver')?'delivered':s.includes('cancel')?'cancelled':''}
  function filteredOrders(){const rows=Array.isArray(DATA.orders)?DATA.orders:[];if(FILTER==='ALL')return rows;return rows.filter(o=>String(o.status||'').toUpperCase().includes(FILTER))}
  function renderOrders(){const rows=filteredOrders();if(!SELECTED&&rows.length)SELECTED=rows[0].orderId;const sel=(DATA.orders||[]).find(o=>o.orderId===SELECTED)||rows[0];$('orders').innerHTML='<div class="ordersLayout"><section class="card orderList"><div class="orderFilters">'+['ALL','PENDING','DELIVERED','CANCELLED'].map(f=>'<button data-filter="'+f+'" class="'+(FILTER===f?'active':'')+'">'+f[0]+f.slice(1).toLowerCase()+'</button>').join('')+'</div><div class="orderRows">'+(rows.length?rows.map(o=>'<button class="orderRow '+(o.orderId===SELECTED?'active':'')+'" data-order="'+safe(o.orderId)+'"><div class="orderTop"><b>'+safe(o.orderId)+'</b><span class="status '+statusClass(o.status)+'">'+safe(o.status)+'</span></div><div class="muted">'+safe(o.orderedAt)+' • '+money(o.totalAmount)+'</div><div class="orderItems">'+safe((o.items||[]).map(i=>i.productName+' × '+i.quantity).join(' | ')||'No line items')+'</div></button>').join(''):'<div class="empty">No orders in this status.</div>')+'</div></section><section id="orderDetail" class="card">'+orderDetail(sel)+'</section></div>';$('orders').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{FILTER=b.dataset.filter;SELECTED='';renderOrders()});$('orders').querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{SELECTED=b.dataset.order;renderOrders()})}
  function orderDetail(o){if(!o)return '<div class="empty">Select an order to view details.</div>';const items=Array.isArray(o.items)?o.items:[];return '<div class="detailHead"><div><h2 style="margin:0">'+safe(o.orderId)+'</h2><div class="muted">Created '+safe(o.orderedAt)+'</div></div><span class="status '+statusClass(o.status)+'">'+safe(o.status)+'</span></div><table class="itemTable"><thead><tr><th>Product</th><th class="right">Qty</th><th class="right">Unit price</th><th class="right">Line total</th></tr></thead><tbody>'+items.map(i=>'<tr><td><b>'+safe(i.productName)+'</b><br><span class="muted">'+safe(i.productId)+' • '+safe(i.unit)+'</span></td><td class="right">'+Number(i.quantity||0)+'</td><td class="right">'+money(i.unitPrice)+'</td><td class="right">'+money(i.lineAmount)+'</td></tr>').join('')+'</tbody></table><div class="detailGrid">'+kv('Total amount',money(o.totalAmount))+kv('Payment type',o.paymentType)+kv('Payment status',o.paymentStatus)+kv('Delivery slot',o.deliverySlot)+kv('Address',o.address)+kv('Area / Pincode',[o.area,o.pincode].filter(Boolean).join(' • '))+kv('Delivered quantity',o.deliveredQuantity)+kv('Updated',o.updatedAt)+kv('Source',o.source)+'</div>'}
  function renderCredit(){const v=DATA.vendor||{},rows=Array.isArray(DATA.collections)?DATA.collections:[];$('credit').innerHTML='<div class="summary">'+[['Credit limit',money(v.creditLimit)],['Outstanding',money(v.outstanding)],['Available credit',money(Math.max(0,Number(v.creditLimit||0)-Number(v.outstanding||0)))],['Credit days',v.creditDays||0]].map(x=>'<div class="metric"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><section class="card"><h3>Collection History</h3><table class="simpleTable"><tr><th>Date</th><th>Reference</th><th>Method</th><th>Status</th><th>Amount</th></tr>'+rows.map(r=>'<tr><td>'+safe(r.date)+'</td><td>'+safe(r.reference)+'</td><td>'+safe(r.method)+'</td><td>'+safe(r.status)+'</td><td>'+money(r.amount)+'</td></tr>').join('')+'</table>'+(rows.length?'':'<div class="empty">No collection records.</div>')+'</section>'}
  function renderTickets(){const rows=Array.isArray(DATA.tickets)?DATA.tickets:[];$('tickets').innerHTML='<section class="card"><h3>Tickets & Interactions</h3><table class="simpleTable"><tr><th>Ticket</th><th>Created</th><th>Category</th><th>Order</th><th>Priority</th><th>Status</th></tr>'+rows.map(r=>'<tr><td><b>'+safe(r.ticketId)+'</b><br><span class="muted">'+safe(r.description)+'</span></td><td>'+safe(r.createdAt)+'</td><td>'+safe([r.category,r.subject].filter(Boolean).join(' › '))+'</td><td>'+safe(r.orderId)+'</td><td>'+safe(r.priority)+'</td><td>'+safe(r.status)+'</td></tr>').join('')+'</table>'+(rows.length?'':'<div class="empty">No vendor tickets recorded.</div>')+'</section>'}
  function renderPricing(){const rows=Array.isArray(DATA.pricing)?DATA.pricing:[];$('pricing').innerHTML='<section class="card"><h3>Effective Vendor Pricing</h3><p class="muted">Agreed price overrides the default Business price while the pricing record is active.</p><table class="simpleTable"><tr><th>Product</th><th>Default B2B</th><th>Agreed price</th><th>Effective price</th><th>MOQ</th><th>Step</th><th>Status</th></tr>'+rows.map(r=>'<tr><td><b>'+safe(r.productName)+'</b><br><span class="muted">'+safe(r.productId)+'</span></td><td>'+money(r.defaultPrice)+'</td><td>'+(r.agreedPrice?money(r.agreedPrice):'—')+'</td><td><b>'+money(r.effectivePrice)+'</b></td><td>'+Number(r.moq||0)+'</td><td>'+Number(r.qtyStep||0)+'</td><td>'+safe(r.status)+'</td></tr>').join('')+'</table>'+(rows.length?'':'<div class="empty">No active products found.</div>')+'</section>'}
  function showTab(name){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.tabPane').forEach(p=>p.classList.toggle('hidden',p.id!==name))}
  $('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};$('searchBtn').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
})();
</script>
</body>
</html>
