<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Sales</title><style>:root{--g:#075b34;--g2:#15924e;--bg:#f4f7f4;--card:#fff;--line:#e1e8e2;--ink:#17241c;--muted:#6c776f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:var(--ink)}header{background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:18px 20px}header .in{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950}.sub{font-size:12px;opacity:.82}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 3px 14px #00000008}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-bottom:14px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.btn{border:0;background:var(--g);color:#fff;border-radius:11px;padding:12px 16px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{min-height:100px}.kpi small{color:var(--muted);font-weight:800}.kpi b{display:block;font-size:28px;margin-top:8px}.delta{font-size:11px;color:var(--g);margin-top:3px}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:12px;margin-top:12px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionTitle h3{margin:0}.row{display:grid;grid-template-columns:92px 1fr 92px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1ed;font-size:12px}.bar{height:10px;background:#ebf0ec;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--g),#56b768);border-radius:99px}.area{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1ed}.empty{color:var(--muted);padding:26px;text-align:center}.msg{margin:10px 0;color:#9a3412;font-size:12px}@media(max-width:800px){.login{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:420px){.kpis{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><header><div class="in"><div><div class="brand">🥥 Native Elaneeru · Sales</div><div class="sub">B2C + B2B performance control centre</div></div><div style="font-size:28px">📈</div></div></header><main class="wrap"><div class="card login"><input id="email" class="field" placeholder="Admin email"><input id="pin" class="field" type="password" placeholder="Admin PIN"><button id="loadBtn" class="btn" onclick="load()">Open dashboard</button></div><div id="msg" class="msg"></div><section id="dash" style="display:none"><div id="kpis" class="kpis"></div><div class="grid"><div class="card"><div class="sectionTitle"><h3>Revenue trend</h3><span id="version" class="sub"></span></div><div id="daily"></div></div><div class="card"><div class="sectionTitle"><h3>Top areas</h3><span class="sub">by revenue</span></div><div id="areas"></div></div></div></section></main><script>const $=id=>document.getElementById(id),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}async function load(){const b=$('loadBtn');b.disabled=true;b.textContent='Loading…';$('msg').textContent='';try{const d=await rpc('getV7SalesDashboard',[$('email').value.trim(),$('pin').value]);const m=d?.metrics||{revenue:0,orders:0,b2b:0,b2c:0,pending:0,delivered:0},v=d?.vendors||{active:0,total:0,outstanding:0};$('dash').style.display='block';$('version').textContent=d.version?'V'+d.version:'';$('kpis').innerHTML=[['Total revenue',money(m.revenue),'Across active orders'],['Orders',m.orders,'B2B '+m.b2b+' · B2C '+m.b2c],['Delivered',m.delivered,'Pending '+m.pending],['Outstanding',money(v.outstanding),v.active+' / '+v.total+' B2B accounts active']].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b><div class="delta">${x[2]}</div></div>`).join('');const daily=Array.isArray(d.daily)?d.daily:[],mx=Math.max(1,...daily.map(x=>Number(x.revenue)||0));$('daily').innerHTML=daily.length?daily.map(x=>`<div class="row"><span>${esc(x.date)}</span><div class="bar"><i style="width:${Math.max(2,(Number(x.revenue)||0)/mx*100)}%"></i></div><b>${money(x.revenue)}</b></div>`).join(''):'<div class="empty">No revenue data yet.</div>';const areas=Array.isArray(d.areas)?d.areas:[];$('areas').innerHTML=areas.length?areas.slice(0,10).map(x=>`<div class="area"><span>${esc(x.area||'Unknown')}</span><b>${money(x.revenue)}</b></div>`).join(''):'<div class="empty">No area data yet.</div>'}catch(e){$('msg').textContent=e.message}finally{b.disabled=false;b.textContent='Open dashboard'}}</script></body></html>
