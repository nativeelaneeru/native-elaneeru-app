<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><title>Native Elaneeru Sales</title><style>
:root{--g:#0b6b3a;--g2:#15924e;--bg:#f5f7f5;--card:#fff;--line:#e1e8e2;--ink:#17241c;--muted:#6c776f;--shadow:0 10px 28px rgba(14,72,41,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}header{background:linear-gradient(135deg,#075d32,#14904d);color:#fff;padding:18px 20px}header .in{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:950}.sub{font-size:12px;opacity:.82}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 2px 12px #00000008}.login{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-bottom:14px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit;outline:none}.field:focus{border-color:#60a878;box-shadow:0 0 0 3px #e7f5eb}.btn{border:0;background:var(--g);color:white;border-radius:11px;padding:12px 16px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{min-height:100px}.kpi small{color:var(--muted);font-weight:800}.kpi b{display:block;font-size:28px;margin-top:8px;letter-spacing:-.5px}.kpi .delta{font-size:11px;color:var(--g);margin-top:3px}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:12px;margin-top:12px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionTitle h3{margin:0}.row{display:grid;grid-template-columns:92px 1fr 92px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #edf1ed;font-size:12px}.bar{height:10px;background:#ebf0ec;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--g),#56b768);border-radius:99px}.area{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1ed}.area:last-child,.row:last-child{border:0}.empty{color:var(--muted);padding:26px;text-align:center}.msg{margin:10px 0;color:#9a3412;font-size:12px}@media(max-width:800px){.login{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:22px}.wrap{padding:12px}}
</style></head><body><header><div class="in"><div><div class="brand">Native Elaneeru · Sales</div><div class="sub">B2C + B2B performance control centre</div></div><div style="font-size:28px">📈</div></div></header><main class="wrap"><div class="card login"><input id="email" class="field" type="email" autocomplete="username" placeholder="Admin email"><input id="pin" class="field" type="password" autocomplete="current-password" placeholder="Admin PIN"><button id="loadBtn" class="btn" onclick="load()">Open dashboard</button></div><div id="msg" class="msg"></div><section id="dash" style="display:none"><div id="kpis" class="kpis"></div><div class="grid"><div class="card"><div class="sectionTitle"><h3>Revenue trend</h3><span id="version" class="sub"></span></div><div id="daily"></div></div><div class="card"><div class="sectionTitle"><h3>Top areas</h3><span class="sub">by revenue</span></div><div id="areas"></div></div></div></section></main><script>
const $=id=>document.getElementById(id),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),call=(f,a=[])=>new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>j(new Error(e&&e.message?e.message:String(e))))[f](...a));
async function load(){const b=$('loadBtn');b.disabled=true;b.textContent='Loading…';$('msg').textContent='';try{const email=String($('email').value||'').trim().toLowerCase(),pin=String($('pin').value||'').trim();if(!email||pin.length<4)throw new Error('Enter your Admin email and PIN.');const raw=await call('getV7SalesDashboard',[email,pin]),d=raw&&typeof raw==='object'?raw:{},m=d.metrics&&typeof d.metrics==='object'?d.metrics:{revenue:0,orders:0,b2b:0,b2c:0,pending:0,delivered:0},v=d.vendors&&typeof d.vendors==='object'?d.vendors:{active:0,total:0,outstanding:0},daily=Array.isArray(d.daily)?d.daily:[],areas=Array.isArray(d.areas)?d.areas:[];$('dash').style.display='block';$('version').textContent=d.version?'V'+d.version:'';$('kpis').innerHTML=[['Total revenue',money(m.revenue),'Across active orders'],['Orders',Number(m.orders)||0,'B2B '+(Number(m.b2b)||0)+' · B2C '+(Number(m.b2c)||0)],['Delivered',Number(m.delivered)||0,'Pending '+(Number(m.pending)||0)],['Outstanding',money(v.outstanding),(Number(v.active)||0)+' / '+(Number(v.total)||0)+' vendors active']].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b><div class="delta">${x[2]}</div></div>`).join('');const mx=Math.max(1,...daily.map(x=>Number(x&&x.revenue)||0));$('daily').innerHTML=daily.length?daily.map(x=>`<div class="row"><span>${esc(x&&x.date)}</span><div class="bar"><i style="width:${Math.max(2,(Number(x&&x.revenue)||0)/mx*100)}%"></i></div><b>${money(x&&x.revenue)}</b></div>`).join(''):'<div class="empty">No revenue data yet.</div>';$('areas').innerHTML=areas.length?areas.slice(0,10).map(x=>`<div class="area"><span>${esc(x&&x.area||'Unknown')}</span><b>${money(x&&x.revenue)}</b></div>`).join(''):'<div class="empty">No area data yet.</div>'}catch(e){$('dash').style.display='none';$('msg').textContent=e&&e.message?e.message:String(e)}finally{b.disabled=false;b.textContent='Open dashboard'}}
</script></body></html>
