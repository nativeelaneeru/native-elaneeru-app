<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Admin</title><style>:root{--g:#075b34;--bg:#f4f7f4;--line:#dfe7e1;--muted:#68766d;--ink:#142019;--warn:#9a6700;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:14px 18px}.topIn{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:21px;font-weight:950}.sub{font-size:11px;opacity:.82}.wrap{max-width:1280px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px;box-shadow:0 4px 16px #0000000a}.login{max-width:420px;margin:48px auto}.field,input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.btn,button{border:0;border-radius:10px;padding:10px 12px;background:var(--g);color:#fff;font-weight:900}.alt{background:#edf7f0;color:var(--g)}.danger{background:#fff1f0;color:var(--bad)}.hide{display:none!important}.filters{display:grid;grid-template-columns:180px 1fr 1fr auto;gap:8px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px}.metric span{font-size:10px;color:var(--muted)}.metric b{display:block;font-size:20px;margin-top:4px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.tabs button{white-space:nowrap;background:#edf7f0;color:var(--g)}.tabs .on{background:var(--g);color:#fff}.order,.rowLine{padding:11px 0;border-bottom:1px solid var(--line)}.order:last-child,.rowLine:last-child{border:0}.topline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.badge{display:inline-block;background:#eaf7ee;color:var(--g);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions select{width:auto;min-width:160px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.partner{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px}.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.qaitem{border:1px solid var(--line);border-radius:13px;padding:10px}.qaitem.pass{background:#eff9f2}.qaitem.fail{background:#fff3f1}.statusGood{color:var(--g)}.statusBad{color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #edf1ed;text-align:left;font-size:12px}th{color:var(--muted)}.toast{position:fixed;right:16px;bottom:16px;background:#173d24;color:#fff;padding:10px 13px;border-radius:10px;opacity:0;z-index:99}.toast.show{opacity:1}@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1}.qa,.grid3{grid-template-columns:1fr}}@media(max-width:520px){.metrics{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.wrap{padding:10px}}</style></head><body><div class="top"><div class="topIn"><div><div class="brand">🥥 Native Elaneeru Admin</div><div class="sub">Sri Govindadri Ventures · V9 Launch Control</div></div><button class="alt" onclick="runPreflight()">Launch QA</button></div></div><main class="wrap"><section id="login" class="card login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pin" type="password" placeholder="PIN" style="margin-top:8px"><button id="loginBtn" style="width:100%;margin-top:9px" onclick="doLogin()">Login</button><div id="msg" class="meta"></div></section><section id="app" class="hide"><div class="card filters"><select id="preset" onchange="rangePreset()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This Week</option><option value="month">This Month</option><option value="custom">Custom</option></select><input id="start" type="date"><input id="end" type="date"><button onclick="refresh()">Refresh</button></div><div id="metrics" class="metrics"></div><div class="tabs"><button class="on" data-tab="orders" onclick="tab('orders')">Orders</button><button data-tab="customers" onclick="tab('customers')">Customers</button><button data-tab="delivery" onclick="tab('delivery')">Delivery</button><button data-tab="routes" onclick="tab('routes');loadRoutes()">Routes</button><button data-tab="tickets" onclick="tab('tickets')">Support</button><button data-tab="qa" onclick="tab('qa');runPreflight()">Launch QA</button></div><section id="orders" class="card"></section><section id="customers" class="card hide"></section><section id="delivery" class="card hide"></section><section id="routes" class="card hide"></section><section id="tickets" class="card hide"></section><section id="qa" class="card hide"></section></section></main><div id="toast" class="toast"></div><script>let E='',P='',DATA=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove('show'),2500)}function iso(d){return d.toISOString().slice(0,10)}function rangePreset(){let p=$('preset').value,n=new Date(),s=new Date(n),e=new Date(n);if(p==='yesterday'){s.setDate(n.getDate()-1);e=new Date(s)}if(p==='week'){let day=(n.getDay()+6)%7;s.setDate(n.getDate()-day)}if(p==='month')s=new Date(n.getFullYear(),n.getMonth(),1);if(p!=='custom'){$('start').value=iso(s);$('end').value=iso(e)}}async function doLogin(){E=$('email').value.trim();P=$('pin').value;$('loginBtn').disabled=true;try{const ok=await rpc('adminLogin',[E,P]);if(!ok)throw new Error('Invalid admin credentials.');$('login').classList.add('hide');$('app').classList.remove('hide');rangePreset();await refresh()}catch(e){$('msg').textContent=e.message}finally{$('loginBtn').disabled=false}}async function refresh(){try{DATA=await rpc('getAdminDashboard',[E,P,$('start').value,$('end').value]);render()}catch(e){toast(e.message)}}function render(){const m=DATA?.metrics||{};$('metrics').innerHTML=[['Sales',money(m.sales)],['Orders',m.orders||0],['Delivered',m.delivered||0],['Pending',m.pending||0],['AOV',money(m.aov)],['Open Tickets',m.openTickets||0]].map(x=>`<div class="metric"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');renderOrders();renderCustomers();renderDelivery();renderTickets()}function renderOrders(){const partners=(DATA?.partners||[]).filter(p=>p.status==='ACTIVE');$('orders').innerHTML='<h3>Orders</h3>'+((DATA?.orders||[]).map(o=>`<div class="order"><div class="topline"><div><b>${esc(o.orderId)}</b> <span class="badge">${esc(o.status)}</span><div class="meta">${esc(o.name)} · ${esc(o.mobile)} · ${esc(o.fulfilment)} · ${esc(o.payment)}</div><div class="meta">${(o.items||[]).map(i=>`${esc(i.name)} × ${Number(i.qty||0)}`).join(' · ')}</div></div><b>${money(o.amount)}</b></div><div class="actions"><select id="s_${esc(o.orderId)}">${['Order Received','Confirmed','Packed','Ready for Delivery','Out for Delivery','Delivered','Delivery Failed','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="upd('${esc(o.orderId)}')">Update</button>${o.fulfilment==='Home Delivery'?`<select id="ap_${esc(o.orderId)}"><option value="">Select partner</option>${partners.map(p=>`<option value="${esc(p.partnerId)}">${esc(p.name)} · ${esc(p.partnerId)}</option>`).join('')}</select><button class="alt" onclick="assignPartner('${esc(o.orderId)}')">Assign</button><button class="alt" onclick="autoAssign('${esc(o.orderId)}')">Auto</button>`:''}</div></div>`).join('')||'<div class="meta">No orders in this range.</div>')}async function upd(id){try{await rpc('updateOrderStatus',[E,P,id,$('s_'+id).value]);toast('Order updated');await refresh()}catch(e){toast(e.message)}}async function assignPartner(id){const pid=$('ap_'+id).value;if(!pid)return toast('Choose partner');try{await rpc('assignDeliveryPartner',[E,P,id,pid]);toast('Partner assigned');await refresh()}catch(e){toast(e.message)}}async function autoAssign(id){try{const r=await rpc('autoAssignOrderAdmin',[E,P,id]);toast(r.success?'Auto assigned':'Not assigned: '+(r.reason||''));await refresh()}catch(e){toast(e.message)}}function renderCustomers(){$('customers').innerHTML='<h3>Customers</h3><div style="overflow:auto"><table><tr><th>Name</th><th>Mobile</th><th>Orders</th><th>Delivered</th><th>Wallet</th><th>Value</th></tr>'+((DATA?.customers||[]).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.mobile)}</td><td>${Number(c.orders||0)}</td><td>${Number(c.delivered||0)}</td><td>${money(c.wallet)}</td><td>${money(c.value)}</td></tr>`).join(''))+'</table></div>'}function renderDelivery(){const ps=DATA?.partners||[];$('delivery').innerHTML=`<h3>Delivery Management</h3><div class="partner"><div class="topline"><div><b>Automatic assignment</b><div class="meta">Lowest-workload available partner for new home-delivery orders.</div></div><button onclick="toggleAuto()">${DATA?.autoAssignment?'ON':'OFF'}</button></div></div><div class="partner"><h4>Add partner</h4><div class="grid3"><input id="dpName" placeholder="Name"><input id="dpMobile" placeholder="Mobile"><input id="dpPin" placeholder="PIN"><input id="dpVehicle" placeholder="Vehicle"><button onclick="addPartner()">Add partner</button></div></div>${ps.map(p=>`<div class="partner"><b>${esc(p.name)}</b> <span class="badge">${esc(p.partnerId)}</span><div class="meta">${esc(p.mobile)} · ${esc(p.vehicle||'')} · Active deliveries ${Number(p.activeDeliveries||0)}</div><div class="grid3" style="margin-top:8px"><select id="dps_${esc(p.partnerId)}"><option ${p.status==='ACTIVE'?'selected':''}>ACTIVE</option><option ${p.status==='INACTIVE'?'selected':''}>INACTIVE</option></select><select id="dpa_${esc(p.partnerId)}"><option ${p.availability==='AVAILABLE'?'selected':''}>AVAILABLE</option><option ${p.availability==='OFF DUTY'?'selected':''}>OFF DUTY</option></select><input id="dpv_${esc(p.partnerId)}" value="${esc(p.vehicle||'')}" placeholder="Vehicle"><button onclick="savePartner('${esc(p.partnerId)}')">Save</button></div></div>`).join('')}`}async function toggleAuto(){try{await rpc('setAutoAssignment',[E,P,!DATA.autoAssignment]);await refresh()}catch(e){toast(e.message)}}async function addPartner(){try{const r=await rpc('createDeliveryPartnerAdmin',[E,P,{name:$('dpName').value,mobile:$('dpMobile').value,pin:$('dpPin').value,vehicle:$('dpVehicle').value}]);toast('Partner '+r.partnerId+' added');await refresh()}catch(e){toast(e.message)}}async function savePartner(id){try{await rpc('updateDeliveryPartnerAdmin',[E,P,id,$('dps_'+id).value,$('dpa_'+id).value,$('dpv_'+id).value]);toast('Partner updated');await refresh()}catch(e){toast(e.message)}}function renderTickets(){$('tickets').innerHTML='<h3>Support Tickets</h3>'+((DATA?.tickets||[]).map(t=>`<div class="rowLine"><div class="topline"><b>${esc(t.ticketId)}</b><span class="badge">${esc(t.status)}</span></div><div class="meta">${esc(t.name)} · ${esc(t.mobile)} · ${esc(t.summary)}</div><div class="actions"><select id="ts_${esc(t.ticketId)}">${['Open','In Progress','Resolved','Closed'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><select id="tp_${esc(t.ticketId)}">${['Low','Normal','High','Urgent'].map(p=>`<option ${p===t.priority?'selected':''}>${p}</option>`).join('')}</select><input id="tr_${esc(t.ticketId)}" value="${esc(t.resolution||'')}" placeholder="Resolution"><button onclick="saveTicket('${esc(t.ticketId)}')">Save</button></div></div>`).join('')||'<div class="meta">No support tickets.</div>')}async function saveTicket(id){try{await rpc('updateSupportTicket',[E,P,id,$('ts_'+id).value,$('tp_'+id).value,$('tr_'+id).value]);toast('Ticket updated');await refresh()}catch(e){toast(e.message)}}async function loadRoutes(){if(!$('rpDate'))$('routes').innerHTML=`<h3>Route Planner</h3><div class="grid3"><input id="rpDate" type="date" value="${iso(new Date())}"><select id="rpType"><option>B2C</option><option>B2B</option></select><select id="rpDriver"><option value="">Select driver</option></select></div><button style="margin-top:9px" onclick="refreshRoutes()">Load routes</button><div id="rpBox" style="margin-top:12px"></div>`;await refreshRoutes()}async function refreshRoutes(){try{const d=await rpc('getRoutePlannerDataV83',[E,P,$('rpDate').value,$('rpType').value]);$('rpDriver').innerHTML='<option value="">Select driver</option>'+(d.drivers||[]).map(x=>`<option value="${esc(x.driverId)}">${esc(x.name)} · ${esc(x.vehicle||'')}</option>`).join('');$('rpBox').innerHTML=`<div class="metrics"><div class="metric"><span>Unassigned</span><b>${(d.candidates||[]).length}</b></div><div class="metric"><span>Quantity</span><b>${(d.candidates||[]).reduce((a,b)=>a+Number(b.qty||0),0)}</b></div><div class="metric"><span>Drivers</span><b>${(d.drivers||[]).length}</b></div></div><button style="margin-top:10px" onclick="generateRoute()">Generate optimized route</button><h4>Existing routes</h4>${(d.routes||[]).map(r=>`<div class="rowLine"><b>${esc(r.routeId)}</b> <span class="badge">${esc(r.status)}</span><div class="meta">${Number(r.totalStops||0)} stops · ${Number(r.roadKm||0).toFixed(1)} km · ${esc(r.driverId)}</div><button class="alt" style="margin-top:7px" onclick="viewStops('${esc(r.routeId)}')">View sequence</button></div>`).join('')||'<div class="meta">No routes yet.</div>'}`}catch(e){toast(e.message)}}async function generateRoute(){const driver=$('rpDriver').value;if(!driver)return toast('Choose a driver');try{const r=await rpc('generateRouteForDay',[E,P,$('rpDate').value,$('rpType').value,driver]);toast('Route '+r.routeId+' generated');await refreshRoutes()}catch(e){toast(e.message)}}async function viewStops(id){try{const d=await rpc('getRouteStopsAdminV83',[E,P,id]);$('rpBox').innerHTML=`<button class="alt" onclick="refreshRoutes()">← Back</button><h4>${esc(id)}</h4>${(d.stops||[]).map(x=>`<div class="rowLine"><b>#${x.sequence} ${esc(x.name)}</b><div class="meta">${esc(x.orderId)} · ${Number(x.qty||0)} qty · ${Number(x.roadKm||0).toFixed(1)} km · ${esc(x.status||'')}</div></div>`).join('')}` }catch(e){toast(e.message)}}async function runPreflight(){if(!E||!P){toast('Login first');return}try{const r=await rpc('runLaunchPreflightV9',[]);$('qa').innerHTML=`<div class="topline"><div><h3 style="margin:0">Launch Preflight</h3><div class="meta">Checked ${esc(r.checkedAt)} · ${r.passedChecks}/${r.totalChecks} passed</div></div><b class="${r.ok?'statusGood':'statusBad'}">${r.ok?'READY':'BLOCKED'}</b></div><div class="qa" style="margin-top:12px">${(r.checks||[]).map(c=>`<div class="qaitem ${c.ok?'pass':'fail'}"><b>${c.ok?'✅':'❌'} ${esc(c.name)}</b><div class="meta">${esc(c.detail)}</div></div>`).join('')}</div>`;tab('qa')}catch(e){toast(e.message)}}function tab(t){['orders','customers','delivery','routes','tickets','qa'].forEach(x=>$(x).classList.toggle('hide',x!==t));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t))}</script></body></html>
