<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f3;color:#17231b}.top{position:sticky;top:0;z-index:5;background:#155b2b;color:#fff;padding:15px 18px;box-shadow:0 3px 12px #0002}.top small{opacity:.8}.wrap{max-width:1280px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e0e8e1;border-radius:16px;padding:15px;margin-bottom:14px;box-shadow:0 4px 14px #163a2010}.login{max-width:420px;margin:50px auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #d5ded6;border-radius:9px}textarea{width:100%;min-height:70px}button{background:#155b2b;color:#fff;border:0;font-weight:700;cursor:pointer}.secondary{background:#eef6ef;color:#155b2b;border:1px solid #d3e4d5}.metrics{display:grid;grid-template-columns:repeat(9,1fr);gap:9px}.m{background:#fff;border:1px solid #e1e8e2;border-radius:14px;padding:13px}.m b{font-size:21px;display:block}.tabs{display:flex;gap:7px;overflow:auto}.tabs button{white-space:nowrap;background:#edf5ee;color:#155b2b}.tabs .active{background:#155b2b;color:#fff}.order,.ticket{border-top:1px solid #edf0ed;padding:13px 0}.badge{background:#eef6ef;color:#155b2b;padding:4px 7px;border-radius:999px;font-size:11px}.warn{background:#fff2d8;color:#8a6100}.hidden{display:none!important}.muted{color:#68766d;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.toast{position:fixed;right:16px;bottom:16px;background:#173d24;color:#fff;padding:11px 15px;border-radius:10px;z-index:99}.ticketGrid{display:grid;grid-template-columns:1.1fr .8fr .8fr;gap:8px;margin-top:9px}.ticketGrid textarea{grid-column:1/-1}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}table{display:block;overflow:auto}.ticketGrid{grid-template-columns:1fr}}.partnerCard{border:1px solid #e2e9e3;border-radius:14px;padding:12px;margin:10px 0}.autoBox{display:flex;align-items:center;gap:10px;background:#edf8ef;padding:10px 12px;border-radius:12px}.waLink{display:inline-block;background:#25D366;color:#fff;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;margin-top:7px}.assignRow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px}</style></head><body>
<div class="top"><b>🥥 Native Elaneeru — Admin</b><br><small>Sri Govindadri Ventures • Operations V8.3</small></div><div class="wrap"><div id="login" class="card login"><h2>Admin Login</h2><input id="email" type="email" autocomplete="username" placeholder="Admin email" style="width:100%;margin-bottom:8px"><input id="pin" type="password" autocomplete="current-password" placeholder="PIN" style="width:100%;margin-bottom:8px"><button id="loginBtn" style="width:100%" onclick="doLogin()">Login</button><div id="msg" class="muted"></div></div>
<div id="dash" class="hidden"><div class="card row"><select id="preset" onchange="rangePreset()"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="week">This Week</option><option value="month">This Month</option><option value="custom">Custom</option></select><input id="start" type="date"><input id="end" type="date"><button onclick="refresh()">Refresh</button></div><div id="metrics" class="metrics"></div><div class="card"><b>Product Quantity in Range</b><div id="productSales" style="margin-top:8px"></div></div><div class="card tabs"><button id="tOrders" class="active" onclick="tab('orders')">Orders</button><button id="tCustomers" onclick="tab('customers')">Customers</button><button id="tFeedback" onclick="tab('feedback')">Feedback</button><button id="tTickets" onclick="tab('tickets')">Support Tickets</button><button id="tDelivery" onclick="tab('delivery')">Delivery</button><button id="tRouteplan" onclick="tab('routeplan');loadRoutePlanner()">Route Planner</button></div><div id="orders" class="card"></div><div id="customers" class="card hidden"></div><div id="feedback" class="card hidden"></div><div id="tickets" class="card hidden"></div><div id="delivery" class="card hidden"></div><div id="routeplan" class="card hidden"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
let E='',P='',DATA=null;
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function money(n){return '₹'+Number(n||0).toFixed(0)}
function toast(s){const t=$('toast');if(!t)return;t.textContent=String(s||'Something went wrong');t.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.add('hidden'),2600)}
function localIso(d){d=d instanceof Date?d:new Date(d);if(isNaN(d.getTime()))return '';const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function normaliseAdminData(d){
  d=d&&typeof d==='object'?d:{};
  d.metrics=d.metrics&&typeof d.metrics==='object'?d.metrics:{};
  d.productSales=d.productSales&&typeof d.productSales==='object'?d.productSales:{};
  ['orders','customers','feedback','tickets','partners','assignments'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
  d.orders.forEach(o=>{if(o&&typeof o==='object'&&!Array.isArray(o.items))o.items=[]});
  return d;
}
function gs(fn,args,ok,fail){
  const r=google.script.run.withSuccessHandler(v=>{if(typeof ok==='function')ok(v)}).withFailureHandler(e=>{const text=e&&e.message?e.message:'Something went wrong';if(typeof fail==='function')fail(e);else toast(text)});
  try{r[fn].apply(r,args||[])}catch(e){if(typeof fail==='function')fail(e);else toast(e&&e.message?e.message:e)}
}
function setLoginBusy(busy){const b=$('loginBtn');if(!b)return;b.disabled=!!busy;b.textContent=busy?'Signing in…':'Login'}
function setLoginMsg(text){const m=$('msg');if(m)m.textContent=text||''}
function doLogin(){
  const email=String($('email')&&$('email').value||'').trim().toLowerCase(),pin=String($('pin')&&$('pin').value||'').trim();
  setLoginMsg('');
  if(!email||!/^\S+@\S+\.\S+$/.test(email)){setLoginMsg('Enter a valid admin email.');return}
  if(pin.length<4){setLoginMsg('Enter your admin PIN.');return}
  setLoginBusy(true);
  gs('adminLogin',[email,pin],ok=>{
    if(ok!==true){P='';setLoginBusy(false);setLoginMsg('Invalid admin email or PIN.');return}
    E=email;P=pin;$('login').classList.add('hidden');$('dash').classList.remove('hidden');rangePreset();refresh();setLoginBusy(false);
  },e=>{P='';setLoginBusy(false);setLoginMsg(e&&e.message?e.message:'Admin login failed. Please try again.')});
}
function rangePreset(){let p=$('preset').value,n=new Date(),s=new Date(n),e=new Date(n);if(p==='yesterday'){s.setDate(n.getDate()-1);e=new Date(s)}if(p==='week'){let day=(n.getDay()+6)%7;s.setDate(n.getDate()-day)}if(p==='month'){s=new Date(n.getFullYear(),n.getMonth(),1)}if(p!=='custom'){$('start').value=localIso(s);$('end').value=localIso(e)}}
function refresh(){
  if(!E||!P){setLoginMsg('Please sign in again.');$('dash').classList.add('hidden');$('login').classList.remove('hidden');return}
  gs('getAdminDashboard',[E,P,$('start').value,$('end').value],d=>{DATA=normaliseAdminData(d);try{render()}catch(e){toast('Dashboard display error: '+(e&&e.message?e.message:e))}},e=>{const text=e&&e.message?e.message:'Dashboard could not be loaded.';toast(text);if(/invalid admin credentials/i.test(text)){P='';$('dash').classList.add('hidden');$('login').classList.remove('hidden');setLoginMsg('Admin session is not valid. Please sign in again.')}})
}
function render(){
  DATA=normaliseAdminData(DATA);const m=DATA.metrics;
  $('metrics').innerHTML=[['Sales',money(m.sales)],['Orders',m.orders||0],['Products',m.productsSold||0],['Delivered',m.delivered||0],['Pending',m.pending||0],['Cancelled',m.cancelled||0],['AOV',money(m.aov)],['Open Tickets',m.openTickets||0],['Active Partners',m.activePartners||0]].map(x=>'<div class="m"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
  $('productSales').innerHTML=Object.entries(DATA.productSales).map(([k,v])=>'<span class="badge">'+esc(k)+' '+v+'</span> ').join('')||'<span class="muted">No product sales</span>';
  renderOrders();renderCustomers();renderFeedback();renderTickets();renderDelivery();
}
function renderOrders(){
  const partners=DATA.partners.filter(p=>p&&p.status==='ACTIVE'),orders=DATA.orders;
  $('orders').innerHTML='<h3>Orders</h3>'+(orders.length?orders.map(o=>{o=o||{};const oi=Array.isArray(o.items)?o.items:[];const a=DATA.assignments.find(x=>x&&x.orderId===o.orderId&&!['Reassigned','Cancelled'].includes(x.status));const proof=a?'<div class="proofLine" style="margin-top:7px;padding:8px;background:#f7faf7;border-radius:8px;font-size:11px"><b>🚚 '+esc(a.status)+'</b> • Partner '+esc(a.partnerId)+(a.pickupImageUrl?' • <a target="_blank" href="'+esc(a.pickupImageUrl)+'">Pickup photo</a>':'')+' • OTP '+esc(a.otpVerified||'NO')+(a.codRequired==='YES'?' • COD '+esc(a.cod||'NO'):'')+(a.handoverImageUrl?' • <a target="_blank" href="'+esc(a.handoverImageUrl)+'">Handover photo</a>':'')+'</div>':'';return '<div class="order"><b>'+esc(o.orderId)+'</b> <span class="badge">'+esc(o.status)+'</span> • '+money(o.amount)+'<br><b>'+esc(o.name)+'</b> '+esc(o.mobile)+' • '+esc(o.fulfilment)+' • '+esc(o.payment)+'<br><span class="muted">'+oi.map(i=>esc(i&&i.name)+' × '+Number(i&&i.qty||0)+' = '+money(i&&i.lineTotal)).join(' | ')+'<br>'+esc([o.address,o.area,o.landmark].filter(Boolean).join(', '))+'<br>'+esc(o.deliveryDate)+' • '+esc(o.slot)+'</span>'+(o.location?'<br><a target="_blank" href="'+esc(o.location)+'">Open customer location</a>':'')+(o.customerWhatsapp?'<br><a class="waLink" target="_blank" href="'+esc(o.customerWhatsapp)+'">💬 Send Thank-you WhatsApp</a> <span class="muted">'+esc(o.whatsappStatus||'')+'</span><br><span class="muted">📧 Admin mail: '+esc(o.adminEmailStatus||'')+' • 🚚 Auto assignment: '+esc(o.autoAssignmentStatus||'')+'</span>':'')+proof+'<div class="row" style="margin-top:8px"><select id="s_'+esc(o.orderId)+'">'+['Order Received','Confirmed','Packed','Ready for Delivery','Out for Delivery','Delivered','Delivery Failed','Cancelled'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button data-id="'+esc(o.orderId)+'" onclick="upd(this.dataset.id)">Update Status</button></div>'+(o.fulfilment==='Home Delivery'?'<div class="assignRow"><b>Delivery:</b><select id="ap_'+esc(o.orderId)+'"><option value="">Select partner</option>'+partners.map(p=>'<option value="'+esc(p.partnerId)+'" '+(p.partnerId===o.assignedPartnerId?'selected':'')+'>'+esc(p.name)+' • '+esc(p.partnerId)+' • '+esc(p.availability)+'</option>').join('')+'</select><button class="secondary" data-id="'+esc(o.orderId)+'" onclick="assignPartner(this.dataset.id)">'+(o.assignedPartnerId?'Reassign':'Assign')+'</button><button class="secondary" data-id="'+esc(o.orderId)+'" onclick="autoAssignNow(this.dataset.id)">Auto Assign Now</button></div>':'')+'</div>'}).join(''):'<div class="muted">No orders in this date range.</div>')
}
function assignPartner(id){const el=$('ap_'+id),p=el?el.value:'';if(!p)return toast('Choose a delivery partner');gs('assignDeliveryPartner',[E,P,id,p],r=>{toast('Assigned to '+(r&&r.partnerName||p));refresh()})}
function autoAssignNow(id){gs('autoAssignOrderAdmin',[E,P,id],r=>{r=r||{};toast(r.success?'Auto assigned to '+(r.partnerName||r.partnerId||'partner'):'Not assigned: '+(r.reason||'Unknown reason'));refresh()})}
function upd(id){const el=$('s_'+id);if(!el)return;gs('updateOrderStatus',[E,P,id,el.value],()=>{toast('Order updated');refresh()})}
function renderCustomers(){const list=DATA.customers;$('customers').innerHTML='<h3>Customers</h3><table><tr><th>Name</th><th>Mobile</th><th>Orders</th><th>Delivered</th><th>Wallet</th><th>Lifetime Value</th><th>Last Order</th></tr>'+list.map(c=>{c=c||{};return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.mobile)+'</td><td>'+Number(c.orders||0)+'</td><td>'+Number(c.delivered||0)+'</td><td>'+money(c.wallet)+'</td><td>'+money(c.value)+'</td><td>'+esc(c.lastOrder)+'</td></tr>'}).join('')+'</table>'}
function renderFeedback(){const list=DATA.feedback;$('feedback').innerHTML='<h3>Feedback</h3>'+(list.length?list.map(f=>{f=f||{};return '<div class="order"><b>'+esc(f.orderId)+'</b> • '+esc(f.mobile)+' • '+'★'.repeat(Math.max(0,Math.min(5,Number(f.rating)||0)))+'<br>'+esc(f.feedback)+'<div class="muted">'+esc(f.submittedAt)+'</div></div>'}).join(''):'<div class="muted">No feedback yet.</div>')}
function renderTickets(){$('tickets').innerHTML='<h3>Support Tickets</h3><div class="filters"><select id="ticketFilter" onchange="renderTicketsFiltered()"><option>All</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option></select></div><div id="ticketList"></div>';renderTicketsFiltered()}
function renderTicketsFiltered(){const f=$('ticketFilter')?$('ticketFilter').value:'All',list=DATA.tickets.filter(t=>f==='All'||(t&&t.status===f));$('ticketList').innerHTML=list.length?list.map(t=>{t=t||{};return '<div class="ticket"><div><b>'+esc(t.ticketId)+'</b> <span class="badge '+(['Open','In Progress'].includes(t.status)?'warn':'')+'">'+esc(t.status)+'</span> <span class="badge">'+esc(t.priority)+'</span></div><div class="muted">'+esc(t.createdAt)+' • '+esc(t.name)+' • '+esc(t.mobile)+(t.orderId?' • Order '+esc(t.orderId):'')+'</div><div style="margin-top:6px"><b>'+esc(t.l1)+' › '+esc(t.l2)+'</b><br>'+esc(t.summary)+'</div><div class="ticketGrid"><select id="ts_'+esc(t.ticketId)+'">'+['Open','In Progress','Resolved','Closed'].map(s=>'<option '+(s===t.status?'selected':'')+'>'+s+'</option>').join('')+'</select><select id="tp_'+esc(t.ticketId)+'">'+['Low','Normal','High','Urgent'].map(p=>'<option '+(p===t.priority?'selected':'')+'>'+p+'</option>').join('')+'</select><button data-id="'+esc(t.ticketId)+'" onclick="saveTicket(this.dataset.id)">Save Ticket</button><textarea id="tr_'+esc(t.ticketId)+'" placeholder="Resolution / internal notes">'+esc(t.resolution||'')+'</textarea></div><div class="muted">Last updated: '+esc(t.lastUpdated)+'</div></div>'}).join(''):'<div class="muted">No tickets in this status.</div>'}
function saveTicket(id){const s=$('ts_'+id),p=$('tp_'+id),r=$('tr_'+id);if(!s||!p||!r)return;gs('updateSupportTicket',[E,P,id,s.value,p.value,r.value],()=>{toast('Ticket updated');refresh()})}
function renderDelivery(){const host=$('delivery'),ps=DATA.partners;if(!host)return;host.innerHTML='<h3>Delivery Management</h3><div class="autoBox"><b>Automatic Assignment</b><span class="muted">Automatically assigns new Home Delivery orders to the available partner with the lowest workload. Admin can override anytime.</span><button id="autoBtn" onclick="toggleAuto()">'+(DATA.autoAssignment?'ON':'OFF')+'</button></div><div class="card" style="box-shadow:none;margin-top:12px"><h4>Add Delivery Partner</h4><div class="row"><input id="dpName" placeholder="Name"><input id="dpMobile" placeholder="Mobile"><input id="dpPin" placeholder="PIN"><input id="dpVehicle" placeholder="Vehicle number"><button onclick="addPartner()">Add Partner</button></div></div><h4>Delivery Partners</h4><div id="partnerList">'+(ps.length?ps.map(p=>{p=p||{};return '<div class="partnerCard"><b>'+esc(p.name)+'</b> <span class="badge">'+esc(p.partnerId)+'</span><div class="muted">'+esc(p.mobile)+' • '+esc(p.vehicle||'No vehicle')+' • Active deliveries: '+Number(p.activeDeliveries||0)+'</div><div class="row" style="margin-top:8px"><select id="dps_'+esc(p.partnerId)+'"><option '+(p.status==='ACTIVE'?'selected':'')+'>ACTIVE</option><option '+(p.status==='INACTIVE'?'selected':'')+'>INACTIVE</option></select><select id="dpa_'+esc(p.partnerId)+'"><option '+(p.availability==='AVAILABLE'?'selected':'')+'>AVAILABLE</option><option '+(p.availability==='OFF DUTY'?'selected':'')+'>OFF DUTY</option></select><input id="dpv_'+esc(p.partnerId)+'" value="'+esc(p.vehicle||'')+'" placeholder="Vehicle"><button class="secondary" data-id="'+esc(p.partnerId)+'" onclick="savePartner(this.dataset.id)">Save</button></div></div>'}).join(''):'<div class="muted">No delivery partners yet.</div>')+'</div>'}
function toggleAuto(){gs('setAutoAssignment',[E,P,!DATA.autoAssignment],()=>{toast('Auto assignment updated');refresh()})}
function addPartner(){gs('createDeliveryPartnerAdmin',[E,P,{name:$('dpName')?$('dpName').value:'',mobile:$('dpMobile')?$('dpMobile').value:'',pin:$('dpPin')?$('dpPin').value:'',vehicle:$('dpVehicle')?$('dpVehicle').value:''}],r=>{toast('Partner '+esc(r&&r.partnerId||'')+' added');refresh()})}
function savePartner(id){const s=$('dps_'+id),a=$('dpa_'+id),v=$('dpv_'+id);if(!s||!a||!v)return;gs('updateDeliveryPartnerAdmin',[E,P,id,s.value,a.value,v.value],()=>{toast('Partner updated');refresh()})}
function loadRoutePlanner(){const host=$('routeplan');if(!host)return;if(!$('rpDate')){const today=localIso(new Date());host.innerHTML='<h3>Real-road Route Planner</h3><div class="muted">Generate the delivery sequence from the Native Elaneeru hub using Google road routing when the API key is configured. Falls back safely when unavailable.</div><div class="row" style="margin-top:12px"><input id="rpDate" type="date" value="'+today+'"><select id="rpType"><option value="B2C">B2C Customer</option><option value="B2B">B2B Vendor</option></select><select id="rpDriver"><option value="">Select driver</option></select><button onclick="refreshRoutePlanner()">Load</button></div><div id="rpSummary" style="margin-top:12px"></div><div id="rpRoutes" style="margin-top:12px"></div>'}refreshRoutePlanner()}
function refreshRoutePlanner(){const date=$('rpDate')?$('rpDate').value:localIso(new Date()),type=$('rpType')?$('rpType').value:'B2C';gs('getRoutePlannerDataV83',[E,P,date,type],d=>renderRoutePlanner(d))}
function renderRoutePlanner(d){d=d&&typeof d==='object'?d:{};const drivers=Array.isArray(d.drivers)?d.drivers:[],c=Array.isArray(d.candidates)?d.candidates:[],rs=Array.isArray(d.routes)?d.routes:[],dr=$('rpDriver'),selected=dr?dr.value:'';if(dr)dr.innerHTML='<option value="">Select driver</option>'+drivers.map(x=>{x=x||{};return '<option value="'+esc(x.driverId)+'" '+(selected===x.driverId?'selected':'')+'>'+esc(x.name)+' • '+esc(x.vehicle||'No vehicle')+(x.currentRouteId?' • Busy':'')+'</option>'}).join('');const summary=$('rpSummary');if(summary)summary.innerHTML='<div class="metrics"><div><span class="muted">Unassigned orders</span><b>'+c.length+'</b></div><div><span class="muted">Total quantity</span><b>'+c.reduce((a,b)=>a+Number(b&&b.qty||0),0)+'</b></div><div><span class="muted">Active drivers</span><b>'+drivers.length+'</b></div><div><span class="muted">Mode</span><b>'+esc(d.routeType)+'</b></div></div>'+(c.length?'<div style="margin-top:12px"><button onclick="generateRouteNow()">Generate Optimized Route</button></div><div style="margin-top:10px">'+c.slice(0,20).map((x,i)=>{x=x||{};return '<div class="order"><b>#'+(i+1)+' '+esc(x.name)+'</b> <span class="badge">'+Number(x.qty||0)+' qty</span><div class="muted">'+esc(x.orderId)+' • '+esc(x.address)+' • '+esc(x.timeSlot||'No slot')+'</div></div>'}).join('')+'</div>':'<div class="muted" style="margin-top:12px">No unassigned orders with valid GPS for this date.</div>');const routes=$('rpRoutes');if(routes)routes.innerHTML='<h4>Routes for '+esc(d.date)+'</h4>'+(rs.length?rs.map(r=>{r=r||{};return '<div class="order"><div class="row"><div><b>'+esc(r.routeId)+'</b><div class="muted">Driver '+esc(r.driverId)+' • '+esc(r.vehicle)+' • '+Number(r.completedStops||0)+'/'+Number(r.totalStops||0)+' completed</div></div><div><span class="badge">'+esc(r.status)+'</span> <span class="badge">'+Number(r.roadKm||0).toFixed(1)+' km</span> <span class="badge">'+Math.round(r.estimatedMinutes||0)+' min</span></div></div><div class="muted" style="margin-top:6px">'+esc(r.source||'')+' • '+esc(r.createdAt||'')+'</div><button class="secondary" style="margin-top:8px" data-id="'+esc(r.routeId)+'" onclick="viewRouteStops(this.dataset.id)">View sequence</button></div>'}).join(''):'<div class="muted">No routes generated yet.</div>')}
function generateRouteNow(){const driver=$('rpDriver')?$('rpDriver').value:'';if(!driver)return toast('Choose a driver');const date=$('rpDate').value,type=$('rpType').value;gs('generateRouteForDay',[E,P,date,type,driver],r=>{r=r||{};toast('Route '+esc(r.routeId||'')+' generated • '+Number(r.totalStops||0)+' stops • '+Number(r.totalRoadKm||0)+' km');refreshRoutePlanner()})}
function viewRouteStops(routeId){gs('getRouteStopsAdminV83',[E,P,routeId],d=>{d=d&&typeof d==='object'?d:{};const route=d.route&&typeof d.route==='object'?d.route:{},stops=Array.isArray(d.stops)?d.stops:[],w=window.open('','_blank');if(!w)return toast('Allow pop-ups to view route');const rows=stops.map(x=>{x=x||{};return '<tr><td>'+Number(x.sequence||0)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.orderId)+'</td><td>'+Number(x.qty||0)+'</td><td>'+Number(x.roadKm||0).toFixed(1)+'</td><td>'+Math.round(x.travelMin||0)+'</td><td>'+esc(x.eta||'')+'</td><td>'+esc(x.status||'')+'</td></tr>'}).join('');w.document.write('<!doctype html><html><head><title>'+esc(routeId)+'</title><style>body{font-family:Arial;padding:20px;color:#17231b}table{width:100%;border-collapse:collapse}th,td{padding:9px;border:1px solid #ddd;text-align:left}th{background:#eef7f0}</style></head><body><h2>Native Elaneeru Route '+esc(routeId)+'</h2><p>'+Number(route.roadKm||0).toFixed(1)+' km • '+Math.round(route.estimatedMinutes||0)+' min • '+esc(route.source||'')+'</p><table><tr><th>Seq</th><th>Stop</th><th>Order</th><th>Qty</th><th>KM</th><th>Min</th><th>ETA</th><th>Status</th></tr>'+rows+'</table></body></html>');w.document.close()})}
function tab(t){['orders','customers','feedback','tickets','delivery','routeplan'].forEach(x=>{const panel=$(x),btn=$('t'+x[0].toUpperCase()+x.slice(1));if(panel)panel.classList.toggle('hidden',x!==t);if(btn)btn.classList.toggle('active',x===t)})}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doLogin()}});
