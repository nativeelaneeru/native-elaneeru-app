,.88),rgba(7,85,45,.50),rgba(7,85,45,.05));z-index:-1}.bannerText{padding:20px;max-width:68%}.bannerText small{font-weight:800;opacity:.9}.bannerText h2{font-size:24px;line-height:1.05;margin:5px 0 7px;letter-spacing:-.5px}.offerPill{display:inline-block;background:#fff;color:#075d32;padding:7px 10px;border-radius:10px;font-size:12px;font-weight:900;margin-top:8px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.sectionHead h2{font-size:19px;margin:0;letter-spacing:-.3px}.link{font-size:12px;color:var(--g);font-weight:900}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 5px;color:var(--ink);font-weight:800;font-size:11px}.quick .ico{display:grid;place-items:center;margin:auto auto 6px;width:40px;height:40px;border-radius:13px;background:var(--lime);font-size:20px}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none}.chip{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:999px;white-space:nowrap;font-weight:800;font-size:12px}.chip.on{background:var(--g);color:#fff;border-color:var(--g)}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 3px 16px rgba(0,0,0,.035);position:relative}.visual{height:128px;border-radius:14px;background:linear-gradient(145deg,#ecf8eb,#fff1c8);display:grid;place-items:center;overflow:hidden;position:relative}.visual img{width:100%;height:100%;object-fit:cover}.fallbackCoco{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#89d46d 0 9%,#4da84c 10% 40%,#2f7d39 41% 67%,#1c5a2d 68%);box-shadow:inset -10px -10px 18px #164b2770,0 10px 18px #285f2d30;position:relative}.fallbackCoco:before{content:"";position:absolute;width:10px;height:50px;background:#f3f0dc;border-radius:10px;right:6px;top:-27px;transform:rotate(14deg);box-shadow:0 0 0 1px #d3cfb8}.fallbackCoco.dc{border-radius:46% 54% 51% 49%;background:radial-gradient(circle at 42% 35%,#fffdf4 0 8%,#f4efe0 9% 58%,#c9b899 59% 69%,#8d7458 70%)}.tag{position:absolute;top:8px;left:8px;background:#fff;color:var(--g);font-size:9px;font-weight:950;padding:5px 7px;border-radius:8px;box-shadow:0 2px 8px #0001}.pname{font-size:14px;font-weight:900;margin:9px 1px 2px}.sub{font-size:11px;color:var(--muted);min-height:16px}.priceRow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}.price{font-size:18px;font-weight:950}.add{border:1px solid #15924d;background:#fff;color:#0b713c;border-radius:9px;padding:7px 12px;font-weight:950;min-width:66px}.qtyCtl{display:flex;align-items:center;background:var(--g);color:#fff;border-radius:9px;overflow:hidden}.qtyCtl button{width:29px;height:30px;border:0;background:transparent;color:#fff;font-size:18px}.qtyCtl span{min-width:26px;text-align:center;font-weight:900}.rewardCard{background:linear-gradient(135deg,#fff8e4,#f1ffe9);border:1px solid #e9e1bb;border-radius:18px;padding:15px}.rewardTop{display:flex;justify-content:space-between}.progress{height:9px;border-radius:999px;background:#e6eadf;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#17a05b,#72bf44)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px}.field{width:100%;padding:13px 12px;border:1px solid #dce4dd;border-radius:12px;background:#fff;font:inherit;outline:none}.field:focus{border-color:#65ad7f;box-shadow:0 0 0 3px #e7f5eb}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;padding:13px 14px;background:var(--g);color:white;font-weight:900;font:inherit}.btn.secondary{background:#eef7f0;color:var(--g)}.order{padding:12px 0;border-bottom:1px solid var(--line)}.order:last-child{border:0}.status{display:inline-flex;padding:5px 8px;border-radius:9 <section id="orders" class="hidden"><div class="sectionHead"><h2>Your orders</h2></div><div id="ordersBox" class="card"><div class="empty">Enter your mobile in Account to see orders.</div></div></section>
<section id="account" class="hidden"><div class="sectionHead"><h2>Account & rewards</h2></div><div id="rewardBox"></div><div class="card"><div class="grid2"><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="Mobile number"><input id="name" class="field" placeholder="Your name"></div><div style="height:9px"></div><div class="grid2"><input id="area" class="field" placeholder="Area"><input id="pincode" class="field" inputmode="numeric" placeholder="Pincode"></div><div style="height:9px"></div><textarea id="address" class="field" rows="3" placeholder="Full delivery address"></textarea><div class="grid2" style="margin-top:9px"><button class="btn secondary" onclick="captureLoc()">📍 Use GPS</button><button class="btn" onclick="saveProfile()">Save profile</button></div><div id="coord" class="sub" style="margin-top:8px"></div></div></section></main></div>

async function init(){try{CFG=await call('getAppConfig');renderBanners();renderChips();renderProducts();const saved=JSON.parse(localStorage.getItem('nel_profile')||'{}');if(saved.mobile){['mobile','name','area','address','pincode'].forEach(k=>{if($(k))$(k).value=saved[k]||''});LAT=saved.latitude||'';LNG=saved.longitude||'';$('locText').textContent=saved.area||'Bannerghatta, Bengaluru';loadCustomer()}}catch(e){toast('Could not load app: '+e.message);$('banners').innerHTML=`<div class="banner"><div class="shade"></div><div class="bannerText"><small>FARM FRESH</small><h2>Fresh coconuts, delivered.</h2><div class="offerPill">Native Elaneeru</div></div></div>`}}
function renderBanners(){let bs=(CFG.banners||[]);if(!bs.length)bs=[{title:'Farm-fresh coconuts',subtitle:'Picked for freshness, delivered to your doorstep',offerText:'Fresh every day'}];$('banners').innerHTML=bs.map((b,i)=>`<div class="banner" onclick="bannerClick(${i})">${validImg(b.imageUrl)?`<img src="${esc(b.imageUrl)}" onerror="this.remove()">`:''}<div class="shade"></div><div class="bannerText"><small>${esc(b.subtitle||'NATIVE ELANEERU')}</small><h2>${esc(b.title||'Fresh Coconuts')}</h2>${b.offerText?`<div class="offerPill">${esc(b.offerText)}</div>`:''}</div></div>`).join('')}function bannerClick(i){const b=(CFG.banners||[])[i];if(b&&b.productId){go('products');setTimeout(()=>{CAT='All';renderProducts();document.getElementById('p-'+b.productId)?.scrollIntoView({behavior:'smooth',block:'center'})},100)}}
function renderChips(){const cats=['All',...new Set((CFG.products||[]).map(p=>p.category||'Coconuts'))];$('chips').innerHTML=cats.map(c=>`<button class="chip ${CAT===c?'on':''}" onclick="CAT='${esc(c)}';renderChips();renderProducts()">${esc(c)}</button>`).join('')}function productCard(p){const q=CART[p.productId]||0;const bundle=p.offerQty2?`${p.offerQty2} for ${money(p.offerPrice2)}`:(p.offerQty1?`${p.offerQty1} for ${money(p.offerPrice1)}`:'Farm fresh');return `<div class="product" id="p-${esc(p.productId)}"><div class="visual"><span class="tag">FRESH</span>${visual(p)}</div><div class="pname">${esc(p.productName)}</div><div class="sub">${esc(bundle)}</div><div class="priceRow"><div><div class="price">${money(p.price)}</div><div class="sub">per ${esc(p.unit||'pc')}</div></div>${q?`<div class="qtyCtl"><button onclick="qty('${esc(p.productId)}',-1)">−</button><span>${q}</span><button onclick="qty('${esc(p.productId)}',1)">+</button></div>`:`<button class="add" onclick="qty('${esc(p.productId)}',1)">ADD</button>`}</div></div>`}
function renderProducts(){const term=($('search').value||'').toLowerCase();const list=(CFG.products||[]).filter(p=>(CAT==='All'||p.category===CAT)&&(!term||p.productName.toLowerCase().includes(term)||String(p.category).toLowerCase().includes(term)));$('allProducts').innerHTML=list.map(productCard).join('')||'<div class="empty">No matching products.</div>';$('homeProducts').innerHTML=(CFG.products||[]).slice(0,4).map(productCard).join('');updateCart()}function qty(id,d){CART[id]=Math.max(0,(CART[id]||0)+d);if(!CART[id])delete CART[id];renderProducts()}function calc(){let t=0,c=0;Object.entries(CART).forEach(([id,q])=>{const p=CFG.products.find(x=>x.productId===id);if(p){let line=p.price*q;if(q===p.offerQty1&&p.offerPrice1)line=p.offerPrice1;if(q===p.offerQty2&&p.offerPrice2)line=p.offerPrice2;t+=line;c+=q}});return{t,c}}function updateCart(){const x=calc();$('cartCount').textContent=x.c;$('cartTotal').textContent=money(x.t);$('cartBar').classList.toggle('show',x.c>0)}
function openCart(){const x=calc();const rows=Object.entries(CART).map(([id,q])=>{const p=CFG.products.find(x=>x.productId===id);return p?`<div class="order"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${esc(p.productName)}</b><div class="sub">${q} × ${money(p.price)}</div></div><div class="qtyCtl"><button onclick="qty('${id}',-1);openCart()">−</button><span>${q}</span><button onclick="qty('${id}',1);openCart()">+</button></div></div></div>`:''}).join('');$('cartItems').innerHTML=rows||'<div class="empty">Your cart is empty.</div>';$('checkout').innerHTML=x.c?`<div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between"><b>Subtotal</b><b>${money(x.t)}</b></div><div class="sub" style="margin:7px 0 12px">Free delivery within ${CFG.deliveryRadiusKm||3} KM · Pay on delivery</div><select id="slot" class="field"><option>07:00-09:00</option><option>09:00-12:00</option><option>12:00-15:00</option><option>15:00-18:00</option></select><button class="btn" style="width:100%;margin-top:9px" onclick="placeOrder()">Place order · ${money(x.t)}</button></div>`:'';$('cartSheet').classList.add('show')}function closeCart(){$('cartSheet').classList.remove('show')}
async function saveProfile(){try{const p={mobile:$('mobile').value,name:$('name').value,area:$('area').value,address:$('address').value,pincode:$('pincode').value,latitude:LAT,longitude:LNG};const r=await call('saveCustomerProfile',[p]);localStorage.setItem('nel_profile',JSON.stringify({...p,mobile:r.mobile||p.mobile}));$('locText').textContent=p.area||'Bengaluru';toast('Profile saved');loadCustomer()}catch(e){toast(e.message)}}async function captureLoc(){if(!navigator.geolocation)return toast('Location is not supported on this device.');toast('Getting your location…');navigator.geolocation.getCurrentPosition(async p=>{LAT=p.coords.latitude;LNG=p.coords.longitude;$('coord').textContent=`GPS captured · ${Number(LAT).toFixed(5)}, ${Number(LNG).toFixed(5)}`;try{const r=await call('checkDeliveryLocation',[LAT,LNG]);toast(r.eligible?`Great! Delivery available (${r.distanceKm} KM)`:`Outside ${r.radiusKm} KM delivery area`)}catch(e){toast(e.message)}},e=>toast('Please allow location permission.'),{enableHighAccuracy:true,timeout:12000})}
async function placeOrder(){try{const p=JSON.parse(localStorage.getItem('nel_profile')||'{}');const mobile=$('mobile').value||p.mobile;if(!mobile)return closeCart(),go('account'),toast('Save your profile before ordering.');if(!LAT||!LNG)return closeCart(),go('account'),toast('Capture your delivery location first.');const items=Object.entries(CART).map(([productId,quantity])=>({productId,quantity}));const o={mobile,items,fulfilmentType:'Home Delivery',address:$('address').value||p.address,area:$('area').value||p.area,pincode:$('pincode').value||p.pincode,latitude:LAT,longitude:LNG,payment:'COD',cashbackUsed:0,timeSlot:$('slot').value};const r=await call('saveOrder',[o]);CART={};renderProducts();closeCart();toast('Order placed: '+r.orderId);go('orders');loadCustomer()}catch(e){toast(e.message)}}
async function loadCustomer(){const mobile=$('mobile').value||JSON.parse(localStorage.getItem('nel_profile')||'{}').mobile;if(!mobile)return;try{const d=await call('getCustomerDashboard',[mobile]);$('rewardBox').innerHTML=`<div class="rewardCard"><div class="rewardTop"><div><b>Weekly reward</b><div class="sub">Buy ${d.weekly.target} Tender Coconuts</div></div><b>${money(d.weekly.reward)}</b></div><div class="progress"><i style="width:${Math.min(100,d.weekly.achieved/d.weekly.target*100)}%"></i></div><div class="sub" style="margin-top:6px">${d.weekly.achieved}/${d.weekly.target} completed</div></div><div style="height:10px"></div><div class="rewardCard"><div class="rewardTop"><div><b>Monthly reward</b><div class="sub">Buy ${d.monthly.target} Tender Coconuts</div></div><b>${money(d.monthly.reward)}</b></div><div class="progress"><i style="width:${Math.min(100,d.monthly.achieved/d.monthly.target*100)}%"></i></div><div class="sub" style="margin-top:6px">${d.monthly.achieved}/${d.monthly.target} completed · Wallet ${money(d.customer.cashback)}</div></div>`;$('ordersBox').innerHTML=d.orders.length?d.orders.map(o=>`<div class="order"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(o.orderId)}</b><div class="sub">${esc(o.date)} · ${esc(o.fulfilment)}</div></div><div style="text-align:right"><b>${money(o.amount)}</b><div><span class="status">${esc(o.status)}</span></div></div></div><div class="sub" style="margin-top:7px">${o.items.map(i=>`${esc(i.name)} × ${i.qty}`).join(' · ')}</div></div>`).join(''):'<div class="empty">No orders yet. Your first fresh delivery is one tap away.</div>'}catch(e){}}
function go(page){['home','products','orders','account'].forEach(x=>$(x).classList.toggle('hidden',x!==page));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'});if(page==='orders'||page==='account')loadCustomer()}init();
</script></body></html>
