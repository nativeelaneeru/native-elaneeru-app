<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Inventory</title><style>:root{--g:#075b34;--bg:#f4f7f4;--line:#dfe7e1;--muted:#6b776e;--ink:#142019}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:17px}.head{max-width:1120px;margin:auto}.brand{font-size:23px;font-weight:950}.sub{font-size:12px;opacity:.82}.wrap{max-width:1120px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 4px 16px #0000000a}.login,.form,.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit}.btn{border:0;border-radius:11px;padding:12px 14px;background:var(--g);color:#fff;font-weight:900}.kpi small,.stock small{color:var(--muted)}.kpi b,.stock b{display:block;font-size:27px;margin-top:5px}.stockGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stock{background:#f8faf8;border:1px solid #edf1ed;border-radius:14px;padding:12px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px;border-bottom:1px solid #edf1ed;text-align:left;font-size:12px}th{color:var(--muted)}.in{color:#087a42;font-weight:900}.out{color:#b42318;font-weight:900}.msg{font-size:12px;margin:8px 2px;color:#9a3412}.sectionTitle{display:flex;justify-content:space-between;align-items:center}.sectionTitle h3{margin:0}@media(max-width:760px){.login,.form,.kpis,.stockGrid{grid-template-columns:1fr 1fr}.login .btn{grid-column:1/-1}}@media(max-width:480px){.login,.form,.kpis,.stockGrid{grid-template-columns:1fr}.wrap{padding:11px}}</style></head><body><header><div class="head"><div class="brand">🥥 Native Elaneeru Inventory</div><div class="sub">Stock on hand · movement ledger · audit trail</div></div></header><main class="wrap"><div class="card login"><input id="email" class="field" placeholder="Admin email"><input id="pin" class="field" type="password" placeholder="Admin PIN"><button class="btn" onclick="load()">Open inventory</button></div><div id="msg" class="msg"></div><div id="kpis" class="kpis"></div><div class="card"><div class="sectionTitle"><h3>Post stock movement</h3><span style="font-size:11px;color:var(--muted)">Every change is logged</span></div><div class="form" style="margin-top:12px"><select id="product" class="field"></select><select id="type" class="field"><option>PURCHASE IN</option><option>RETURN IN</option><option>ADJUSTMENT IN</option><option>DAMAGE OUT</option><option>ISSUE OUT</option><option>ADJUSTMENT OUT</option></select><input id="qty" class="field" type="number" min="1" placeholder="Quantity"><input id="location" class="field" value="HUB" placeholder="Location"><input id="reference" class="field" placeholder="Reference / invoice"><input id="reason" class="field" placeholder="Reason / note"></div><button class="btn" style="margin-top:10px" onclick="save()">Post movement</button></div><div class="card"><div class="sectionTitle"><h3>Stock on hand</h3><button class="btn" style="padding:8px 11px" onclick="load()">Refresh</button></div><div id="balances" class="stockGrid" style="margin-top:12px"></div></div><div class="card"><h3>Movement history</h3><div class="scroll"><table><thead><tr><th>Time</th><th>Product</th><th>Type</th><th>In</th><th>Out</th><th>Location</th><th>Reference</th><th>Reason</th></tr></thead><tbody id="moves"></tbody></table></div></div></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}function msg(t,ok=false){$('msg').style.color=ok?'#0b6b3a':'#9a3412';$('msg').textContent=t||''}async function load(){try{const d=await rpc('getInventoryDashboardV81',[$('email').value.trim(),$('pin').value]);$('product').innerHTML=(d.products||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');const s=d.summary||{totalOnHand:0,products:0,locations:0};$('kpis').innerHTML=[['Total stock on hand',s.totalOnHand],['Active products',s.products],['Stock locations',s.locations]].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('balances').innerHTML=(d.balances||[]).length?d.balances.map(x=>`<div class="stock"><small>${esc(x.productName)} · ${esc(x.location)}</small><b>${Number(x.qty)||0}</b><small>units on hand</small></div>`).join(''):'<div class="stock"><small>No ledger stock yet</small><b>0</b></div>';$('moves').innerHTML=(d.movements||[]).map(x=>`<tr><td>${esc(x['Created At'])}</td><td>${esc(x['Product Name'])}</td><td>${esc(x['Movement Type'])}</td><td class="in">${Number(x['Qty In'])||0}</td><td class="out">${Number(x['Qty Out'])||0}</td><td>${esc(x.Location)}</td><td>${esc(x['Reference ID'])}</td><td>${esc(x.Reason)}</td></tr>`).join('')||'<tr><td colspan="8">No movements yet.</td></tr>';msg('Inventory synced.',true)}catch(e){msg(e.message)}}async function save(){try{await rpc('addStockMovementV81',[$('email').value.trim(),$('pin').value,{productId:$('product').value,movementType:$('type').value,qty:$('qty').value,location:$('location').value,referenceId:$('reference').value,reason:$('reason').value}]);$('qty').value='';$('reference').value='';$('reason').value='';msg('Stock movement posted.',true);await load()}catch(e){msg(e.message)}}</script></body></html>
