<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><title>Native Elaneeru Inventory</title><style>
:root{--g:#0b6b3a;--bg:#f5f7f5;--line:#dfe7e0;--muted:#69746c;--ink:#17241c}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}header{background:linear-gradient(135deg,#075d32,#148c4b);color:#fff;padding:17px}.head{max-width:1120px;margin:auto}.brand{font-size:23px;font-weight:950}.wrap{max-width:1120px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 3px 14px #00000008}.login,.form,.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;outline:none}.field:focus{border-color:#61a779;box-shadow:0 0 0 3px #e8f6ec}.btn{border:0;border-radius:11px;padding:12px 14px;background:var(--g);color:#fff;font-weight:900}.kpi small{color:var(--muted);font-weight:800}.kpi b{display:block;font-size:29px;margin-top:6px}.stockGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stock{background:#f8faf8;border:1px solid #edf1ed;border-radius:14px;padding:12px}.stock b{display:block;font-size:25px;margin-top:5px}.stock small{color:var(--muted)}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:10px;border-bottom:1px solid #edf1ed;text-align:left;font-size:12px}th{font-size:11px;color:var(--muted)}.in{color:#087a42;font-weight:900}.out{color:#b42318;font-weight:900}.msg{font-size:12px;margin:8px 2px;color:#9a3412}.sectionTitle{display:flex;justify-content:space-between;align-items:center}.sectionTitle h3{margin:0}@media(max-width:760px){.login,.form,.kpis,.stockGrid{grid-template-columns:1fr 1fr}.login .btn{grid-column:1/-1}}@media(max-width:480px){.login,.form,.kpis,.stockGrid{grid-template-columns:1fr 1fr}.form>*:nth-child(n+3){grid-column:1/-1}.wrap{padding:11px}}</style></head><body><header><div class="head"><div class="brand">Inventory Control</div><div style="font-size:12px;opacity:.82">Stock on hand · movement ledger · operational accountability</div></div></header><main class="wrap"><div class="card login"><input id="email" class="field" type="email" autocomplete="username" placeholder="Admin email"><input id="pin" class="field" type="password" autocomplete="current-password" placeholder="Admin PIN"><button class="btn" onclick="load()">Open inventory</button></div><div id="msg" class="msg"></div><div id="kpis" class="kpis"></div><div class="card"><div class="sectionTitle"><h3>Stock movement</h3><span style="font-size:11px;color:var(--muted)">Every change is logged</span></div><div class="form" style="margin-top:12px"><select id="product" class="field"></select><select id="type" class="field"><option>PURCHASE IN</option><option>RETURN IN</option><option>ADJUSTMENT IN</option><option>DAMAGE OUT</option><option>ISSUE OUT</option><option>ADJUSTMENT OUT</option></select><input id="qty" class="field" type="number" min="1" placeholder="Quantity"><input id="location" class="field" value="HUB" placeholder="Location"><input id="reference" class="field" placeholder="Reference ID / invoice"><input id="reason" class="field" placeholder="Reason / note"></div><button class="btn" style="margin-top:10px" onclick="save()">Post movement</button></div><div class="card"><div class="sectionTitle"><h3>Stock on hand</h3><button class="btn" style="padding:8px 11px" onclick="load()">Refresh</button></div><div id="balances" class="stockGrid" style="margin-top:12px"></div></div><div class="card"><h3>Movement history</h3><div class="scroll"><table><thead><tr><th>Time</th><th>Product</th><th>Type</th><th>In</th><th>Out</th><th>Location</th><th>Reference</th><th>Reason</th></tr></thead><tbody id="moves"></tbody></table></div></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),call=(f,a=[])=>new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>j(new Error(e&&e.message?e.message:String(e))))[f](...a));function msg(t,ok=false){$('msg').style.color=ok?'#0b6b3a':'#9a3412';$('msg').textContent=t||''}
async function load(){try{const email=String($('email').value||'').trim().toLowerCase(),pin=String($('pin').value||'').trim();if(!email||pin.length<4)throw new Error('Enter your Admin email and PIN.');const raw=await call('getInventoryDashboardV81',[email,pin]),d=raw&&typeof raw==='object'?raw:{},products=Array.isArray(d.products)?d.products:[],balances=Array.isArray(d.balances)?d.balances:[],movements=Array.isArray(d.movements)?d.movements:[],s=d.summary&&typeof d.summary==='object'?d.summary:{totalOnHand:0,products:products.length,locations:0};$('product').innerHTML=products.map(p=>`<option value="${esc(p&&p.id)}">${esc(p&&p.name)}</option>`).join('');$('kpis').innerHTML=[['Total stock on hand',Number(s.totalOnHand)||0],['Active products',Number(s.products)||0],['Stock locations',Number(s.locations)||0]].map(x=>`<div class="card kpi"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('');$('balances').innerHTML=balances.length?balances.map(x=>`<div class="stock"><small>${esc(x&&x.productName)} · ${esc(x&&x.location)}</small><b>${Number(x&&x.qty)||0}</b><small>units on hand</small></div>`).join(''):'<div class="stock"><small>No ledger stock yet</small><b>0</b><small>Post a purchase movement to begin.</small></div>';$('moves').innerHTML=movements.map(x=>`<tr><td>${esc(x&&x['Created At'])}</td><td>${esc(x&&x['Product Name'])}</td><td>${esc(x&&x['Movement Type'])}</td><td class="in">${Number(x&&x['Qty In'])||0}</td><td class="out">${Number(x&&x['Qty Out'])||0}</td><td>${esc(x&&x.Location)}</td><td>${esc(x&&x['Reference ID'])}</td><td>${esc(x&&x.Reason)}</td></tr>`).join('')||'<tr><td colspan="8">No movements yet.</td></tr>';msg('Inventory synced.',true)}catch(e){msg(e&&e.message?e.message:String(e))}}
async function save(){try{const email=String($('email').value||'').trim().toLowerCase(),pin=String($('pin').value||'').trim(),qty=Number($('qty').value||0);if(!email||pin.length<4)throw new Error('Admin login is required.');if(!$('product').value)throw new Error('Select a product.');if(!(qty>0))throw new Error('Quantity must be greater than 0.');await call('addStockMovementV81',[email,pin,{productId:$('product').value,movementType:$('type').value,qty,location:$('location').value,referenceId:$('reference').value,reason:$('reason').value}]);$('qty').value='';$('reference').value='';$('reason').value='';msg('Stock movement posted.',true);await load()}catch(e){msg(e&&e.message?e.message:String(e))}}
</script></body></html>
