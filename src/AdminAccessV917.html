<style>
#accessV917 .accessGrid{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.25fr 1fr auto;gap:8px;align-items:end}
#accessV917 .accessUser{border-top:1px solid #edf0ed;padding:12px 0}.accessUser:first-child{border-top:0}
#accessV917 .accessMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
#accessV917 .accessActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
#accessV917 .accessNote{background:#eef6ef;border:1px solid #d3e4d5;border-radius:11px;padding:10px;margin-top:10px}
#accessV917 .appChecks{display:grid;gap:5px;background:#f8faf8;border:1px solid #e1e8e2;border-radius:11px;padding:8px;min-height:46px}
#accessV917 .appChecks label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;cursor:pointer}
#accessV917 .appChecks input{width:16px;height:16px;margin:0}
@media(max-width:1050px){#accessV917 .accessGrid{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:650px){#accessV917 .accessGrid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){#accessV917 .accessGrid{grid-template-columns:1fr}}
</style>
<script>
(function(){
  if(window.NEL_ADMIN_ACCESS_V917)return;window.NEL_ADMIN_ACCESS_V917=true;
  const oldPanels=['orders','customers','feedback','tickets','delivery','routeplan'];
  const MAIN='https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec';
  function byId(id){return document.getElementById(id)}
  function safe(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function staffCall(fn,args){return new Promise((resolve,reject)=>{const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));r[fn].apply(r,args||[])})}
  function currentAdmin(){return {email:String(typeof E!=='undefined'?E:'').trim(),pin:String(typeof P!=='undefined'?P:'').trim()}}
  function pin4(){return String(Math.floor(1000+Math.random()*9000))}
  const ROLE_LABELS={SALES:'Sales Executive',SALES_MANAGER:'Sales Manager',OPERATIONS:'Operations',FIELD_EXECUTIVE:'Field Executive',PICKER:'Picker'};
  const APP_LABELS={VENDOR_ONBOARDING:'Vendor Onboarding',PICKER:'Picker'};

  function install(){
    const dash=byId('dash'),tabs=dash&&dash.querySelector('.tabs');if(!dash||!tabs||byId('tAccess'))return;
    const btn=document.createElement('button');btn.id='tAccess';btn.textContent='Access Management';btn.type='button';btn.onclick=window.openAccessV917;tabs.appendChild(btn);
    const panel=document.createElement('div');panel.id='access';panel.className='card hidden';panel.innerHTML='<div id="accessV917"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Access Management</h3><div class="muted">Choose the person’s job role and exactly which staff apps they can open.</div></div><button class="secondary" type="button" onclick="loadAccessV917()">Refresh</button></div><div class="accessNote muted"><b>Security:</b> Role and app access are separate. <b>Admin / Access Management is not grantable here.</b> Staff PINs are stored only as hashes in <b>Staff_Users</b>; existing PINs can only be reset.</div><div class="card" style="box-shadow:none;margin-top:12px"><h4 style="margin-top:0">Grant Access</h4><div class="accessGrid"><div><div class="muted">Name *</div><input id="acName" placeholder="Staff name" style="width:100%"></div><div><div class="muted">Mobile *</div><input id="acMobile" inputmode="numeric" maxlength="10" placeholder="10 digit mobile" style="width:100%"></div><div><div class="muted">Job Role *</div><select id="acRole" style="width:100%"><option value="SALES">Sales Executive</option><option value="SALES_MANAGER">Sales Manager</option><option value="OPERATIONS">Operations</option><option value="FIELD_EXECUTIVE">Field Executive</option><option value="PICKER">Picker</option></select></div><div><div class="muted">App Access *</div><div class="appChecks"><label><input type="checkbox" name="acApp" value="VENDOR_ONBOARDING" checked> Vendor Onboarding</label><label><input type="checkbox" name="acApp" value="PICKER"> Picker</label></div></div><div><div class="muted">PIN *</div><div class="row" style="gap:4px"><input id="acPin" type="text" inputmode="numeric" maxlength="8" placeholder="4–8 digits" style="width:110px"><button class="secondary" type="button" onclick="generateAccessPinV917()">Generate</button></div></div><button id="acGrant" type="button" onclick="grantAccessV917()">Grant Access</button></div><div id="acResult" class="muted" style="margin-top:9px"></div></div><div id="acList"><div class="muted">Open this tab to load staff access.</div></div></div>';
    tabs.insertAdjacentElement('afterend',panel);
    tabs.querySelectorAll('button:not(#tAccess)').forEach(b=>b.addEventListener('click',()=>{panel.classList.add('hidden');btn.classList.remove('active')}));
  }

  function selectedApps(){return Array.from(document.querySelectorAll('#accessV917 input[name="acApp"]:checked')).map(x=>String(x.value||'').toUpperCase()).filter(Boolean)}
  function labelRole(role){role=String(role||'').toUpperCase();return ROLE_LABELS[role]||role||'Staff'}
  function labelApp(app){app=String(app||'').toUpperCase();return APP_LABELS[app]||app}
  function appList(r){if(r&&Array.isArray(r.allowedApps))return r.allowedApps;return String(r&&r.allowedApp||'').split(/[;,|]/).map(x=>x.trim()).filter(Boolean)}

  window.generateAccessPinV917=function(){const x=byId('acPin');if(x)x.value=pin4()};
  window.openAccessV917=function(){oldPanels.forEach(id=>{const x=byId(id);if(x)x.classList.add('hidden')});const dash=byId('dash'),tabs=dash&&dash.querySelector('.tabs');if(!tabs)return;tabs.querySelectorAll('button').forEach(b=>b.classList.remove('active'));const t=byId('tAccess'),p=byId('access');if(t)t.classList.add('active');if(p)p.classList.remove('hidden');window.loadAccessV917()};
  window.loadAccessV917=async function(){
    const a=currentAdmin(),host=byId('acList');if(!host)return;if(!a.email||!a.pin){host.innerHTML='<div class="muted">Admin session is required.</div>';return}
    host.innerHTML='<div class="muted" style="padding:10px 0">Loading staff access…</div>';
    try{const d=await staffCall('getStaffAccessAdminV917',[a.email,a.pin]),rows=d&&Array.isArray(d.rows)?d.rows:[];renderList(rows)}catch(e){host.innerHTML='<div class="muted">'+safe(e&&e.message?e.message:e)+'</div>'}
  };
  function renderList(rows){
    rows=Array.isArray(rows)?rows:[];const host=byId('acList');if(!host)return;
    if(!rows.length){host.innerHTML='<div class="muted" style="padding:14px 0">No staff access created yet.</div>';return}
    host.innerHTML='<h4>Staff Access</h4>'+rows.map(r=>{r=r&&typeof r==='object'?r:{};const apps=appList(r);const links=[];if(apps.includes('VENDOR_ONBOARDING'))links.push('<a class="waLink" style="margin-top:0" target="_top" href="'+MAIN+'?page=vendor">Open Vendor Onboarding</a>');if(apps.includes('PICKER'))links.push('<a class="waLink" style="margin-top:0" target="_top" href="'+MAIN+'?page=picker">Open Picker</a>');return '<div class="accessUser"><div class="row" style="justify-content:space-between"><div><b>'+safe(r.name||'Staff')+'</b> <span class="badge">'+safe(labelRole(r.role))+'</span><div class="muted">'+safe(r.mobile)+' · '+safe(r.staffId)+'</div></div><span class="badge '+(r.status==='ACTIVE'?'':'warn')+'">'+safe(r.status)+'</span></div><div class="accessMeta">'+(apps.length?apps.map(a=>'<span class="badge">App: '+safe(labelApp(a))+'</span>').join(''):'<span class="badge warn">No app access</span>')+(r.lastLogin?'<span class="badge">Last login: '+safe(r.lastLogin)+'</span>':'')+'</div><div class="accessActions"><button class="secondary" type="button" data-staff="'+safe(r.staffId)+'" data-mobile="'+safe(r.mobile)+'" onclick="resetAccessPinV917(this.dataset.staff,this.dataset.mobile)">Reset PIN</button><button class="secondary" type="button" data-staff="'+safe(r.staffId)+'" data-status="'+(r.status==='ACTIVE'?'INACTIVE':'ACTIVE')+'" onclick="setAccessStatusV917(this.dataset.staff,this.dataset.status)">'+(r.status==='ACTIVE'?'Disable':'Reactivate')+'</button>'+links.join('')+'</div></div>'}).join('');
  }
  window.grantAccessV917=async function(){
    const a=currentAdmin(),name=String(byId('acName')&&byId('acName').value||'').trim(),mobile=String(byId('acMobile')&&byId('acMobile').value||'').replace(/\D/g,'').slice(-10),role=String(byId('acRole')&&byId('acRole').value||''),allowedApps=selectedApps(),staffPin=String(byId('acPin')&&byId('acPin').value||'').trim(),b=byId('acGrant'),result=byId('acResult');
    if(!b||!result)return;if(!name||!/^\d{10}$/.test(mobile)||!/^\d{4,8}$/.test(staffPin)||!allowedApps.length){result.textContent='Name, valid 10 digit mobile, role, at least one App Access and 4–8 digit PIN are required.';return}
    b.disabled=true;b.textContent='Granting…';result.textContent='';
    try{const r=await staffCall('grantStaffAccessV917',[a.email,a.pin,{name,mobile,role,allowedApps,staffPin}]);if(!r||r.success===false)throw new Error(r&&r.error||'Access could not be created.');const apps=Array.isArray(r.allowedApps)?r.allowedApps:allowedApps;result.innerHTML='<b>Access active.</b> '+safe(labelRole(r.role||role))+' · Login: '+safe(r.mobile||mobile)+' · PIN '+safe(staffPin)+' · '+apps.map(labelApp).map(safe).join(', ');byId('acPin').value='';await window.loadAccessV917();if(typeof toast==='function')toast('Access granted to '+(r.name||name))}catch(e){result.textContent=e&&e.message?e.message:String(e);if(typeof toast==='function')toast(result.textContent)}finally{b.disabled=false;b.textContent='Grant Access'}
  };
  window.resetAccessPinV917=async function(staffId,mobile){
    const newPin=prompt('Enter a new 4–8 digit PIN for '+mobile,pin4());if(newPin===null)return;if(!/^\d{4,8}$/.test(String(newPin).trim()))return alert('Use a 4–8 digit numeric PIN.');
    const a=currentAdmin();try{const r=await staffCall('resetStaffPinV917',[a.email,a.pin,staffId,String(newPin).trim()]);if(!r||r.success===false)throw new Error(r&&r.error||'PIN reset failed.');alert('PIN reset successfully.\nMobile: '+mobile+'\nNew PIN: '+String(newPin).trim());if(typeof toast==='function')toast('Staff PIN reset')}catch(e){alert(e&&e.message?e.message:String(e))}
  };
  window.setAccessStatusV917=async function(staffId,status){
    if(!confirm((status==='ACTIVE'?'Reactivate':'Disable')+' this staff access?'))return;const a=currentAdmin();try{const r=await staffCall('setStaffAccessStatusV917',[a.email,a.pin,staffId,status]);if(!r||r.success===false)throw new Error(r&&r.error||'Access status update failed.');if(typeof toast==='function')toast('Access '+(status==='ACTIVE'?'reactivated':'disabled'));await window.loadAccessV917()}catch(e){alert(e&&e.message?e.message:String(e))}
  };
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})();
</script>
