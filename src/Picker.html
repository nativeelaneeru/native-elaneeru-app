<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Picker</title><style>:root{--g:#075b34;--bg:#f4f7f4;--line:#dfe7e1;--muted:#6b776e;--ink:#142019}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:16px}.head{max-width:680px;margin:auto}.brand{font-size:22px;font-weight:950}.sub{font-size:11px;opacity:.82}.wrap{max-width:680px;margin:auto;padding:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 4px 16px #0000000a}.login{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--g);color:#fff;font-weight:900}.alt{background:#edf7f0;color:var(--g)}.login .btn{grid-column:1/-1}.user,.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#e9f7ed;color:var(--g);font-size:10px;font-weight:900}.meta{font-size:11px;color:var(--muted)}.task h3{margin:6px 0}.qtys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.q{background:#f5f8f5;border-radius:12px;padding:9px}.q small{color:var(--muted)}.q b{display:block;font-size:22px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.msg{font-size:12px;color:#a23b26;margin:7px 2px}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:430px){.login{grid-template-columns:1fr}.login .btn{grid-column:auto}}</style></head><body><header><div class="head"><div class="brand">🥥 Native Elaneeru Picker</div><div class="sub">Pick → verify → pack → handoff</div></div></header><main class="wrap"><div id="login" class="card login"><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="Mobile number"><input id="pin" class="field" inputmode="numeric" type="password" placeholder="PIN"><button id="loginBtn" class="btn" onclick="load()">Start shift</button></div><div id="msg" class="msg"></div><div id="userBox"></div><div id="tasks"></div></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}let M='',P='';async function load(){const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';$('msg').textContent='';try{M=$('mobile').value.trim();P=$('pin').value;const d=await rpc('getV7PickerDashboard',[M,P]);$('login').style.display='none';$('userBox').innerHTML=`<div class="card user"><div><b>Hi, ${esc(d.user.name)}</b><div class="meta">${esc(d.user.staffId)} · ${esc(d.user.role)}</div></div><span class="badge">SHIFT ACTIVE</span></div>`;render(d.tasks||[])}catch(e){$('msg').textContent=e.message}finally{b.disabled=false;b.textContent='Start shift'}}function render(tasks){$('tasks').innerHTML=tasks.length?tasks.map(t=>{const req=Number(t['Required Qty'])||0,picked=Number(t['Picked Qty'])||0,assigned=Number(t['Assigned Batch Qty'])||0;return `<div class="card task"><div class="top"><div><span class="badge">${esc(t['Order Type']||'ORDER')}</span><h3>${esc(t['Display Name']||t['Order ID'])}</h3><div class="meta">${esc(t.Area||'')} · ${esc(t['Order ID'])}</div></div><span class="badge">${esc(t.Status||'NEW')}</span></div><div class="qtys"><div class="q"><small>Required</small><b>${req}</b></div><div class="q"><small>Picked</small><b>${picked}</b></div><div class="q"><small>Assigned</small><b>${assigned}</b></div></div><div class="actions"><button class="btn alt" onclick="act('${esc(t['Task ID'])}','START')">Start picking</button><button class="btn" onclick="act('${esc(t['Task ID'])}','COMPLETE')">Packed ✓</button></div></div>`}).join(''):'<div class="card empty">No pending picker tasks.</div>'}async function act(id,a){try{await rpc('updateV7PickerTask',[M,P,id,a,'']);await load()}catch(e){$('msg').textContent=e.message}}</script></body></html>
