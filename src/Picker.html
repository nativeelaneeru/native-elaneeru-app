<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6b3a"><title>Native Elaneeru Picker</title><style>
:root{--g:#0b6b3a;--bg:#f5f7f5;--line:#e0e8e1;--ink:#17241c;--muted:#6b766e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#075d32,#138b49);color:#fff;padding:15px 16px}.head{max-width:650px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:21px}.wrap{max-width:650px;margin:auto;padding:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px;box-shadow:0 3px 16px #00000009}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--g);color:#fff;font-weight:900}.btn.alt{background:#edf7f0;color:var(--g)}.login{display:grid;grid-template-columns:1fr 1fr;gap:8px}.login .btn{grid-column:1/-1}.user{display:flex;justify-content:space-between;align-items:center}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#e8f7ec;color:#096438;font-size:10px;font-weight:950}.taskTop{display:flex;justify-content:space-between;gap:8px}.task h3{margin:5px 0}.meta{font-size:12px;color:var(--muted)}.qtys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.q{background:#f5f8f5;border-radius:13px;padding:10px}.q small{color:var(--muted)}.q b{display:block;font-size:24px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{font-size:12px;color:#9a3412;margin:8px 2px}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:430px){.login{grid-template-columns:1fr}.login .btn{grid-column:auto}}</style></head><body><header><div class="head"><div><div class="brand">🥥 Picker</div><div style="font-size:11px;opacity:.8">Pick → verify → pack → handoff</div></div><span class="badge" style="background:#fff;color:#0b6b3a">OPERATIONS</span></div></header><main class="wrap"><div id="login" class="card login"><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="Mobile"><input id="pin" class="field" inputmode="numeric" type="password" placeholder="PIN"><button id="loginBtn" class="btn" onclick="load()">Start shift</button></div><div id="msg" class="msg"></div><div id="userBox"></div><div id="tasks"></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),call=(f,a=[])=>new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(e=>j(new Error(e&&e.message?e.message:String(e))))[f](...a));let M='',P='';async function load(){const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';$('msg').textContent='';try{M=$('mobile').value.trim();P=$('pin').value;const d=await call('getV7PickerDashboard',[M,P]);$('login').style.display='none';$('userBox').innerHTML=`<div class="card user"><div><b>Hi, ${esc(d.user.name)}</b><div class="meta">${esc(d.user.staffId)} · ${esc(d.user.role)}</div></div><span class="badge">SHIFT ACTIVE</span></div>`;render(d.tasks||[])}catch(e){$('msg').textContent=e.message}finally{b.disabled=false;b.textContent='Start shift'}}function render(tasks){$('tasks').innerHTML=tasks.length?tasks.map(t=>{const req=Number(t['Required Qty'])||0,picked=Number(t['Picked Qty'])||0,assigned=Number(t['Assigned Batch Qty'])||0;return `<div class="card task"><div class="taskTop"><div><span class="badge">${esc(t['Order Type']||'ORDER')}</span><h3>${esc(t['Display Name']||t['Order ID'])}</h3><div class="meta">${esc(t.Area||'')} · ${esc(t['Order ID'])}</div></div><span class="badge">${esc(t.Status||'NEW')}</span></div><div class="qtys"><div class="q"><small>Required</small><b>${req}</b></div><div class="q"><small>Picked</small><b>${picked}</b></div><div class="q"><small>Assigned</small><b>${assigned}</b></div></div><div class="actions"><button class="btn alt" onclick="act('${esc(t['Task ID'])}','START')">Start picking</button><button class="btn" onclick="act('${esc(t['Task ID'])}','COMPLETE')">Packed ✓</button></div></div>`}).join(''):'<div class="card empty">No pending picker tasks. You are clear for now.</div>'}async function act(id,a){try{await call('updateV7PickerTask',[M,P,id,a,'']);await load()}catch(e){$('msg').textContent=e.message}}</script></body></html>
