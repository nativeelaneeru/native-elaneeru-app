<style>
:root{
  --nel-green:#137333;--nel-green-2:#0d5d28;--nel-mint:#eaf7ef;--nel-bg:#f6f8f6;
  --nel-card:#fff;--nel-text:#17211b;--nel-muted:#66736b;--nel-line:#e3e9e5;
  --nel-shadow:0 8px 28px rgba(18,46,29,.08);--nel-radius:18px;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:var(--nel-bg);color:var(--nel-text);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,a,input,select,textarea{font:inherit}button,[role="button"],a{touch-action:manipulation}
button{min-height:44px;border-radius:12px;transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}
button:active{transform:scale(.985)}
input,select,textarea{min-height:46px;border-radius:12px!important;border-color:var(--nel-line)!important;background:#fff!important}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(19,115,51,.12)!important;border-color:var(--nel-green)!important}
.card,.panel,.tile,.box,.section,.sheet,.modal-content,.stat,.metric{border-radius:var(--nel-radius)!important;box-shadow:var(--nel-shadow);border-color:var(--nel-line)!important}
img{max-width:100%}
[disabled]{opacity:.55;cursor:not-allowed}.loading,.skeleton{animation:nelPulse 1.25s ease-in-out infinite alternate}
@keyframes nelPulse{from{opacity:.5}to{opacity:1}}
.nel-ux-launcher{position:fixed;right:16px;bottom:18px;z-index:99998;border:0;background:var(--nel-green);color:#fff;box-shadow:0 8px 24px rgba(19,115,51,.28);padding:11px 15px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px}
.nel-ux-panel{position:fixed;right:14px;bottom:76px;width:min(380px,calc(100vw - 28px));max-height:min(650px,76vh);overflow:auto;z-index:99999;background:#fff;border:1px solid var(--nel-line);border-radius:22px;box-shadow:0 22px 60px rgba(18,46,29,.2);padding:14px;display:none}
.nel-ux-panel.open{display:block}.nel-ux-head{display:flex;justify-content:space-between;align-items:center;padding:6px 4px 12px}.nel-ux-head b{font-size:17px}.nel-ux-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.nel-ux-app{display:flex;align-items:center;gap:9px;padding:12px;border:1px solid var(--nel-line);border-radius:14px;text-decoration:none;color:var(--nel-text);background:#fff;font-weight:700;min-height:58px}.nel-ux-app:hover{background:var(--nel-mint);border-color:#b9dcc6}.nel-ux-app span{font-size:20px}.nel-ux-current{background:var(--nel-mint)!important;border-color:#9fd0b0!important}.nel-ux-close{width:38px;height:38px;min-height:38px;border:0;background:#eef2ef;color:#33423a;font-size:20px;cursor:pointer}
.nel-ux-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:var(--nel-mint);color:var(--nel-green-2);font-size:12px;font-weight:800}.nel-ux-dot{width:7px;height:7px;border-radius:50%;background:#22a447;box-shadow:0 0 0 3px rgba(34,164,71,.12)}
@media(max-width:700px){body{padding-bottom:max(72px,env(safe-area-inset-bottom))}.nel-ux-launcher{right:12px;bottom:12px}.nel-ux-panel{right:10px;bottom:68px;width:calc(100vw - 20px)}.nel-ux-grid{grid-template-columns:1fr 1fr}button{min-height:46px}}
@media(max-width:390px){.nel-ux-grid{grid-template-columns:1fr}}
</style>
<script>
(function(){
  if(document.querySelector('.nel-ux-launcher'))return;
  const MAIN='https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec';
  const B2C='https://nativeelaneeru.github.io/native-elaneeru-app/b2c/';
  const B2B='https://nativeelaneeru.github.io/native-elaneeru-app/b2b/';
  const q=new URLSearchParams(location.search);let page=(q.get('page')||'').toLowerCase();
  if(!page){
    const t=String(document.title||'').toLowerCase();
    if(t.includes('cumulative')||t.includes('control tower'))page='dashboard';
    else if(t.includes('payment')||t.includes('upi'))page='payments';
    else if(t.includes('vendor approval'))page='approvals';
    else if(t.includes('vendor onboarding'))page='vendor';
    else if(t.includes('inventory'))page='inventory';
    else if(t.includes('barcode'))page='barcode';
    else if(t.includes('picker'))page='picker';
    else if(t.includes('sales'))page='sales';
    else if(t.includes('b2b driver')||t.includes('driver'))page='driver';
    else if(t.includes('delivery'))page='delivery';
    else if(t.includes('admin'))page='admin';
  }
  const apps=[
    ['dashboard','📊','Control Tower',MAIN+'?page=dashboard'],['admin','⚙️','Operations Admin',MAIN+'?page=admin'],['payments','💳','UPI Verification',MAIN+'?page=payments'],['approvals','✅','Vendor Approvals',MAIN+'?page=approvals'],
    ['vendor','🤝','Vendor Onboarding',MAIN+'?page=vendor'],['sales','📈','Sales',MAIN+'?page=sales'],['picker','📦','Picker',MAIN+'?page=picker'],['barcode','▦','Barcode',MAIN+'?page=barcode'],['inventory','🏬','Inventory',MAIN+'?page=inventory'],
    ['delivery','🛵','B2C Delivery',MAIN+'?page=delivery'],['driver','🚚','B2B Driver',MAIN+'?page=driver'],['b2b','🥥','B2B',B2B],['b2c','🛒','Customer',B2C]
  ];
  const btn=document.createElement('button');btn.type='button';btn.className='nel-ux-launcher';btn.innerHTML='☰ <span>Apps</span>';
  const panel=document.createElement('div');panel.className='nel-ux-panel';
  panel.innerHTML='<div class="nel-ux-head"><div><b>Native Elaneeru Apps</b><div class="nel-ux-badge"><i class="nel-ux-dot"></i>Production</div></div><button type="button" class="nel-ux-close" aria-label="Close">×</button></div><div class="nel-ux-grid">'+apps.map(a=>'<a target="_top" rel="noopener" class="nel-ux-app '+(page===a[0]?'nel-ux-current':'')+'" href="'+a[3]+'"><span>'+a[1]+'</span>'+a[2]+'</a>').join('')+'</div>';
  document.body.append(btn,panel);
  const close=()=>panel.classList.remove('open');btn.onclick=()=>panel.classList.toggle('open');panel.querySelector('.nel-ux-close').onclick=close;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
