<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f2;color:#17231a}header{position:sticky;top:0;z-index:4;background:#0d5f3c;color:#fff;padding:15px 16px}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.85}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe9df;border-radius:17px;padding:14px;margin:11px 0;box-shadow:0 5px 18px #163c2020}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button{width:100%;padding:12px;border-radius:11px;border:1px solid #d8e3d9;font:inherit}button{background:#0d5f3c;color:white;border:0;font-weight:850}.secondary{background:#edf6ef;color:#0d5f3c}.danger{background:#9b302b}.hidden{display:none!important}.routeHead{display:flex;justify-content:space-between;gap:12px}.stop{border-left:5px solid #d9e6dc}.stop.active{border-left-color:#0d5f3c}.stop.done{opacity:.58}.seq{width:32px;height:32px;border-radius:50%;background:#0d5f3c;color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:8px}.muted{color:#6c786e;font-size:12px}.badge{font-size:10px;border-radius:20px;background:#eaf5ed;padding:5px 8px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.progress{height:8px;background:#e5eee6;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#0d5f3c}.scanbox{background:#f5faf6;padding:10px;border-radius:12px;margin-top:10px}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">🥥 Native Elaneeru · B2B Driver</div><div class="sub">Bulk route • shop check-in • barcode verified delivery</div></header><div class="wrap">
<div id="login" class="card"><div class="grid"><input id="mobile" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="Driver mobile"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN"></div><button id="loginBtn" style="margin-top:9px" onclick="login()">Login</button><div id="msg" class="muted" style="margin-top:8px"></div></div>
<div id="app" class="hidden"><div id="summary" class="card"></div><div id="stops"></div></div></div>
<script>
const $=id=>document.getElementById(id);let MOB='',PIN='',DATA={route:null,stops:[],driver:{},hub:{}},WATCH=null,LAST=0;
function call(fn,args=[]){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message:String(e))))[fn](...args))}
function localDate(){const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function normalise(raw){const d=raw&&typeof raw==='object'?raw:{};d.route=d.route&&typeof d.route==='object'?d.route:null;d.stops=Array.isArray(d.stops)?d.stops:[];d.driver=d.driver&&typeof d.driver==='object'?d.driver:{};d.hub=d.hub&&typeof d.hub==='object'?d.hub:{};return d}
async function login(){MOB=String($('mobile').value||'').replace(/\D/g,'').slice(-10);PIN=String($('pin').value||'').trim();const b=$('loginBtn');if(b){b.disabled=true;b.textContent='Signing in…'};$('msg').textContent='';try{if(!/^\d{10}$/.test(MOB)||PIN.length<4)throw new Error('Enter your driver mobile number and PIN.');const r=await call('driverLoginV8',[MOB,PIN,'B2B']);if(!r||r.success===false)throw new Error(r&&r.error||'B2B driver login failed.');$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e&&e.message?e.message:String(e)}finally{if(b){b.disabled=false;b.textContent='Login'}}}
async function refresh(){try{DATA=normalise(await call('getDriverDayRouteV8',[MOB,PIN,'B2B',localDate()]));render()}catch(e){DATA=normalise(null);render();$('msg').textContent=e&&e.message?e.message:String(e)}}
function render(){DATA=normalise(DATA);const r=DATA.route,s=DATA.stops;if(!r){$('summary').innerHTML='<b>No B2B route assigned today.</b><div class="muted" style="margin-top:5px">Stay online and refresh after Admin generates the route.</div>';$('stops').innerHTML='';return}
 $('summary').innerHTML=`<div class="routeHead"><div><b>${esc(r.routeId)}</b><div class="muted">${esc(DATA.driver.name)} • ${esc(DATA.driver.vehicle||'')}</div></div><span class="badge">${esc(r.status)}</span></div><div style="margin-top:8px"><b>${Number(r.completedStops)||0}/${Number(r.totalStops)||0}</b> shops completed • ${Number(r.roadKm||0).toFixed(1)} road km</div><div class="progress"><i style="width:${Number(r.totalStops)>0?Math.min(100,100*(Number(r.completedStops)||0)/Number(r.totalStops)):0}%"></i></div><div class="muted" style="margin-top:6px">Sequence: ${esc(r.optimizationSource||'')}</div>`;
 const current=s.find(y=>!['COMPLETED','CANCELLED'].includes(String(y&&y.status||'').toUpperCase()));
 $('stops').innerHTML=s.map(x=>{x=x&&typeof x==='object'?x:{};const done=String(x.status||'').toUpperCase()==='COMPLETED',active=!done&&current&&current.stopId===x.stopId;return `<div class="card stop ${active?'active':''} ${done?'done':''}"><div><span class="seq">${Number(x.sequence)||0}</span><b>${esc(x.name)}</b> <span class="badge">${esc(x.status)}</span></div><div class="muted" style="margin:7px 0">${esc(x.address)}<br>${Number(x.requiredQty)||0} coconuts • ${Number(x.roadKm||0).toFixed(1)} km from previous • ETA ${esc(x.eta)}</div>${active?actions(x):''}</div>`}).join('')}
function actions(x){return `<div class="actions"><button class="secondary" onclick="nav(${Number(x.lat)||0},${Number(x.lng)||0})">🧭 Navigate</button><button onclick="checkin('${esc(x.stopId)}')">📍 Check In</button></div><div class="scanbox"><div class="muted">Barcode delivery verification</div><div class="grid"><input id="bc_${esc(x.stopId)}" placeholder="Scan / enter barcode"><button onclick="scan('${esc(x.stopId)}')">Scan Batch</button></div><div class="muted" id="scan_${esc(x.stopId)}">${Number(x.assignedQty)||0}/${Number(x.requiredQty)||0} verified</div></div><div class="grid" style="margin-top:9px"><input id="otp_${esc(x.stopId)}" inputmode="numeric" placeholder="Delivery OTP"><input id="rem_${esc(x.stopId)}" placeholder="Remarks"></div><div class="actions"><button onclick="deliver('${esc(x.stopId)}')">✅ Deliver</button><button class="danger" onclick="checkout('${esc(x.stopId)}')">🏁 Check Out</button></div>`}
function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000}))}
async function checkin(id){try{const p=await pos();await call('driverCheckInV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);startGps(id);await refresh()}catch(e){alert(e&&e.message?e.message:String(e))}}
async function scan(id){try{const input=$('bc_'+id),b=String(input&&input.value||'').trim();if(!b)throw new Error('Scan or enter the assigned barcode.');const r=await call('driverScanBarcodeV8',[MOB,PIN,'B2B',id,b]);if(!r)throw new Error('Barcode verification did not return a result.');const host=$('scan_'+id);if(host)host.textContent=(Number(r.scannedQty)||0)+'/'+(Number(r.requiredQty)||0)+' verified'+(r.verified?' ✓':'')}catch(e){alert(e&&e.message?e.message:String(e))}}
async function deliver(id){try{const otp=$('otp_'+id),remarks=$('rem_'+id);if(!otp||!String(otp.value||'').trim())throw new Error('Enter the delivery OTP.');const p=await pos();await call('driverDeliverV8',[MOB,PIN,'B2B',id,String(otp.value||'').trim(),p.coords.latitude,p.coords.longitude,remarks?remarks.value:'']);await refresh()}catch(e){alert(e&&e.message?e.message:String(e))}}
async function checkout(id){try{const p=await pos();await call('driverCheckOutV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);stopGps();await refresh()}catch(e){alert(e&&e.message?e.message:String(e))}}
function startGps(id){stopGps();WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await call('updateDriverLiveV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}}
function nav(a,b){if(!Number.isFinite(Number(a))||!Number.isFinite(Number(b)))return alert('Location is unavailable for this stop.');window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a+','+b),'_blank')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
