<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a5a"><title>Native Elaneeru B2B Driver</title><style>:root{--g:#123a5a;--g2:#0f7280;--bg:#f2f5f8;--line:#dbe3ea;--muted:#6b7884;--ink:#172634;--danger:#a33127}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5f8fa,#edf2f5);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0c2940,#123a5a 55%,#0f7280);color:#fff;padding:15px 16px;box-shadow:0 8px 24px rgba(13,42,62,.25)}.brand{font-size:20px;font-weight:950}.sub{font-size:11px;opacity:.82}.wrap{max-width:700px;margin:auto;padding:14px 14px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:11px 0;box-shadow:0 7px 20px rgba(18,58,90,.07)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button{width:100%;padding:12px;border-radius:11px;border:1px solid #d8e3e8;font:inherit}button{background:var(--g);color:#fff;border:0;font-weight:900}.secondary{background:#eaf2f6;color:var(--g)}.camera{background:#0f7280;color:#fff}.danger{background:var(--danger)}.hidden{display:none!important}.routeHead{display:flex;justify-content:space-between;gap:12px}.stop{border-left:5px solid #d9e3e8}.stop.active{border-left-color:var(--g)}.stop.done{opacity:.58}.seq{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:8px}.muted{color:var(--muted);font-size:12px}.badge{font-size:10px;border-radius:20px;background:#e9f2f6;color:var(--g);padding:5px 8px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.progress{height:8px;background:#e5ecef;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2))}.scanbox{background:#f3f7f9;padding:10px;border-radius:12px;margin-top:10px;border:1px solid #e2eaee}.scanActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.msg{font-size:12px;color:#9a3412;margin:8px 2px}@media(max-width:560px){.grid,.actions,.scanActions{grid-template-columns:1fr}}</style></head><body><header><div class="brand">🥥 Native Elaneeru · B2B Driver</div><div class="sub">Bulk route · shop check-in · barcode verification · delivery OTP</div></header><div class="wrap"><div id="login" class="card"><div class="grid"><input id="mobile" placeholder="Driver mobile"><input id="pin" type="password" placeholder="PIN"></div><button style="margin-top:9px" onclick="login()">Login</button><div id="msg" class="msg"></div></div><div id="app" class="hidden"><div id="summary" class="card"></div><div id="stops"></div></div></div><script>const $=id=>document.getElementById(id);let MOB='',PIN='',DATA=null,WATCH=null,LAST=0;function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}async function login(){MOB=$('mobile').value.trim();PIN=$('pin').value.trim();try{await rpc('driverLoginV8',[MOB,PIN,'B2B']);$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e.message}}async function refresh(){try{DATA=await rpc('getDriverDayRouteV8',[MOB,PIN,'B2B',today()]);render()}catch(e){alert(e.message)}}function render(){const r=DATA?.route,s=DATA?.stops||[];if(!r){stopGps();$('summary').innerHTML='<b>No B2B route assigned today.</b>';$('stops').innerHTML='';return}$('summary').innerHTML=`<div class="routeHead"><div><b>${esc(r.routeId)}</b><div class="muted">${esc(DATA.driver?.name||'')} · ${esc(DATA.driver?.vehicle||'')}</div></div><span class="badge">${esc(r.status)}</span></div><div style="margin-top:8px"><b>${r.completedStops}/${r.totalStops}</b> shops completed · ${Number(r.roadKm||0).toFixed(1)} road km</div><div class="progress"><i style="width:${r.totalStops?100*r.completedStops/r.totalStops:0}%"></i></div><div class="muted" style="margin-top:6px">${esc(r.optimizationSource||'')}</div>`;$('stops').innerHTML=s.map(x=>{const done=String(x.status).toUpperCase()==='COMPLETED',active=!done&&s.find(y=>!['COMPLETED','CANCELLED'].includes(String(y.status).toUpperCase()))?.stopId===x.stopId;return `<div class="card stop ${active?'active':''} ${done?'done':''}"><div><span class="seq">${x.sequence}</span><b>${esc(x.name)}</b> <span class="badge">${esc(x.status)}</span></div><div class="muted" style="margin:7px 0">${esc(x.address)}<br>${Number(x.requiredQty||0)} coconuts · ${Number(x.roadKm||0).toFixed(1)} km · ETA ${esc(x.eta||'')}</div>${active?actions(x):''}</div>`}).join('')}function actions(x){const id=esc(x.stopId);return `<div class="actions"><button class="secondary" onclick="nav(${Number(x.lat||0)},${Number(x.lng||0)})">🧭 Navigate</button><button onclick="checkin('${id}')">📍 Check In</button></div><div class="scanbox"><div class="muted"><b>Batch barcode verification</b><br>Use phone camera, USB scanner or type the barcode.</div><input id="bc_${id}" placeholder="Scan / enter barcode" style="margin-top:8px"><input id="cam_${id}" class="hidden" type="file" accept="image/*" capture="environment" onchange="cameraPicked('${id}',this)"><div class="scanActions"><button class="camera" onclick="openCamera('${id}')">📷 Scan with camera</button><button onclick="scan('${id}')">✓ Verify barcode</button></div><div class="muted" id="scan_${id}" style="margin-top:7px">${Number(x.assignedQty||0)}/${Number(x.requiredQty||0)} verified</div></div><div class="grid" style="margin-top:9px"><input id="otp_${id}" placeholder="Delivery OTP"><input id="rem_${id}" placeholder="Remarks"></div><div class="actions"><button onclick="deliver('${id}')">✅ Deliver</button><button class="danger" onclick="checkout('${id}')">🏁 Check Out</button></div>`}function openCamera(id){const f=$('cam_'+id);if(f){f.value='';f.click()}}async function cameraPicked(id,input){const file=input.files&&input.files[0];if(!file)return;try{if(!('BarcodeDetector' in window))throw new Error('Automatic camera barcode reading is not supported on this browser. Use a mobile Chrome/Android camera, USB scanner, or enter the barcode manually.');const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf']});const bmp=await createImageBitmap(file);const codes=await detector.detect(bmp);bmp.close&&bmp.close();if(!codes.length)throw new Error('No barcode detected. Move closer, keep the label flat and try again.');$('bc_'+id).value=codes[0].rawValue||'';await scan(id)}catch(e){alert(e.message)}}function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:3000}))}async function checkin(id){try{const p=await pos();await rpc('driverCheckInV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);startGps(id);await refresh()}catch(e){alert(e.message)}}async function scan(id){try{const b=$('bc_'+id).value.trim();if(!b)return alert('Scan or enter a barcode');const r=await rpc('driverScanBarcodeV8',[MOB,PIN,'B2B',id,b]);$('scan_'+id).textContent=r.scannedQty+'/'+r.requiredQty+' verified'+(r.verified?' ✓':'')}catch(e){alert(e.message)}}async function deliver(id){try{const otp=$('otp_'+id).value.trim();if(!otp)return alert('Enter delivery OTP');const p=await pos();await rpc('driverDeliverV8',[MOB,PIN,'B2B',id,otp,p.coords.latitude,p.coords.longitude,$('rem_'+id).value]);await refresh()}catch(e){alert(e.message)}}async function checkout(id){try{const p=await pos();await rpc('driverCheckOutV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);stopGps();await refresh()}catch(e){alert(e.message)}}function startGps(id){stopGps();WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await rpc('updateDriverLiveV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}}function nav(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}</script></body></html>
