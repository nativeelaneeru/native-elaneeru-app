<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru B2B Driver</title><style>:root{--g:#075b34;--bg:#f4f7f4;--line:#dfe7e1;--muted:#6b776e;--ink:#142019;--danger:#a33127}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#06472b,#0b8f50);color:#fff;padding:15px 16px}.brand{font-size:20px;font-weight:950}.sub{font-size:11px;opacity:.82}.wrap{max-width:700px;margin:auto;padding:14px 14px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;margin:11px 0;box-shadow:0 4px 16px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button{width:100%;padding:12px;border-radius:11px;border:1px solid #d8e3d9;font:inherit}button{background:var(--g);color:#fff;border:0;font-weight:900}.secondary{background:#edf6ef;color:var(--g)}.danger{background:var(--danger)}.hidden{display:none!important}.routeHead{display:flex;justify-content:space-between;gap:12px}.stop{border-left:5px solid #d9e6dc}.stop.active{border-left-color:var(--g)}.stop.done{opacity:.58}.seq{width:32px;height:32px;border-radius:50%;background:var(--g);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:8px}.muted{color:var(--muted);font-size:12px}.badge{font-size:10px;border-radius:20px;background:#eaf5ed;padding:5px 8px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.progress{height:8px;background:#e5eee6;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--g)}.scanbox{background:#f5faf6;padding:10px;border-radius:12px;margin-top:10px}.msg{font-size:12px;color:#9a3412;margin:8px 2px}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><header><div class="brand">🥥 Native Elaneeru · B2B Driver</div><div class="sub">Bulk route · shop check-in · barcode · delivery OTP</div></header><div class="wrap"><div id="login" class="card"><div class="grid"><input id="mobile" placeholder="Driver mobile"><input id="pin" type="password" placeholder="PIN"></div><button style="margin-top:9px" onclick="login()">Login</button><div id="msg" class="msg"></div></div><div id="app" class="hidden"><div id="summary" class="card"></div><div id="stops"></div></div></div><script>const $=id=>document.getElementById(id);let MOB='',PIN='',DATA=null,WATCH=null,LAST=0;function rpc(name,args=[]){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e)))).rpcV9(name,args))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}async function login(){MOB=$('mobile').value.trim();PIN=$('pin').value.trim();try{await rpc('driverLoginV8',[MOB,PIN,'B2B']);$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e.message}}async function refresh(){try{DATA=await rpc('getDriverDayRouteV8',[MOB,PIN,'B2B',today()]);render()}catch(e){alert(e.message)}}function render(){const r=DATA?.route,s=DATA?.stops||[];if(!r){stopGps();$('summary').innerHTML='<b>No B2B route assigned today.</b>';$('stops').innerHTML='';return}$('summary').innerHTML=`<div class="routeHead"><div><b>${esc(r.routeId)}</b><div class="muted">${esc(DATA.driver?.name||'')} · ${esc(DATA.driver?.vehicle||'')}</div></div><span class="badge">${esc(r.status)}</span></div><div style="margin-top:8px"><b>${r.completedStops}/${r.totalStops}</b> shops completed · ${Number(r.roadKm||0).toFixed(1)} road km</div><div class="progress"><i style="width:${r.totalStops?100*r.completedStops/r.totalStops:0}%"></i></div><div class="muted" style="margin-top:6px">${esc(r.optimizationSource||'')}</div>`;$('stops').innerHTML=s.map(x=>{const done=String(x.status).toUpperCase()==='COMPLETED',active=!done&&s.find(y=>!['COMPLETED','CANCELLED'].includes(String(y.status).toUpperCase()))?.stopId===x.stopId;return `<div class="card stop ${active?'active':''} ${done?'done':''}"><div><span class="seq">${x.sequence}</span><b>${esc(x.name)}</b> <span class="badge">${esc(x.status)}</span></div><div class="muted" style="margin:7px 0">${esc(x.address)}<br>${Number(x.requiredQty||0)} coconuts · ${Number(x.roadKm||0).toFixed(1)} km · ETA ${esc(x.eta||'')}</div>${active?actions(x):''}</div>`}).join('')}function actions(x){return `<div class="actions"><button class="secondary" onclick="nav(${Number(x.lat||0)},${Number(x.lng||0)})">🧭 Navigate</button><button onclick="checkin('${esc(x.stopId)}')">📍 Check In</button></div><div class="scanbox"><div class="muted">Barcode verification</div><div class="grid"><input id="bc_${esc(x.stopId)}" placeholder="Scan / enter barcode"><button onclick="scan('${esc(x.stopId)}')">Scan Batch</button></div><div class="muted" id="scan_${esc(x.stopId)}">${Number(x.assignedQty||0)}/${Number(x.requiredQty||0)} verified</div></div><div class="grid" style="margin-top:9px"><input id="otp_${esc(x.stopId)}" placeholder="Delivery OTP"><input id="rem_${esc(x.stopId)}" placeholder="Remarks"></div><div class="actions"><button onclick="deliver('${esc(x.stopId)}')">✅ Deliver</button><button class="danger" onclick="checkout('${esc(x.stopId)}')">🏁 Check Out</button></div>`}function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:3000}))}async function checkin(id){try{const p=await pos();await rpc('driverCheckInV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);startGps(id);await refresh()}catch(e){alert(e.message)}}async function scan(id){try{const b=$('bc_'+id).value.trim();if(!b)return alert('Scan or enter a barcode');const r=await rpc('driverScanBarcodeV8',[MOB,PIN,'B2B',id,b]);$('scan_'+id).textContent=r.scannedQty+'/'+r.requiredQty+' verified'+(r.verified?' ✓':'')}catch(e){alert(e.message)}}async function deliver(id){try{const otp=$('otp_'+id).value.trim();if(!otp)return alert('Enter delivery OTP');const p=await pos();await rpc('driverDeliverV8',[MOB,PIN,'B2B',id,otp,p.coords.latitude,p.coords.longitude,$('rem_'+id).value]);await refresh()}catch(e){alert(e.message)}}async function checkout(id){try{const p=await pos();await rpc('driverCheckOutV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);stopGps();await refresh()}catch(e){alert(e.message)}}function startGps(id){stopGps();WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await rpc('updateDriverLiveV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}}function nav(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}</script></body></html>
