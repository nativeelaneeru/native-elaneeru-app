<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f2;color:#17231a}header{position:sticky;top:0;z-index:4;background:#0d5f3c;color:#fff;padding:15px 16px}.brand{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.85}.wrap{max-width:700px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dfe9df;border-radius:17px;padding:14px;margin:11px 0;box-shadow:0 5px 18px #163c2020}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button{width:100%;padding:12px;border-radius:11px;border:1px solid #d8e3d9;font:inherit}button{background:#0d5f3c;color:white;border:0;font-weight:850}.secondary{background:#edf6ef;color:#0d5f3c}.danger{background:#9b302b}.hidden{display:none!important}.routeHead{display:flex;justify-content:space-between;gap:12px}.stop{border-left:5px solid #d9e6dc}.stop.active{border-left-color:#0d5f3c}.stop.done{opacity:.58}.seq{width:32px;height:32px;border-radius:50%;background:#0d5f3c;color:white;display:inline-flex;align-items:center;justify-content:center;font-weight:900;margin-right:8px}.muted{color:#6c786e;font-size:12px}.badge{font-size:10px;border-radius:20px;background:#eaf5ed;padding:5px 8px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.progress{height:8px;background:#e5eee6;border-radius:10px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:#0d5f3c}.scanbox{background:#f5faf6;padding:10px;border-radius:12px;margin-top:10px}@media(max-width:560px){.grid,.actions{grid-template-columns:1fr}}
</style></head><body><header><div class="brand">🥥 Native Elaneeru · B2B Driver</div><div class="sub">Bulk route • shop check-in • barcode verified delivery</div></header><div class="wrap">
<div id="login" class="card"><div class="grid"><input id="mobile" placeholder="Driver mobile"><input id="pin" type="password" placeholder="PIN"></div><button style="margin-top:9px" onclick="login()">Login</button><div id="msg" class="muted" style="margin-top:8px"></div></div>
<div id="app" class="hidden"><div id="summary" class="card"></div><div id="stops"></div></div></div>
<script>
const $=id=>document.getElementById(id);let MOB='',PIN='',DATA=null,WATCH=null,LAST=0;
function call(fn,args=[]){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message:e)))[fn](...args))}
async function login(){MOB=$('mobile').value.trim();PIN=$('pin').value.trim();try{await call('driverLoginV8',[MOB,PIN,'B2B']);$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e.message}}
async function refresh(){DATA=await call('getDriverDayRouteV8',[MOB,PIN,'B2B',new Date().toISOString().slice(0,10)]);render()}
function render(){const r=DATA.route,s=DATA.stops||[];if(!r){$('summary').innerHTML='<b>No B2B route assigned today.</b>';$('stops').innerHTML='';return}
 $('summary').innerHTML=`<div class="routeHead"><div><b>${r.routeId}</b><div class="muted">${DATA.driver.name} • ${DATA.driver.vehicle||''}</div></div><span class="badge">${r.status}</span></div><div style="margin-top:8px"><b>${r.completedStops}/${r.totalStops}</b> shops completed • ${r.roadKm} road km</div><div class="progress"><i style="width:${r.totalStops?100*r.completedStops/r.totalStops:0}%"></i></div><div class="muted" style="margin-top:6px">Sequence: ${r.optimizationSource}</div>`;
 $('stops').innerHTML=s.map(x=>{const done=x.status==='COMPLETED',active=!done&&s.find(y=>y.status!=='COMPLETED'&&y.status!=='CANCELLED')?.stopId===x.stopId;return `<div class="card stop ${active?'active':''} ${done?'done':''}"><div><span class="seq">${x.sequence}</span><b>${esc(x.name)}</b> <span class="badge">${esc(x.status)}</span></div><div class="muted" style="margin:7px 0">${esc(x.address)}<br>${x.requiredQty} coconuts • ${x.roadKm} km from previous • ETA ${esc(x.eta)}</div>${active?actions(x):''}</div>`}).join('')}
function actions(x){return `<div class="actions"><button class="secondary" onclick="nav(${x.lat},${x.lng})">🧭 Navigate</button><button onclick="checkin('${x.stopId}')">📍 Check In</button></div><div class="scanbox"><div class="muted">Barcode delivery verification</div><div class="grid"><input id="bc_${x.stopId}" placeholder="Scan / enter barcode"><button onclick="scan('${x.stopId}')">Scan Batch</button></div><div class="muted" id="scan_${x.stopId}">${x.assignedQty}/${x.requiredQty} verified</div></div><div class="grid" style="margin-top:9px"><input id="otp_${x.stopId}" placeholder="Delivery OTP"><input id="rem_${x.stopId}" placeholder="Remarks"></div><div class="actions"><button onclick="deliver('${x.stopId}')">✅ Deliver</button><button class="danger" onclick="checkout('${x.stopId}')">🏁 Check Out</button></div>`}
function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000}))}
async function checkin(id){try{const p=await pos();await call('driverCheckInV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);startGps(id);await refresh()}catch(e){alert(e.message)}}
async function scan(id){try{const b=$('bc_'+id).value.trim();const r=await call('driverScanBarcodeV8',[MOB,PIN,'B2B',id,b]);$('scan_'+id).textContent=r.scannedQty+'/'+r.requiredQty+' verified'+(r.verified?' ✓':'')}catch(e){alert(e.message)}}
async function deliver(id){try{const p=await pos();await call('driverDeliverV8',[MOB,PIN,'B2B',id,$('otp_'+id).value,p.coords.latitude,p.coords.longitude,$('rem_'+id).value]);await refresh()}catch(e){alert(e.message)}}
async function checkout(id){try{const p=await pos();await call('driverCheckOutV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude]);stopGps();await refresh()}catch(e){alert(e.message)}}
function startGps(id){stopGps();WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await call('updateDriverLiveV8',[MOB,PIN,'B2B',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}}
function nav(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
