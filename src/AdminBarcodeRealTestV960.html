<style>
#adminBarcodeV926 #abMockHint,#adminBarcodeV926 #abMockBar{display:none!important}
#adminBarcodeV926 .brtBox{margin:10px 0 14px;padding:14px;border:1px solid #e2b95e;border-radius:14px;background:#fff9e9;color:#5f470d}
#adminBarcodeV926 .brtActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
#adminBarcodeV926 .brtStatus{white-space:pre-wrap;margin-top:10px;padding:10px;border:1px solid #d6e8d9;border-radius:10px;background:#f6fbf7;color:#365443;font:12px/1.5 ui-monospace,monospace}
#adminBarcodeV926 .brtQty{width:85px;min-height:40px;padding:8px;border:1px solid #d8dfda;border-radius:8px}
@media(max-width:700px){#adminBarcodeV926 .brtActions button{min-height:44px;flex:1 1 46%}}
</style>
<script>
(function(){
  if(window.NEL_ADMIN_BARCODE_REAL_TEST_V960)return;
  window.NEL_ADMIN_BARCODE_REAL_TEST_V960=true;
  const DRIVER_URL='https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec?page=driver';
  let test=null;
  const byId=id=>document.getElementById(id);
  const admin=()=>({email:String(typeof E!=='undefined'?E:'').trim(),pin:String(typeof P!=='undefined'?P:'').trim()});
  const note=(text,ok)=>{const el=byId('abMsg');if(el){el.style.color=ok?'#155b2b':'#9a3412';el.textContent=text||''}};
  function rpc(method,args){
    return new Promise((resolve,reject)=>{
      try{
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))))
          .barcodeRpcV924(method,Array.isArray(args)?args:[]);
      }catch(e){reject(e)}
    });
  }
  function persist(){try{test?sessionStorage.setItem('nelRealBarcodeTest',JSON.stringify(test)):sessionStorage.removeItem('nelRealBarcodeTest')}catch(e){}}
  function restore(){try{const raw=sessionStorage.getItem('nelRealBarcodeTest');test=raw?JSON.parse(raw):null}catch(e){test=null}}
  function fillAssignment(){
    if(!test)return;
    if(byId('abAssignBarcode'))byId('abAssignBarcode').value=test.barcode||'';
    if(byId('abOrderType'))byId('abOrderType').value='B2B';
    if(byId('abOrderId'))byId('abOrderId').value=test.orderId||'';
    if(byId('abAssignQty'))byId('abAssignQty').value=test.qty||1;
  }
  function summary(status){
    if(!test)return 'No real test is active.';
    const lines=[
      'REAL TEST: '+test.testId,
      'Batch: '+test.batchId,
      'Barcode: '+test.barcode,
      'Order: '+test.orderId+' (B2B, qty '+test.qty+')',
      'Driver mobile: '+test.driverMobile,
      'Driver PIN: '+test.driverPin,
      'Delivery OTP: '+test.deliveryOtp,
      'Route: '+test.routeId,
      'Stop: '+test.stopId
    ];
    if(status){
      lines.push('Assignment: '+(status.assignment&&status.assignment.exists?(status.assignment.status+' scanned '+status.assignment.scanned+'/'+status.assignment.assigned):'PENDING'));
      lines.push('Stop status: '+(status.stop&&status.stop.status||'PENDING'));
      lines.push('Order status: '+(status.order&&status.order.status||''));
    }
    return lines.join('\n');
  }
  function render(status){
    const box=byId('brtBox');if(!box)return;
    if(!test){
      box.innerHTML=`<b>🧪 REAL end-to-end barcode test</b><div class="muted" style="margin-top:5px">Creates real test rows in the production operations workbook using the same batch, assignment and driver flow. No payment, cashback, subscription or vendor-credit write is created.</div><div style="margin-top:9px">Qty <input id="brtQty" class="brtQty" type="number" min="1" max="50" value="5"></div><div class="brtActions"><button type="button" onclick="startBarcodeRealTestV960()">Create REAL Test Setup</button></div>`;
      return;
    }
    box.innerHTML=`<b>🧪 REAL TEST ACTIVE</b><div id="brtStatus" class="brtStatus"></div><div class="brtActions"><button type="button" onclick="printBarcodeRealTestV960()">🖨️ Print Barcode</button><button type="button" onclick="assignBarcodeRealTestV960()">2 · Scan & Assign</button><button type="button" onclick="openBarcodeRealDriverV960()">3 · Open B2B Driver</button><button type="button" class="secondary" onclick="refreshBarcodeRealTestV960()">Refresh Status</button><button type="button" class="secondary" onclick="cleanupBarcodeRealTestV960()">Delete Test Data</button></div><div class="muted" style="margin-top:8px">Driver: Check In → scan the same barcode → Deliver using the OTP → Check Out. These are real operational writes until cleanup.</div>`;
    byId('brtStatus').textContent=summary(status);
    fillAssignment();
  }
  window.startBarcodeRealTestV960=async function(){
    const a=admin(),product=byId('abProduct'),qty=Math.max(1,Math.min(50,Number(byId('brtQty')&&byId('brtQty').value||5)));
    if(!a.email||!a.pin)return note('Admin session is required.',false);
    if(!product||!product.value)return note('Select a product first.',false);
    if(!confirm('Create real test batch/order/driver/route records now? You can delete them with Delete Test Data.'))return;
    try{
      test=await rpc('createBarcodeRealTestV959',[a.email,a.pin,{productId:product.value,qty:qty}]);
      if(!test||!test.success)throw new Error('Real test setup failed.');
      persist();fillAssignment();
      if(typeof window.loadAdminBarcodeV926==='function')await window.loadAdminBarcodeV926(true);
      render();note('Real test created. Print the barcode, then use Step 2 camera and assign.',true);
    }catch(e){note(e&&e.message?e.message:String(e),false)}
  };
  window.printBarcodeRealTestV960=function(){
    if(!test)return note('Create the real test first.',false);
    const rows=byId('abRows')?Array.from(byId('abRows').querySelectorAll('tr')):[];
    const idx=rows.findIndex(tr=>tr.textContent.includes(test.batchId));
    if(idx<0)return note('Test batch not visible yet. Refresh Barcode and try again.',false);
    if(typeof window.adminBarcodePrintBatchV926==='function')window.adminBarcodePrintBatchV926(idx);
  };
  window.assignBarcodeRealTestV960=function(){
    if(!test)return note('Create the real test first.',false);
    fillAssignment();
    if(typeof window.adminBarcodeSubtabV926==='function')window.adminBarcodeSubtabV926('assign');
    note('Step 2 ready. Scan '+test.barcode+' and press Validate & assign.',true);
  };
  window.openBarcodeRealDriverV960=function(){
    if(!test)return note('Create the real test first.',false);
    window.open(DRIVER_URL,'nelBarcodeRealDriver','noopener');
    note('Driver opened. Use mobile '+test.driverMobile+', PIN '+test.driverPin+', OTP '+test.deliveryOtp+'.',true);
  };
  window.refreshBarcodeRealTestV960=async function(){
    if(!test)return render();
    const a=admin();
    try{const status=await rpc('getBarcodeRealTestStatusV959',[a.email,a.pin,test.testId]);render(status);note('Real test status refreshed.',true)}catch(e){note(e&&e.message?e.message:String(e),false)}
  };
  window.cleanupBarcodeRealTestV960=async function(){
    if(!test)return note('No active real test.',false);
    if(!confirm('Delete all records created for '+test.testId+'?'))return;
    const a=admin(),id=test.testId;
    try{
      await rpc('cleanupBarcodeRealTestV959',[a.email,a.pin,id]);
      test=null;persist();
      if(byId('abAssignBarcode'))byId('abAssignBarcode').value='';
      if(byId('abOrderId'))byId('abOrderId').value='';
      if(byId('abAssignQty'))byId('abAssignQty').value='';
      if(typeof window.loadAdminBarcodeV926==='function')await window.loadAdminBarcodeV926(true);
      render();note('Real test '+id+' deleted.',true);
    }catch(e){note(e&&e.message?e.message:String(e),false)}
  };
  function install(){
    const root=byId('adminBarcodeV926');if(!root||byId('brtBox'))return;
    const pane=root.querySelector('[data-abpane="batch"]');if(!pane)return;
    const box=document.createElement('div');box.id='brtBox';box.className='brtBox';pane.insertBefore(box,pane.firstChild);
    restore();render();if(test)setTimeout(window.refreshBarcodeRealTestV960,120);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(install,0),{once:true});else setTimeout(install,0);
})();
</script>
