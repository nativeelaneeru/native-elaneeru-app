e keb office back side","lat":12.9172285,"lng":77.6103711,"qty":300,"status":"APPROVED","price":43},{"id":"ONB-260923130955-W62H","name":"Kantaraj coconut","owner":"Kantaraj","phone":"9902770892","area":"Front of Jawa showroom","address":"Front of jawa showroom","lat":12.9390656,"lng":77.5714347,"qty":300,"status":"APPROVED","price":44},{"id":"ONB-260923140147-LDZZ","name":"Bagyamma","owner":"Bagyamma","phone":"9900621028","area":"Banashankari 2nd stage","address":"Banashankari 2 nd stage 27 cross opposite achieve school of education","lat":12.922504,"lng":77.5658129,"qty":100,"status":"APPROVED","price":43},{"id":"ONB-260927143710-D1ED","name":"Sudha","owner":"Sudha","phone":"9980938005","area":"Begur","address":"Begur Princeton appartment opposite","lat":12.8789027,"lng":77.637486,"qty":300,"status":"APPROVED","price":43},{"id":"ONB-260927150011-GTZN","name":"Manjunath","owner":"Manjunath","phone":"8105715225","area":"Begur","address":"Prestige song of the south appt","lat":12.8621533,"lng":77.6143069,"qty":100,"status":"APPROVED","price":43}];
const HUB={lat:12.809051894563096,lng:77.59800019834104};
const STORE='nel_field_drafts_v1',FIX='nel_field_corrections_v1',VISIT='nel_field_visits_v1';
let pos=null,watch=null,selected=null,sortNearest=false;
function el(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(_){return {}}}
function put(k,obj){try{localStorage.setItem(k,JSON.stringify(obj))}catch(e){alert('Local draft storage unavailable: '+e.message)}}
function coords(v){const d=get(FIX)[v.id]||{};return {lat:Number(d.lat)||v.lat,lng:Number(d.lng)||v.lng}}
function rad(n){return n*Math.PI/180}
function dist(a,b){if(!a||!b||!a.lat||!b.lat)return Infinity;const x=rad(b.lat-a.lat),y=rad(b.lng-a.lng);return Math.round(6371*2*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(y/2)**2))*10)/10}
function download(name,arr){const s=arr.map(row=>row.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function ui(){
if(el('nel-field-panel'))return;
const flow=el('flow');if(!flow)return;
const panel=document.createElement('section');panel.id='nel-field-panel';panel.innerHTML=
'<h2>📍 Vendor Visits & Orders (Field Draft)</h2><p class="nf-muted">Authorized staff only · Existing vendor data snapshot · Orders and corrections stay on this device until reviewed and imported.</p>'+
'<div class="nf-warn">Your browser must use a secure HTTPS page and allow Location. If location is denied, vendor map links still work. No live order is placed here.</div>'+
'<div><button id="nf-gps">Get My GPS</button><button id="nf-watch" class="nf-secondary">Track GPS</button><button id="nf-stop" class="nf-secondary">Stop GPS</button><button id="nf-nearest" class="nf-secondary">Nearest first</button><button id="nf-orders" class="nf-secondary">Export orders CSV</button><button id="nf-corrections" class="nf-secondary">Export corrections CSV</button></div>'+
'<p id="nf-message" class="nf-muted">Hub: 12.8090519, 77.5980002</p><input id="nf-search" placeholder="Search vendor, area, phone"><div id="nf-list" class="nf-grid"></div>'+
'<div id="nf-editor" class="nf-card" style="display:none;margin-top:12px"><h3 id="nf-title"></h3><label>Order qty<input id="nf-qty" type="number" min="1" step="1"></label><label>Unit price (₹, provisional)<input id="nf-price" type="number" min="0" step=".01"></label><label>Delivery date<input id="nf-date" type="date"></label><label>Delivery slot<input id="nf-slot" placeholder="e.g. 7:00–9:00 AM"></label><label>Visit feedback<textarea id="nf-notes" rows="2"></textarea></label><label>Correct contact number<input id="nf-phone" inputmode="numeric" maxlength="10"></label><label>Correct latitude<input id="nf-lat" type="number" step="any"></label><label>Correct longitude<input id="nf-lng" type="number" step="any"></label><button id="nf-save">Save order draft</button><button id="nf-visited" class="nf-secondary">Mark visited</button><button id="nf-usegps" class="nf-secondary">Use my GPS for shop location</button><button id="nf-savefix" class="nf-secondary">Save corrections</button></div>';
flow.insertBefore(panel,flow.children[1]||null);
const toggle=document.createElement('button');toggle.type='button';toggle.className='btn alt';toggle.textContent='📍 Visits & Orders';toggle.style.margin='7px 0 13px';toggle.onclick=()=>{panel.style.display=panel.style.display==='block'?'none':'block';if(panel.style.display==='block')render()};
const bar=el('salesBox');if(bar)bar.appendChild(toggle);
el('nf-gps').onclick=()=>locate(false);el('nf-watch').onclick=()=>locate(true);el('nf-stop').onclick=()=>{if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}el('nf-message').textContent='GPS tracking stopped.'};
el('nf-nearest').onclick=()=>{sortNearest=!sortNearest;render()};
el('nf-search').oninput=render;
el('nf-orders').onclick=()=>{const all=Object.values(get(STORE));download('NE_Field_Order_Drafts.csv',[['Vendor ID','Vendor','Qty','Price','Delivery Date','Slot','Notes','Saved At'],...all.map(x=>[x.id,x.name,x.qty,x.price,x.date,x.slot,x.notes,x.savedAt])])};
el('nf-corrections').onclick=()=>{const fixes=get(FIX);download('NE_Vendor_Corrections.csv',[['Vendor ID','Phone','Latitude','Longitude','Saved At'],...Object.entries(fixes).map(([id,x])=>[id,x.phone,x.lat,x.lng,x.savedAt])])};
el('nf-usegps').onclick=()=>{if(!pos){alert('First capture your GPS while physically at the shop.');return}el('nf-lat').value=pos.lat;el('nf-lng').value=pos.lng};
el('nf-savefix').onclick=()=>{if(!selected)return;const phone=el('nf-phone').value.trim(),lat=Number(el('nf-lat').value),lng=Number(el('nf-lng').value);if(phone&&!/^[6-9]\d{9}$/.test(phone)){alert('Invalid 10-digit mobile number');return}if(!Number.isFinite(lat)||!Number.isFinite(lng)||lat<8||lat>38||lng<68||lng>98){alert('Enter valid Indian GPS coordinates');return}const d=get(FIX);d[selected.id]={phone,lat,lng,savedAt:new Date().toISOString()};put(FIX,d);render();alert('Correction saved locally; export CSV for admin review.')};
el('nf-save').onclick=()=>{if(!selected)return;const qty=Number(el('nf-qty').value),price=Number(el('nf-price').value);if(!Number.isInteger(qty)||qty<1||!(price>0)||!el('nf-date').value||!el('nf-slot').value.trim()){alert('Enter valid quantity, price, delivery date and time slot');return}const d=get(STORE);d[selected.id]={id:selected.id,name:selected.name,qty,price,date:el('nf-date').value,slot:el('nf-slot').value,notes:el('nf-notes').value,savedAt:new Date().toISOString()};put(STORE,d);render();alert('Order draft saved on this device only. No live order created.')};
el('nf-visited').onclick=()=>{if(!selected)return;const d=get(VISIT);d[selected.id]=new Date().toISOString();put(VISIT,d);render();alert('Visit recorded locally.')};
render();
}
function locate(track){if(!navigator.geolocation){el('nf-message').textContent='GPS unsupported on this browser';return}if(!window.isSecureContext){el('nf-message').textContent='Location requires an HTTPS address. Open the deployed onboarding app in Chrome.';return}const ok=p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};el('nf-message').textContent='GPS: '+pos.lat.toFixed(6)+', '+pos.lng.toFixed(6)+' · accuracy ±'+Math.round(p.coords.accuracy)+'m';render()},err=e=>{el('nf-message').textContent='GPS error: '+(e.code===1?'Location blocked. Allow it in Chrome site permissions and Android settings.':e.message)};if(track){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(ok,err,{enableHighAccuracy:true,maximumAge:0,timeout:20000})}else navigator.geolocation.getCurrentPosition(ok,err,{enableHighAccuracy:true,maximumAge:10000,timeout:20000})}
function edit(id){selected=VENDORS.find(v=>v.id===id);if(!selected)return;const fix=get(FIX)[id]||{},draft=get(STORE)[id]||{},loc=coords(selected);el('nf-editor').style.display='block';el('nf-title').textContent=selected.name+' · '+selected.id;el('nf-qty').value=draft.qty||'';el('nf-price').value=draft.price||selected.price||'';el('nf-date').value=draft.date||'';el('nf-slot').value=draft.slot||'';el('nf-notes').value=draft.notes||'';el('nf-phone').value=fix.phone||selected.phone;el('nf-lat').value=loc.lat||'';el('nf-lng').value=loc.lng||'';el('nf-editor').scrollIntoView({behavior:'smooth',block:'start'})}
function render(){if(!el('nf-list'))return;const q=el('nf-search').value.toLowerCase(),drafts=get(STORE),visits=get(VISIT),fix=get(FIX);let list=VENDORS.filter(v=>(v.name+' '+v.area+' '+v.phone+' '+v.owner).toLowerCase().includes(q));if(sortNearest&&pos)list.sort((a,b)=>dist(pos,coords(a))-dist(pos,coords(b)));el('nf-nearest').textContent=sortNearest?'Default sort':'Nearest first';el('nf-list').innerHTML=list.map(v=>{let c=coords(v),km=pos?dist(pos,c):dist(HUB,c);return '<div class="nf-card"><strong>'+esc(v.name)+'</strong><div class="nf-muted">'+esc(v.area)+' · '+esc(v.owner)+'</div><div class="nf-muted">'+esc(v.phone)+' · '+esc(v.status)+' · Demand '+v.qty+'</div><div class="nf-muted">'+(c.lat?'📍 '+c.lat.toFixed(6)+', '+c.lng.toFixed(6)+' · ':'⚠️ GPS missing · ')+(Number.isFinite(km)?km+' km '+(pos?'from you':'from hub'):'Distance unknown')+'</div><p>'+(visits[v.id]?'✅ Visited ':'')+(drafts[v.id]?'🧾 Order draft ':'')+(fix[v.id]?'✏️ Correction ':'')+'</p>'+(c.lat?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(c.lat+','+c.lng)+'">Navigate ↗</a> · ':'')+'<a href="tel:'+esc(v.phone)+'">Call ↗</a><br><button data-open="'+esc(v.id)+'">Visit / Order</button></div>'}).join('');el('nf-list').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>edit(b.getAttribute('data-open')))}
const timer=setInterval(()=>{if(el('flow')&&getComputedStyle(el('flow')).display!=='none'){clearInterval(timer);ui()}},500);setTimeout(()=>clearInterval(timer),120000);
})();
</script>
