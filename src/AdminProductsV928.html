<style>

</style>
<script>
(function(){
  if(window.NEL_ADMIN_PRODUCTS_V928)return;window.NEL_ADMIN_PRODUCTS_V928=true;
  var PRODUCTS=[],LOADED=false,EDITING='';
  var OLD=['orders','customers','feedback','tickets','delivery','routeplan','access','adminBarcodePanel'];
  function q(id){return document.getElementById(id)}
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
  function admin(){return {email:String(typeof E!=='undefined'?E:'').trim(),pin:String(typeof P!=='undefined'?P:'').trim()}}
  function msg(text,ok){var x=q('pmMsg');if(!x)return;x.style.color=ok?'#155b2b':'#9a3412';x.textContent=text||''}
  function num(id){return Number(q(id)&&q(id).value||0)}
  function val(id){return String(q(id)&&q(id).value||'').trim()}
  function checked(id){return !!(q(id)&&q(id).checked)}
  function callGet(a){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))}).getProductsAdminV928(a.email,a.pin)})}
  function callSave(a,p){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))}).saveProductAdminV928(a.email,a.pin,p)})}
  function callUpload(a,p){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))}).uploadProductImageAdminV928(a.email,a.pin,p)})}
  function callStatus(a,id,ch,status){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){reject(new Error(e&&e.message?e.message:String(e)))}).setProductChannelStatusAdminV928(a.email,a.pin,id,ch,status)})}
  function preview(url){var host=q('pmPreview');if(!host)return;url=String(url||'').trim();host.innerHTML=url?'<img src="'+esc(url)+'" alt="Product image" onerror="this.parentNode.textContent=\'Image could not be loaded. Use another public URL or upload a file.\'">':'No product image selected'}
  function resetForm(){
    EDITING='';['pmId','pmName','pmCategory','pmUnit','pmImage','pmDescription'].forEach(function(id){if(q(id))q(id).value='' });
    [['pmB2cPrice',''],['pmB2bPrice',''],['pmB2cMoq','1'],['pmB2bMoq','1'],['pmStep','1'],['pmBq1',''],['pmBp1',''],['pmBq2',''],['pmBp2',''],['pmSort','']].forEach(function(x){if(q(x[0]))q(x[0]).value=x[1]});
    if(q('pmBarcode'))q('pmBarcode').checked=true;if(q('pmB2cLive'))q('pmB2cLive').checked=true;if(q('pmB2bLive'))q('pmB2bLive').checked=true;if(q('pmFile'))q('pmFile').value='';
    if(q('pmId'))q('pmId').disabled=false;preview('');msg('New product mode.',true);var h=q('pmFormTitle');if(h)h.textContent='Add Product';
  }
  function payload(){
    return {productId:val('pmId').toUpperCase(),productName:val('pmName'),category:val('pmCategory'),unit:val('pmUnit')||'pc',b2cPrice:num('pmB2cPrice'),b2bPrice:num('pmB2bPrice'),b2cMoq:num('pmB2cMoq')||1,b2bMoq:num('pmB2bMoq')||1,qtyStep:num('pmStep')||1,bundleQty1:num('pmBq1'),bundlePrice1:num('pmBp1'),bundleQty2:num('pmBq2'),bundlePrice2:num('pmBp2'),barcodeRequired:checked('pmBarcode')?'YES':'NO',imageUrl:val('pmImage'),b2cStatus:checked('pmB2cLive')?'LIVE':'NOT LIVE',b2bStatus:checked('pmB2bLive')?'LIVE':'NOT LIVE',sortOrder:num('pmSort'),description:val('pmDescription')};
  }
  function productImage(p){return p&&p.imageUrl?'<img src="'+esc(p.imageUrl)+'" alt="'+esc(p.productName||'Product')+'" loading="lazy" onerror="this.remove();this.parentNode.textContent=\'📦\'">':'📦'}
  function filtered(){var s=val('pmSearch').toLowerCase();if(!s)return PRODUCTS;return PRODUCTS.filter(function(p){return [p.productId,p.productName,p.category].some(function(x){return String(x||'').toLowerCase().includes(s)})})}
  function render(){
    var host=q('pmList');if(!host)return;var list=filtered();q('pmCount').textContent=list.length+' / '+PRODUCTS.length+' products';
    host.innerHTML=list.length?list.map(function(p){
      var b2c=p.b2cStatus==='LIVE',b2b=p.b2bStatus==='LIVE';
      return '<div class="pmItem"><div class="pmThumb">'+productImage(p)+'</div><div><div class="pmName">'+esc(p.productName)+'</div><div class="pmCode">'+esc(p.productId)+' · '+esc(p.category)+' · '+esc(p.unit||'pc')+'</div><div class="pmMeta">B2C ₹'+Number(p.b2cPrice||0)+' · MOQ '+Number(p.b2cMoq||1)+' &nbsp;|&nbsp; B2B ₹'+Number(p.b2bPrice||0)+' · MOQ '+Number(p.b2bMoq||1)+' · Sort '+Number(p.sortOrder||0)+'</div><div class="pmStatus"><span class="badge '+(b2c?'pmLive':'pmOff')+'">B2C '+(b2c?'LIVE':'NOT LIVE')+'</span><span class="badge '+(b2b?'pmLive':'pmOff')+'">B2B '+(b2b?'LIVE':'NOT LIVE')+'</span></div></div><div class="pmSide"><button type="button" onclick="editProductAdminV928(\''+esc(p.productId)+'\')">Edit</button><button class="secondary" type="button" onclick="toggleProductAdminV928(\''+esc(p.productId)+'\',\'B2C\',\''+(b2c?'NOT LIVE':'LIVE')+'\')">B2C '+(b2c?'Off':'Live')+'</button><button class="secondary" type="button" onclick="toggleProductAdminV928(\''+esc(p.productId)+'\',\'B2B\',\''+(b2b?'NOT LIVE':'LIVE')+'\')">B2B '+(b2b?'Off':'Live')+'</button></div></div>';
    }).join(''):'<div class="muted" style="padding:16px">No products match your search.</div>';
  }
  window.loadProductsAdminV928=async function(){
    var a=admin();if(!a.email||!a.pin)return msg('Admin session is required.',false);msg('Loading product master…',true);
    try{var d=await callGet(a);PRODUCTS=d&&Array.isArray(d.products)?d.products:[];LOADED=true;render();msg('Product master ready · '+PRODUCTS.length+' products.',true)}catch(e){LOADED=false;msg(e.message,false)}
  };
  window.editProductAdminV928=function(id){
    var p=PRODUCTS.find(function(x){return x.productId===id});if(!p)return;EDITING=id;
    var map={pmId:p.productId,pmName:p.productName,pmCategory:p.category,pmUnit:p.unit,pmB2cPrice:p.b2cPrice,pmB2bPrice:p.b2bPrice,pmB2cMoq:p.b2cMoq,pmB2bMoq:p.b2bMoq,pmStep:p.qtyStep,pmBq1:p.bundleQty1,pmBp1:p.bundlePrice1,pmBq2:p.bundleQty2,pmBp2:p.bundlePrice2,pmSort:p.sortOrder,pmImage:p.imageUrl,pmDescription:p.description};Object.keys(map).forEach(function(k){if(q(k))q(k).value=map[k]==null?'':map[k]});
    q('pmBarcode').checked=p.barcodeRequired==='YES';q('pmB2cLive').checked=p.b2cStatus==='LIVE';q('pmB2bLive').checked=p.b2bStatus==='LIVE';q('pmId').disabled=true;preview(p.imageUrl);q('pmFormTitle').textContent='Edit '+p.productName;msg('Editing '+p.productId+'.',true);q('pmForm').scrollIntoView({behavior:'smooth',block:'start'});
  };
  window.toggleProductAdminV928=async function(id,ch,status){
    if(id==='TC'&&status!=='LIVE')return msg('Tender Coconut must remain LIVE in B2C and B2B.',false);var a=admin();
    try{await callStatus(a,id,ch,status);msg(id+' '+ch+' changed to '+status+'.',true);await window.loadProductsAdminV928()}catch(e){msg(e.message,false)}
  };
  function readFile(file){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(String(r.result||''))};r.onerror=function(){reject(new Error('Unable to read image file.'))};r.readAsDataURL(file)})}
  window.saveProductAdminV928=async function(){
    var a=admin(),p=payload(),btn=q('pmSave');if(!p.productId||!p.productName||!p.category)return msg('Product ID, Product Name and Category are required.',false);btn.disabled=true;btn.textContent='Saving…';
    try{
      var file=q('pmFile')&&q('pmFile').files&&q('pmFile').files[0];
      if(file){if(file.size>3*1024*1024)throw new Error('Image must be 3 MB or smaller.');msg('Uploading product image…',true);var data=await readFile(file);var up=await callUpload(a,{productId:p.productId,fileName:file.name,mimeType:file.type,base64:data});if(!up||!up.url)throw new Error('Image upload did not return a public URL.');p.imageUrl=up.url;q('pmImage').value=up.url;preview(up.url)}
      var r=await callSave(a,p);if(!r||r.success===false)throw new Error(r&&r.error||'Product could not be saved.');msg((r.created?'Product created: ':'Product updated: ')+(r.product&&r.product.productName||p.productName),true);await window.loadProductsAdminV928();window.editProductAdminV928(p.productId);
    }catch(e){msg(e.message,false)}finally{btn.disabled=false;btn.textContent='Save Product'}
  };
  window.resetProductAdminV928=resetForm;
  window.previewProductImageV928=function(){preview(val('pmImage'))};
  window.productAdminSearchV928=render;
  window.openAdminProductsV928=function(){
    OLD.concat(['adminProductsPanel']).forEach(function(id){var x=q(id);if(x)x.classList.add('hidden')});var dash=q('dash'),tabs=dash&&dash.querySelector('.tabs');if(!tabs)return;tabs.querySelectorAll('button').forEach(function(b){b.classList.remove('active')});var t=q('tAdminProducts'),p=q('adminProductsPanel');if(t)t.classList.add('active');if(p)p.classList.remove('hidden');if(!LOADED)window.loadProductsAdminV928();
  };
  function install(){
    var dash=q('dash'),tabs=dash&&dash.querySelector('.tabs');if(!dash||!tabs||q('tAdminProducts'))return;
    var btn=document.createElement('button');btn.id='tAdminProducts';btn.type='button';btn.textContent='Products';btn.onclick=window.openAdminProductsV928;tabs.insertBefore(btn,tabs.firstChild);
    var panel=document.createElement('div');panel.id='adminProductsPanel';panel.className='card hidden';panel.innerHTML='<div id="adminProductsV928"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Product Management</h3><div class="muted">One master for B2C + B2B. Add 10, 100 or more products without changing app code.</div></div><button class="secondary" type="button" onclick="loadProductsAdminV928()">Refresh</button></div><div class="pmNote"><b>Images:</b> upload an image here or paste a public image URL. The saved URL goes to the Products sheet and the customer/vendor apps read it dynamically. If an image fails, the apps show a neutral fallback instead of blocking the app.</div><div class="pmLayout"><div id="pmForm" class="pmForm"><div class="row" style="justify-content:space-between"><h4 id="pmFormTitle" style="margin:0">Add Product</h4><button class="secondary" type="button" onclick="resetProductAdminV928()">+ New</button></div><div class="pmGrid" style="margin-top:10px"><div><div class="pmLabel">Product ID *</div><input id="pmId" maxlength="30" placeholder="e.g. TC, APPLE-1"></div><div><div class="pmLabel">Product Name *</div><input id="pmName" placeholder="Product name"></div><div><div class="pmLabel">Category *</div><input id="pmCategory" placeholder="Coconuts / Fruits"></div><div><div class="pmLabel">Unit</div><input id="pmUnit" value="pc" placeholder="pc / kg / pack"></div><div><div class="pmLabel">B2C Price</div><input id="pmB2cPrice" type="number" min="0" step="0.01"></div><div><div class="pmLabel">B2B Default Price</div><input id="pmB2bPrice" type="number" min="0" step="0.01"></div><div><div class="pmLabel">B2C MOQ</div><input id="pmB2cMoq" type="number" min="1" value="1"></div><div><div class="pmLabel">B2B MOQ</div><input id="pmB2bMoq" type="number" min="1" value="1"></div><div><div class="pmLabel">Quantity Step</div><input id="pmStep" type="number" min="1" value="1"></div><div><div class="pmLabel">Sort Order</div><input id="pmSort" type="number" min="0"></div><div><div class="pmLabel">Bundle Qty 1</div><input id="pmBq1" type="number" min="0"></div><div><div class="pmLabel">Bundle Price 1</div><input id="pmBp1" type="number" min="0" step="0.01"></div><div><div class="pmLabel">Bundle Qty 2</div><input id="pmBq2" type="number" min="0"></div><div><div class="pmLabel">Bundle Price 2</div><input id="pmBp2" type="number" min="0" step="0.01"></div><div class="full"><div class="pmLabel">Image URL</div><input id="pmImage" placeholder="https://..." oninput="previewProductImageV928()"></div><div class="full"><div class="pmLabel">Or upload image (PNG/JPG/WEBP/GIF · max 3 MB)</div><input id="pmFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div><div class="full"><div id="pmPreview" class="pmPreview">No product image selected</div></div><div class="full"><div class="pmLabel">Description</div><textarea id="pmDescription" rows="3" placeholder="Short product description"></textarea></div><div class="full row"><label><input id="pmBarcode" type="checkbox" checked style="width:auto"> Barcode required</label><label><input id="pmB2cLive" type="checkbox" checked style="width:auto"> B2C LIVE</label><label><input id="pmB2bLive" type="checkbox" checked style="width:auto"> B2B LIVE</label></div></div><div class="pmActions"><button id="pmSave" type="button" onclick="saveProductAdminV928()">Save Product</button><button class="secondary" type="button" onclick="resetProductAdminV928()">Clear</button></div><div id="pmMsg" class="muted" style="margin-top:8px"></div></div><div><div class="pmToolbar"><input id="pmSearch" placeholder="Search product ID, name or category" oninput="productAdminSearchV928()" style="flex:1;min-width:220px"><span id="pmCount" class="muted"></span></div><div id="pmList" class="pmList"><div class="muted">Open Products to load the master.</div></div></div></div></div>';
    tabs.insertAdjacentElement('afterend',panel);tabs.querySelectorAll('button:not(#tAdminProducts)').forEach(function(b){b.addEventListener('click',function(){panel.classList.add('hidden');btn.classList.remove('active')})});resetForm();
  }
  /* Apps Script can append this template after DOMContentLoaded. */
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});
  setTimeout(install,0);
})();
</script>
