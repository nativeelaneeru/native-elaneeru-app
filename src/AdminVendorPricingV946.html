<style>
#vendorPricingPanel .vpGrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px}.vpFull{grid-column:1/-1}.vpTable{overflow:auto;margin-top:12px}.vpTable table{min-width:850px}.vpLive{color:#08653a;font-weight:900}.vpOff{color:#9b3428;font-weight:900}@media(max-width:760px){#vendorPricingPanel .vpGrid{grid-template-columns:1fr 1fr}}
</style><script>
(function(){
let DATA={vendors:[],products:[],pricing:[]},EDIT='';const q=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function auth(){return {email:(typeof E!=='undefined'?E:''),pin:(typeof P!=='undefined'?P:'')}}function num(id){return Number(q(id)&&q(id).value||0)}
function call(fn,args){return new Promise((ok,no)=>{const r=google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e&&e.message?e.message:String(e))));r[fn].apply(r,args)})}
function message(t,bad){const x=q('vpMsg');if(x){x.textContent=t||'';x.style.color=bad?'#9b3428':'#08653a'}}
function options(){q('vpVendor').innerHTML='<option value="">Select vendor</option>'+DATA.vendors.map(v=>'<option value="'+esc(v.vendorId)+'">'+esc(v.businessName||v.ownerName)+' · '+esc(v.mobile)+'</option>').join('');q('vpProduct').innerHTML='<option value="">Select product</option>'+DATA.products.map(p=>'<option value="'+esc(p.productId)+'">'+esc(p.productName)+' · Default ₹'+Number(p.defaultPrice||0)+'</option>').join('')}
function render(){const f=String(q('vpSearch').value||'').toLowerCase(),rows=DATA.pricing.filter(x=>!f||[x.businessName,x.productName,x.vendorId,x.productId].join(' ').toLowerCase().includes(f));q('vpRows').innerHTML=rows.map(x=>'<tr><td>'+esc(x.businessName)+'</td><td>'+esc(x.productName)+'</td><td>₹'+Number(x.defaultPrice||0)+'</td><td><b>₹'+Number(x.effectivePrice||0)+'</b></td><td>'+Number(x.moq||1)+'</td><td>'+Number(x.qtyStep||1)+'</td><td class="'+(x.status==='ACTIVE'?'vpLive':'vpOff')+'">'+esc(x.status)+'</td><td><button class="secondary" onclick="editVendorPriceV946(\''+esc(x.pricingId)+'\')">Edit</button></td></tr>').join('')||'<tr><td colspan="8" class="muted">No vendor-specific prices found. B2B default prices apply.</td></tr>'}
window.loadVendorPricingV946=async function(){message('Loading…');try{DATA=await call('getVendorPricingAdminV946',[auth().email,auth().pin]);DATA.vendors=Array.isArray(DATA.vendors)?DATA.vendors:[];DATA.products=Array.isArray(DATA.products)?DATA.products:[];DATA.pricing=Array.isArray(DATA.pricing)?DATA.pricing:[];options();render();message('Loaded '+DATA.pricing.length+' vendor prices.')}catch(e){message(e.message,true)}};
window.editVendorPriceV946=function(id){const x=DATA.pricing.find(z=>z.pricingId===id);if(!x)return;EDIT=id;q('vpVendor').value=x.vendorId;q('vpProduct').value=x.productId;q('vpPrice').value=x.agreedPrice;q('vpMoq').value=x.moq;q('vpStep').value=x.qtyStep;q('vpStatus').value=x.status;message('Editing '+x.businessName+' · '+x.productName)};
window.saveVendorPricingV946=async function(){const p={pricingId:EDIT,vendorId:q('vpVendor').value,productId:q('vpProduct').value,agreedPrice:num('vpPrice'),moq:num('vpMoq'),qtyStep:num('vpStep'),validFrom:q('vpFrom').value,validTo:q('vpTo').value,status:q('vpStatus').value},b=q('vpSave');b.disabled=true;try{await call('saveVendorPricingAdminV946',[auth().email,auth().pin,p]);EDIT='';await loadVendorPricingV946();message('Vendor price saved. Refresh the Business app to see it.')}catch(e){message(e.message,true)}finally{b.disabled=false}};
window.openVendorPricingV946=function(){['orders','customers','feedback','tickets','delivery','routeplan','adminProductsPanel','adminAccessPanel','adminDeliveryAccessPanel','adminBarcodePanel'].forEach(id=>{const x=q(id);if(x)x.classList.add('hidden')});q('vendorPricingPanel').classList.remove('hidden');document.querySelectorAll('#dash .tabs button').forEach(x=>x.classList.remove('active'));q('tVendorPricing').classList.add('active');loadVendorPricingV946()};
function install(){const tabs=q('dash')&&q('dash').querySelector('.tabs');if(!tabs||q('tVendorPricing'))return;const b=document.createElement('button');b.id='tVendorPricing';b.textContent='Vendor Prices';b.onclick=openVendorPricingV946;tabs.appendChild(b);const p=document.createElement('div');p.id='vendorPricingPanel';p.className='card hidden';p.innerHTML='<div class="row" style="justify-content:space-between"><div><h3 style="margin:0">Vendor-level Pricing</h3><div class="muted">Agreed price overrides B2B Default Price for the selected partner and product.</div></div><button class="secondary" onclick="loadVendorPricingV946()">Refresh</button></div><div class="vpGrid" style="margin-top:12px"><select id="vpVendor"></select><select id="vpProduct"></select><input id="vpPrice" type="number" min="0.01" step="0.01" placeholder="Agreed price"><input id="vpMoq" type="number" min="1" placeholder="MOQ"><input id="vpStep" type="number" min="1" value="1" placeholder="Qty step"><input id="vpFrom" type="date"><input id="vpTo" type="date"><select id="vpStatus"><option>ACTIVE</option><option>INACTIVE</option></select><button id="vpSave" onclick="saveVendorPricingV946()">Save Vendor Price</button><span id="vpMsg" class="muted"></span><input id="vpSearch" class="vpFull" placeholder="Search vendor or product" oninput="renderVendorPricesV946()"></div><div class="vpTable"><table><thead><tr><th>Vendor</th><th>Product</th><th>Default B2B</th><th>Effective Price</th><th>MOQ</th><th>Step</th><th>Status</th><th></th></tr></thead><tbody id="vpRows"></tbody></table></div>';tabs.insertAdjacentElement('afterend',p);window.renderVendorPricesV946=render}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();setTimeout(install,0);
})();
</script>
