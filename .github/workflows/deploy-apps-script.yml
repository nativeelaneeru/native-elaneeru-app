name: Deploy Native Elaneeru to Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON
      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push files to Apps Script
        run: npx clasp push -f
      - name: Update main web app deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: npx clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub auto deploy $GITHUB_SHA"
      - name: Update B2C customer web app deployment
        shell: bash
        env:
          B2C_DEPLOYMENT_ID: AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3
        run: npx clasp deploy -i "$B2C_DEPLOYMENT_ID" -d "B2C order engine fix $GITHUB_SHA"
      - name: Verify main catalogue and B2B bridge
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async()=>{
            async function post(method,args){const form=new URLSearchParams();form.set('payload',JSON.stringify({method,args,requestId:'smoke-'+Date.now()}));const r=await fetch(process.env.API_URL+'?bridge=1',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString(),redirect:'follow'});return {status:r.status,text:await r.text()}}
            const callback='__nelSmokeCatalog';const req={method:'getAppConfig',args:[],requestId:'catalog-'+Date.now()};const url=process.env.API_URL+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
            const r=await fetch(url,{redirect:'follow',cache:'no-store'});const text=await r.text();const m=text.match(/^__nelSmokeCatalog\(([\s\S]*)\);?$/);const p=m?JSON.parse(m[1]):null;const products=p&&p.ok&&p.result&&Array.isArray(p.result.products)?p.result.products.length:0;if(r.status!==200||products<1)throw new Error('Main catalogue failed.');
            const data=await post('getB2BAppDataV9',['__invalid_smoke_token__']);const login=await post('vendorLogin',['0000000000','__bad_pin__']);if(!/Session has expired/i.test(data.text)||!/Invalid mobile or PIN/i.test(login.text))throw new Error('B2B bridge failed.');
            console.log(JSON.stringify({products,b2bData:true,b2bLogin:true}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify B2C canonical order engine
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3/exec
        run: |
          node <<'NODE'
          (async()=>{
            async function post(method,args){const form=new URLSearchParams();form.set('payload',JSON.stringify({method,args,requestId:'b2c-health-'+Date.now()}));const r=await fetch(process.env.API_URL+'?bridge=1',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString(),redirect:'follow'});return {status:r.status,text:await r.text()}}
            let last;
            for(let i=1;i<=6;i++){
              const h=await post('getB2COrderEngineHealthV901',[]);console.log(JSON.stringify({attempt:i,status:h.status,text:h.text.slice(0,220)}));
              if(h.status===200&&/canonicalOrderHandler/i.test(h.text)&&/recursiveWrappers[^a-z]*false/i.test(h.text))return;
              last=new Error('B2C canonical order engine is not live yet.');await new Promise(r=>setTimeout(r,2500));
            }
            throw last;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
