name: Deploy Native Elaneeru to Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON

      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push files to Apps Script
        run: npx clasp push -f

      - name: Update existing web app deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          npx clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub auto deploy $GITHUB_SHA"

      - name: Verify B2C catalogue endpoint
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async () => {
            const callback = '__nelSmokeCatalog';
            const request = {method: 'getAppConfig', args: [], requestId: 'smoke-' + Date.now()};
            const url = process.env.API_URL + '?jsonp=1&callback=' + callback + '&payload=' + encodeURIComponent(JSON.stringify(request));
            let lastError;
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const response = await fetch(url + '&_=' + Date.now(), {redirect: 'follow', cache: 'no-store'});
                const text = await response.text();
                const match = text.match(/^__nelSmokeCatalog\(([\s\S]*)\);?$/);
                const payload = match ? JSON.parse(match[1]) : null;
                const products = payload && payload.ok && payload.result && Array.isArray(payload.result.products) ? payload.result.products.length : 0;
                console.log(JSON.stringify({attempt, status: response.status, ok: !!(payload && payload.ok), products, error: payload && payload.error}));
                if (response.status === 200 && products > 0) return;
                lastError = new Error('Catalogue endpoint did not return live products.');
              } catch (error) {
                lastError = error;
                console.error('Attempt ' + attempt + ': ' + error.message);
              }
              await new Promise(resolve => setTimeout(resolve, 2500));
            }
            throw lastError || new Error('B2C catalogue verification failed.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Verify B2B bridge compatibility
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async () => {
            async function call(method,args){
              const form=new URLSearchParams();
              form.set('payload',JSON.stringify({method,args,requestId:'bridge-smoke-'+Date.now()}));
              const response=await fetch(process.env.API_URL+'?bridge=1',{
                method:'POST',
                headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},
                body:form.toString(),
                redirect:'follow'
              });
              return {status:response.status,text:await response.text()};
            }
            let lastError;
            for(let attempt=1;attempt<=5;attempt++){
              try{
                const compliance=await call('getCompliancePublicV91',[]);
                const authProbe=await call('getB2BAppDataV9',['__invalid_smoke_token__']);
                const complianceOk=compliance.status===200 && /\"ok\"\s*:\s*true/.test(compliance.text);
                const bridgeExposed=authProbe.status===200 && /Session has expired/i.test(authProbe.text) && !/Method not allowed/i.test(authProbe.text);
                console.log(JSON.stringify({attempt,complianceOk,bridgeExposed,complianceStatus:compliance.status,authStatus:authProbe.status}));
                if(complianceOk&&bridgeExposed)return;
                lastError=new Error('B2B bridge is not exposing the expected authenticated methods.');
              }catch(error){
                lastError=error;
                console.error('Attempt '+attempt+': '+error.message);
              }
              await new Promise(resolve=>setTimeout(resolve,2500));
            }
            throw lastError || new Error('B2B bridge verification failed.');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
