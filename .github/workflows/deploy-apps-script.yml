name: Deploy Native Elaneeru to Apps Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON

      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push files to Apps Script
        run: npx clasp push -f

      - name: Update existing web app deployment
        if: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID != '' }}
        shell: bash
        run: |
          npx clasp deploy -i "${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}" -d "GitHub auto deploy $GITHUB_SHA"

      - name: Create first deployment if deployment id is not set
        if: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID == '' }}
        run: npx clasp deploy -d "GitHub first deployment $GITHUB_SHA"
