name: Deploy Native Elaneeru to Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Validate Apps Script feature wiring
        run: |
          node <<'NODE'
          const fs=require('fs');
          const htmlFiles=['src/VendorOnboardingV910.html','src/VendorApproval.html','src/CumulativeDashboard.html','src/SharedUX.html'];
          for(const file of htmlFiles){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if(!scripts.length)throw new Error(file+' has no inline JavaScript to validate.');
            scripts.forEach((source,i)=>{new Function(source);console.log('✓ '+file+' inline script '+(i+1)+' parses')});
          }
          const onboarding=fs.readFileSync('src/VendorOnboardingV910.html','utf8');
          if(!/submitVendorOnboardingV840/.test(onboarding)||!/ownerPhotoData/.test(onboarding)||!/shopPhotoData/.test(onboarding))throw new Error('Vendor onboarding production wiring is incomplete.');
          const approval=fs.readFileSync('src/VendorApproval.html','utf8');
          if(!/approveVendorOnboardingV840/.test(approval)||!/Initial B2B PIN/.test(approval))throw new Error('Vendor approval/PIN wiring is incomplete.');
          const routes=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZZ_V912_FinalRoutes.gs','utf8');
          new Function(routes);
          if(!/'vendor':'VendorOnboardingV910'/.test(routes)||!/'approvals':'VendorApproval'/.test(routes)||!/'dashboard':'CumulativeDashboard'/.test(routes))throw new Error('Final production routes are incomplete.');
          const reward=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZ_V911_ReferralRewards.gs','utf8');
          new Function(reward);
          if(!/V911_REFERRER_FREE_QTY\s*=\s*2/.test(reward)||!/V911_REFERRED_FREE_QTY\s*=\s*0/.test(reward)||!/FIRST_DELIVERED_ORDER/.test(reward))throw new Error('Approved 2-free-coconut referral rule is not wired.');
          const payment=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZZZ_V913_DirectUpiPayments.gs','utf8');
          new Function(payment);
          if(!/Payment_Ledger/.test(payment)||!/prepareB2CUpiPaymentV913/.test(payment)||!/submitB2CUpiOrderV913/.test(payment)||!/autoMarkPaid:false/.test(payment))throw new Error('Direct UPI payment foundation is incomplete.');
          const cumulative=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZZZZ_V914_CumulativeDashboard.gs','utf8');
          new Function(cumulative);
          if(!/getCumulativeDashboardV914/.test(cumulative)||!/B2C_Subscriptions/.test(cumulative)||!/B2C_Referrals/.test(cumulative)||!/V8\.SHEETS\.PAYMENTS/.test(cumulative)||!/V8\.SHEETS\.B2B_ORDERS/.test(cumulative)||!/V8\.SHEETS\.VENDOR_ONBOARD/.test(cumulative))throw new Error('Cumulative dashboard does not cover the full operating model.');
          const cumulativeUi=fs.readFileSync('src/CumulativeDashboard.html','utf8');
          if(!/getCumulativeDashboardV914/.test(cumulativeUi)||!/Vendor Approvals/.test(cumulativeUi)||!/Live B2B App/.test(cumulativeUi))throw new Error('Cumulative dashboard UI is not wired to B2B/vendor operations.');
          const publicRead=fs.readFileSync('src/ZZZZZ_V838_PublicCatalog.gs','utf8');
          if(!/getB2CReferralRuleV911:getB2CReferralRuleV911/.test(publicRead))throw new Error('Referral rule is not exposed through the read-only health endpoint.');
          if(!/getB2CPaymentEngineHealthV913:getB2CPaymentEngineHealthV913/.test(publicRead))throw new Error('Payment engine health is not exposed through the read-only health endpoint.');
          if(!/getCumulativeDashboardHealthV914:getCumulativeDashboardHealthV914/.test(publicRead))throw new Error('Cumulative dashboard health is not exposed through the read-only health endpoint.');
          console.log('Apps Script feature validation passed.');
          NODE

      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON

      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Push files to Apps Script
        run: npx clasp push -f

      - name: Update main web app deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: npx clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub auto deploy $GITHUB_SHA"

      - name: Update B2C customer web app deployment
        shell: bash
        env:
          B2C_DEPLOYMENT_ID: AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3
        run: npx clasp deploy -i "$B2C_DEPLOYMENT_ID" -d "B2C Checkout Engine V2 $GITHUB_SHA"

      - name: Verify live Apps Script production safely
        env:
          MAIN_API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
          B2C_API_URL: https://script.google.com/macros/s/AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3/exec
        run: |
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function fetchWithTimeout(url,options={},timeoutMs=30000){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),timeoutMs);
            try{return await fetch(url,{...options,signal:controller.signal,redirect:'follow',cache:'no-store'})}
            finally{clearTimeout(timer)}
          }
          async function retry(label,fn,attempts=5){
            let last;
            for(let i=1;i<=attempts;i++){
              const started=Date.now();
              try{
                const value=await fn(i);
                console.log('✓ '+label+' attempt '+i+' ('+(Date.now()-started)+'ms)');
                return value;
              }catch(e){
                last=e;console.error(label+' attempt '+i+' failed: '+e.message);
                if(i<attempts)await sleep(1500*i);
              }
            }
            throw last||new Error(label+' failed.');
          }
          async function jsonp(base,method){
            return retry(method,async i=>{
              const callback='__nelVerify';
              const req={method,args:[],requestId:'verify-'+method+'-'+i+'-'+Date.now()};
              const url=base+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
              const r=await fetchWithTimeout(url,{},30000);
              const text=await r.text();
              const m=text.match(/^__nelVerify\(([\s\S]*)\);?$/);
              const payload=m?JSON.parse(m[1]):null;
              if(r.status!==200||!payload||payload.ok!==true)throw new Error('HTTP '+r.status+' / '+(payload&&payload.error||'invalid JSONP'));
              return payload.result;
            });
          }
          async function post(base,method,args){
            return retry(method,async()=>{
              const form=new URLSearchParams();
              form.set('payload',JSON.stringify({method,args,requestId:'verify-'+method+'-'+Date.now()}));
              const r=await fetchWithTimeout(base+'?bridge=1',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString()},30000);
              const text=await r.text();
              if(r.status!==200)throw new Error('HTTP '+r.status);
              return text;
            });
          }
          async function page(name){
            return retry('route '+name,async()=>{
              const r=await fetchWithTimeout(process.env.MAIN_API_URL+'?page='+encodeURIComponent(name)+'&_='+Date.now(),{},30000);
              const type=String(r.headers.get('content-type')||'');
              await r.text();
              if(r.status!==200||!/text\/html/i.test(type))throw new Error('HTTP '+r.status+' / '+type);
              return true;
            });
          }
          (async()=>{
            await page('dashboard');
            await page('vendor');
            await page('approvals');

            const growth=await post(process.env.MAIN_API_URL,'getB2CCustomerGrowthV910',['123']);
            if(!/valid 10 digit mobile/i.test(growth))throw new Error('B2C growth bridge is not reachable.');
            const sub=await post(process.env.MAIN_API_URL,'saveB2CSubscriptionV910',['123',{}]);
            if(!/valid 10 digit mobile/i.test(sub))throw new Error('B2C subscription bridge is not reachable.');

            const rule=await jsonp(process.env.MAIN_API_URL,'getB2CReferralRuleV911');
            if(!rule||rule.rewardType!=='FREE_PRODUCT'||rule.rewardProductId!=='TC'||rule.referrerRewardQty!==2||rule.referredRewardQty!==0||rule.qualificationRule!=='FIRST_DELIVERED_ORDER'||rule.redemptionEnabled!==false)throw new Error('2-free-coconut referral rule does not match the approved production rule.');
            console.log('✓ Refer & Earn: referrer gets 2 free Tender Coconuts after first delivered order; referred reward is 0');

            const paymentHealth=await jsonp(process.env.MAIN_API_URL,'getB2CPaymentEngineHealthV913');
            if(!paymentHealth||paymentHealth.ok!==true||paymentHealth.engineVersion!=='9.1.3'||paymentHealth.codPreserved!==true||paymentHealth.directUpiSupported!==true||paymentHealth.serverCalculatedAmount!==true||paymentHealth.paymentIntentBeforeOrder!==true||paymentHealth.manualVerificationRequired!==true||paymentHealth.autoMarkPaid!==false||paymentHealth.storageSheet!=='Payment_Ledger'||paymentHealth.separatePaymentDatabase!==false)throw new Error('Direct UPI payment engine does not match the production safety contract.');
            console.log('✓ B2C payment foundation: COD preserved; direct UPI uses server amount + Payment_Ledger + manual verification');

            const dashboardHealth=await jsonp(process.env.MAIN_API_URL,'getCumulativeDashboardHealthV914');
            if(!dashboardHealth||dashboardHealth.ok!==true||dashboardHealth.version!=='9.1.4'||dashboardHealth.readOnly!==true||dashboardHealth.singleWorkbook!==true||!Array.isArray(dashboardHealth.includes)||!dashboardHealth.includes.includes('B2B')||!dashboardHealth.includes.includes('VENDOR_ONBOARDING'))throw new Error('Cumulative dashboard health contract failed.');
            console.log('✓ Cumulative dashboard: read-only, single-workbook B2C+B2B+growth+payments+onboarding summary');

            const catalogue=await jsonp(process.env.MAIN_API_URL,'getAppConfig');
            const products=catalogue&&Array.isArray(catalogue.products)?catalogue.products:[];
            if(products.length<1)throw new Error('Main catalogue has no products.');
            if(!products.some(p=>String(p.productId||p.id||'').toUpperCase()==='TC'||/Tender Coconut/i.test(String(p.productName||p.name||''))))throw new Error('Tender Coconut is missing from main catalogue.');

            const data=await post(process.env.MAIN_API_URL,'getB2BAppDataV9',['__invalid_smoke_token__']);
            const login=await post(process.env.MAIN_API_URL,'vendorLogin',['0000000000','__bad_pin__']);
            if(!/Session has expired/i.test(data)||!/Invalid mobile or PIN/i.test(login))throw new Error('B2B bridge safety checks failed.');

            const b2cHealth=await jsonp(process.env.B2C_API_URL,'getB2COrderEngineHealthV906');
            if(!b2cHealth||b2cHealth.ok!==true||b2cHealth.engineVersion!=='9.0.5'||b2cHealth.canonicalOrderHandler!==true||b2cHealth.idempotency!==true||b2cHealth.serverControlledPayment!==true)throw new Error('B2C Checkout Engine V2 is not healthy.');

            const b2bHealth=await jsonp(process.env.MAIN_API_URL,'getB2BOrderEngineHealthV904');
            if(!b2bHealth||b2bHealth.canonicalOrderHandler!==true||b2bHealth.idempotency!==true||b2bHealth.serverControlledDeliveryCharge!==true)throw new Error('B2B canonical order engine is not healthy.');

            console.log('Live Apps Script verification passed. No production order, UPI intent, or valid customer/vendor record was created.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
