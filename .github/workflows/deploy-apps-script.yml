name: Deploy Native Elaneeru to Apps Script

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/deploy-apps-script.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Validate Apps Script feature wiring
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['src/VendorOnboardingV910.html','src/VendorApproval.html','src/SharedUX.html'];
          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if(!scripts.length)throw new Error(file+' has no inline JavaScript to validate.');
            scripts.forEach((source,i)=>{new Function(source);console.log('✓ '+file+' inline script '+(i+1)+' parses')});
          }
          const onboarding=fs.readFileSync('src/VendorOnboardingV910.html','utf8');
          if(!/submitVendorOnboardingV840/.test(onboarding)||!/ownerPhotoData/.test(onboarding)||!/shopPhotoData/.test(onboarding))throw new Error('Vendor onboarding production wiring is incomplete.');
          const approval=fs.readFileSync('src/VendorApproval.html','utf8');
          if(!/approveVendorOnboardingV840/.test(approval)||!/Initial B2B PIN/.test(approval))throw new Error('Vendor approval/PIN wiring is incomplete.');
          const routes=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZZ_V912_FinalRoutes.gs','utf8');
          new Function(routes);
          if(!/'vendor':'VendorOnboardingV910'/.test(routes)||!/'approvals':'VendorApproval'/.test(routes))throw new Error('Final vendor routes are not wired to the current onboarding/approval screens.');
          const reward=fs.readFileSync('src/ZZZZZZZZZZZZZZZZZZZZZZ_V911_ReferralRewards.gs','utf8');
          new Function(reward);
          if(!/V911_REFERRER_FREE_QTY\s*=\s*2/.test(reward)||!/V911_REFERRED_FREE_QTY\s*=\s*0/.test(reward)||!/FIRST_DELIVERED_ORDER/.test(reward))throw new Error('Approved 2-free-coconut referral rule is not wired.');
          console.log('Apps Script feature validation passed.');
          NODE
      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON
      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - name: Push files to Apps Script
        run: npx clasp push -f
      - name: Update main web app deployment
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: npx clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub auto deploy $GITHUB_SHA"
      - name: Update B2C customer web app deployment
        shell: bash
        env:
          B2C_DEPLOYMENT_ID: AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3
        run: npx clasp deploy -i "$B2C_DEPLOYMENT_ID" -d "B2C Checkout Engine V2 $GITHUB_SHA"
      - name: Verify onboarding, approvals and B2C growth bridge
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async()=>{
            async function page(name){
              let last;
              for(let attempt=1;attempt<=4;attempt++){
                const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),30000);
                try{
                  const r=await fetch(process.env.API_URL+'?page='+encodeURIComponent(name)+'&_='+Date.now(),{redirect:'follow',cache:'no-store',signal:controller.signal});
                  const type=String(r.headers.get('content-type')||'');
                  await r.text();
                  if(r.status===200&&/text\/html/i.test(type)){console.log('✓ '+name+' route is reachable (HTTP 200 HTML)');return}
                  last=new Error(name+' route returned HTTP '+r.status+' with content-type '+type);
                }catch(e){last=e}finally{clearTimeout(timeout)}
                if(attempt<4)await new Promise(r=>setTimeout(r,1500*attempt));
              }
              throw last||new Error(name+' route did not respond.');
            }
            async function post(method,args){
              const form=new URLSearchParams();form.set('payload',JSON.stringify({method,args,requestId:'feature-smoke-'+Date.now()}));
              const r=await fetch(process.env.API_URL+'?bridge=1',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString(),redirect:'follow'});
              return {status:r.status,text:await r.text()};
            }
            await page('vendor');
            await page('approvals');
            const growth=await post('getB2CCustomerGrowthV910',['123']);
            if(growth.status!==200||!/valid 10 digit mobile/i.test(growth.text))throw new Error('B2C growth bridge is not reachable.');
            const subscription=await post('saveB2CSubscriptionV910',['123',{}]);
            if(subscription.status!==200||!/valid 10 digit mobile/i.test(subscription.text))throw new Error('B2C subscription bridge is not reachable.');
            const rule=await post('getB2CReferralRuleV911',[]);
            if(rule.status!==200||!/"rewardType":"FREE_PRODUCT"/.test(rule.text)||!/"rewardProductId":"TC"/.test(rule.text)||!/"referrerRewardQty":2/.test(rule.text)||!/"referredRewardQty":0/.test(rule.text)||!/"qualificationRule":"FIRST_DELIVERED_ORDER"/.test(rule.text))throw new Error('2-free-coconut referral rule is not live.');
            console.log('✓ Vendor routes, subscriptions and 2-free-coconut Refer & Earn rule are live without writing test data');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify main catalogue and B2B bridge
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async()=>{
            async function post(method,args){const form=new URLSearchParams();form.set('payload',JSON.stringify({method,args,requestId:'smoke-'+Date.now()}));const r=await fetch(process.env.API_URL+'?bridge=1',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded;charset=UTF-8'},body:form.toString(),redirect:'follow'});return {status:r.status,text:await r.text()}}
            const callback='__nelSmokeCatalog';const req={method:'getAppConfig',args:[],requestId:'catalog-'+Date.now()};const url=process.env.API_URL+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
            const r=await fetch(url,{redirect:'follow',cache:'no-store'});const text=await r.text();const m=text.match(/^__nelSmokeCatalog\(([\s\S]*)\);?$/);const p=m?JSON.parse(m[1]):null;const products=p&&p.ok&&p.result&&Array.isArray(p.result.products)?p.result.products.length:0;if(r.status!==200||products<1)throw new Error('Main catalogue failed.');
            const data=await post('getB2BAppDataV9',['__invalid_smoke_token__']);const login=await post('vendorLogin',['0000000000','__bad_pin__']);if(!/Session has expired/i.test(data.text)||!/Invalid mobile or PIN/i.test(login.text))throw new Error('B2B bridge failed.');
            console.log(JSON.stringify({products,b2bData:true,b2bLogin:true}));
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify B2C fast Checkout Engine V2
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3/exec
        run: |
          node <<'NODE'
          (async()=>{
            const callback='__nelOrderHealthV2';
            let last;
            for(let i=1;i<=6;i++){
              const req={method:'getB2COrderEngineHealthV906',args:[],requestId:'b2c-v2-health-'+Date.now()};
              const url=process.env.API_URL+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
              const r=await fetch(url,{redirect:'follow',cache:'no-store'});const text=await r.text();const m=text.match(/^__nelOrderHealthV2\(([\s\S]*)\);?$/);const p=m?JSON.parse(m[1]):null;
              console.log(JSON.stringify({attempt:i,status:r.status,payload:p}));
              const h=p&&p.ok&&p.result;
              if(r.status===200&&h&&h.ok===true&&h.engineVersion==='9.0.5'&&h.canonicalOrderHandler===true&&h.singleSpreadsheetOpen===true&&h.targetedCustomerLookup===true&&h.shortWriteLock===true&&h.batchItemWrite===true&&h.cachedProducts===true&&h.noFullCustomerRowsScan===true&&h.idempotency===true&&h.serverControlledPayment===true)return;
              last=new Error('B2C Checkout Engine V2 is not live yet.');await new Promise(r=>setTimeout(r,2500));
            }
            throw last;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify B2B canonical idempotent order engine
        env:
          API_URL: https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec
        run: |
          node <<'NODE'
          (async()=>{
            const callback='__nelB2BHealth';
            let last;
            for(let i=1;i<=6;i++){
              const req={method:'getB2BOrderEngineHealthV904',args:[],requestId:'b2b-health-'+Date.now()};
              const url=process.env.API_URL+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
              const r=await fetch(url,{redirect:'follow',cache:'no-store'});const text=await r.text();const m=text.match(/^__nelB2BHealth\(([\s\S]*)\);?$/);const p=m?JSON.parse(m[1]):null;
              console.log(JSON.stringify({attempt:i,status:r.status,payload:p}));
              if(r.status===200&&p&&p.ok&&p.result&&p.result.canonicalOrderHandler===true&&p.result.idempotency===true&&p.result.serverControlledDeliveryCharge===true)return;
              last=new Error('B2B idempotent order engine is not live yet.');await new Promise(r=>setTimeout(r,2500));
            }
            throw last;
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
