name: Validate B2B V916

on:
  pull_request:
    branches: [main]
    paths:
      - 'b2b/**'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/validate-b2b-v916-pr.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate PWAs
        run: node scripts/smoke-check.mjs
      - name: Validate feature regressions
        run: node scripts/feature-regression.mjs
      - name: Parse changed Apps Script HTML
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['src/VendorApprovalFixV916.html','src/PaymentVerification.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if(!scripts.length)throw new Error(file+' has no inline JavaScript');
            scripts.forEach((s,i)=>{new Function(s);console.log('✓ '+file+' script '+(i+1)+' parses')});
          }
          for(const file of ['src/ZZZZZZZZZZZZZZZZZZZZZZZZZZ_V916_B2BPayments.gs','src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V916_PaymentAdmin.gs','src/ZZZZZZZZ_V840_VendorApproval.gs','src/ZZZZZZZZZZZZZZZZZZZZZZZ_V912_FinalRoutes.gs']){
            new Function(fs.readFileSync(file,'utf8'));
            console.log('✓ '+file+' parses');
          }
          NODE