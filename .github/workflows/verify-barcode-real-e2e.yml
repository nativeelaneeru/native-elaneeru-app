name: Verify Native Elaneeru Barcode Real E2E

on:
  push:
    branches: [ main, feat/barcode-real-e2e-v959 ]
    paths:
      - 'src/AdminBarcodeRealTestV960.html'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V959_BarcodeRealTest.gs'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V922_BarcodeConsole.gs'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZ_V912_FinalRoutes.gs'
      - 'scripts/barcode-real-e2e-regression.mjs'
      - '.github/workflows/verify-barcode-real-e2e.yml'
  pull_request:
    paths:
      - 'src/AdminBarcodeRealTestV960.html'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V959_BarcodeRealTest.gs'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V922_BarcodeConsole.gs'
      - 'src/ZZZZZZZZZZZZZZZZZZZZZZZ_V912_FinalRoutes.gs'
      - 'scripts/barcode-real-e2e-regression.mjs'
      - '.github/workflows/verify-barcode-real-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify real barcode end-to-end safety and wiring
        run: node scripts/barcode-real-e2e-regression.mjs
