name: Patch B2B demo free delivery

on:
  push:
    paths:
      - '.github/workflows/patch-b2b-demo-free-delivery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch demo behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('b2b-voice-demo/index.html')
          s = p.read_text()

          s = s.replace('<div><span>Delivery</span><strong>Included</strong></div>', '<div><span>Delivery</span><strong>FREE</strong></div>')

          old_checkout = "renderCheckout=function(){const box=document.getElementById('checkoutSummary');box.innerHTML=Object.entries(state.cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return '<div class=\"row-between\" style=\"font-size:10px;padding:5px 0\"><span>'+p.name+' × '+qty+'</span><strong>'+money(p.price*qty)+'</strong></div>'}).join('')+'<div class=\"row-between\" style=\"border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:13px\"><span>Total</span><strong>'+money(cartTotals())+'</strong></div>'};"
          new_checkout = "renderCheckout=function(){const box=document.getElementById('checkoutSummary');box.innerHTML=Object.entries(state.cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return '<div class=\"row-between\" style=\"font-size:10px;padding:5px 0\"><span>'+p.name+' × '+qty+'</span><strong>'+money(p.price*qty)+'</strong></div>'}).join('')+'<div class=\"row-between\" style=\"font-size:10px;padding:8px 0;border-top:1px solid var(--line);margin-top:6px\"><span>Delivery</span><strong>FREE</strong></div><div class=\"row-between\" style=\"border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:13px\"><span>Order total</span><strong>'+money(cartTotals())+'</strong></div>'};"
          if old_checkout in s:
              s = s.replace(old_checkout, new_checkout)

          old_order = "    document.getElementById('confirmDate').textContent=document.getElementById('deliveryDate').value||'Selected date';\n    go('confirmation');"
          new_order = "    document.getElementById('confirmDate').textContent=document.getElementById('deliveryDate').value||'Selected date';\n    // Demo order is treated as accepted. Clear cart only after success.\n    state.cart={};\n    updateCartBadge();\n    renderProducts();\n    renderCart();\n    go('confirmation');"
          if old_order in s:
              s = s.replace(old_order, new_order)

          s = s.replace("document.getElementById('trackEta').textContent=state.deliveryStep===3?'Delivered':'Today, 4:30 PM';", "document.getElementById('trackEta').textContent=state.deliveryStep===3?'Delivered':'Delivery update';")

          p.write_text(s)
          PY
      - name: Commit demo patch
        run: |
          if git diff --quiet -- b2b-voice-demo/index.html; then
            echo 'No demo changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add b2b-voice-demo/index.html
          git commit -m 'Show free delivery and clear cart after demo order'
          git push
