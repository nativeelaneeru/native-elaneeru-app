name: Run Approved Temporary Operations E2E

on:
  push:
    branches: [ test/approved-temp-ops-e2e ]
    paths:
      - '.github/workflows/test-approved-temp-ops-clasp-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TEMP_SLOT_ID: AKfycbyQt-ed9y0-yTr8lXB7wdLobHeUwWZruWWJo5piX2sukp0QzI8XZvoHFaC8TyWFZAjJ
      TEMP_SLOT_ORIGINAL_VERSION: '27'
      TEMP_SLOT_ORIGINAL_DESCRIPTION: Native Elaneeru V9 Preview 44e9ac38a41096dca27d651fa0c6e6599836d6da
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Validate temporary E2E scripts and inject one-run secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "V962_SECRET=$SECRET" >> "$GITHUB_ENV"
          node - "$SECRET" <<'NODE'
          const fs=require('fs');
          const secret=process.argv[2];
          const harness='src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V961_ApprovedTempOpsE2E.gs';
          const bridge='src/ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ_V962_TempE2EWebBridge.gs';
          new Function(fs.readFileSync(harness,'utf8'));
          let b=fs.readFileSync(bridge,'utf8');
          if(!b.includes('__V962_RUNTIME_SECRET__')) throw new Error('Temporary secret placeholder missing.');
          b=b.replace('__V962_RUNTIME_SECRET__',secret);
          fs.writeFileSync(bridge,b);
          new Function(b);
          console.log('Temporary E2E Apps Script and secret-gated bridge parse.');
          NODE

      - name: Configure clasp project
        shell: bash
        run: |
          cat > .clasp.json <<JSON
          {
            "scriptId": "${{ secrets.APPS_SCRIPT_ID }}",
            "rootDir": "src"
          }
          JSON

      - name: Configure Google auth
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Confirm selected slot is still the old Preview deployment
        shell: bash
        run: |
          set -euo pipefail
          npx clasp deployments | tee /tmp/deployments-before.txt
          LINE="$(grep "$TEMP_SLOT_ID" /tmp/deployments-before.txt || true)"
          echo "$LINE"
          echo "$LINE" | grep -q "@$TEMP_SLOT_ORIGINAL_VERSION"
          echo "$LINE" | grep -Fq "$TEMP_SLOT_ORIGINAL_DESCRIPTION"

      - name: Push temporary secret-gated E2E source to Apps Script HEAD
        run: npx clasp push -f

      - name: Temporarily repurpose old Preview slot for the secret-gated E2E
        shell: bash
        run: |
          set -euo pipefail
          npx clasp deploy -i "$TEMP_SLOT_ID" -d "TEMP APPROVED OPS E2E $GITHUB_SHA"
          echo "Temporary Preview slot deployed; production deployment IDs were not touched."

      - name: Verify secret-gated E2E health before any TEST writes
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$TEMP_SLOT_ID/exec?v962=1"
          : > /tmp/v962-health.json
          for attempt in 1 2 3 4 5 6; do
            echo "Temporary E2E health attempt $attempt"
            if curl -sS -L --max-time 90 \
              --data-urlencode "secret=$V962_SECRET" \
              --data-urlencode "action=health" \
              "$URL" > /tmp/v962-health.json; then
              if node - <<'NODE'
          const fs=require('fs');
          try{
            const p=JSON.parse(fs.readFileSync('/tmp/v962-health.json','utf8'));
            if(p&&p.ok===true&&p.result&&p.result.ok===true&&p.result.payments===false&&p.result.cashback===false&&p.result.subscriptions===false) process.exit(0);
          }catch{}
          process.exit(1);
          NODE
              then
                cat /tmp/v962-health.json
                echo
                echo "Temporary E2E bridge health is ready."
                exit 0
              fi
            fi
            sleep $((attempt*3))
          done
          echo "Temporary E2E health response did not become ready:"
          cat /tmp/v962-health.json || true
          exit 1

      - name: Run real operational E2E with self-cleaning temporary TEST records
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/$TEMP_SLOT_ID/exec?v962=1"
          curl -sS -L --max-time 240 \
            --data-urlencode "secret=$V962_SECRET" \
            --data-urlencode "action=run" \
            "$URL" > /tmp/approved-temp-ops-e2e-result.json
          cat /tmp/approved-temp-ops-e2e-result.json
          echo
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/approved-temp-ops-e2e-result.json','utf8'));
          if(!p||p.ok!==true||!p.result) throw new Error('Temporary E2E bridge did not return a valid result.');
          const r=p.result;
          const required={
            success:true,
            allTemporaryRowsRemoved:true,
            financialSafetyUnchanged:true,
            productionOrderCreated:false,
            realCustomerOrVendorCreated:false,
            paymentLedgerWrite:false,
            cashbackWrite:false,
            subscriptionWrite:false,
            vendorOutstandingWrite:false
          };
          for(const [k,v] of Object.entries(required)) if(r[k]!==v) throw new Error(`${k} expected ${v} but got ${r[k]}; error=${r.error||''}`);
          if(!Array.isArray(r.checkpoints)||r.checkpoints.length<10||r.checkpoints.some(x=>x.ok!==true)) throw new Error('One or more operational checkpoints failed.');
          console.log(`Operational E2E passed ${r.checkpoints.length} checkpoints for ${r.testId}; all TEST rows were removed.`);
          NODE

      - name: Restore old Preview deployment exactly
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          npx clasp deploy -i "$TEMP_SLOT_ID" -V "$TEMP_SLOT_ORIGINAL_VERSION" -d "$TEMP_SLOT_ORIGINAL_DESCRIPTION"
          sleep 2
          LINE="$(npx clasp deployments | grep "$TEMP_SLOT_ID")"
          echo "$LINE"
          echo "$LINE" | grep -q "@$TEMP_SLOT_ORIGINAL_VERSION"
          echo "$LINE" | grep -Fq "$TEMP_SLOT_ORIGINAL_DESCRIPTION"

      - name: Restore Apps Script HEAD exactly from main
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src
          npx clasp push -f
          echo "Apps Script HEAD restored from main. Production deployment IDs were never modified."

      - name: Verify production B2C backend remains healthy read-only
        if: always()
        shell: bash
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3/exec
        run: |
          node <<'NODE'
          (async()=>{
            const cb='__nelPostE2EHealth';
            const req={method:'getB2COrderEngineHealthV906',args:[],requestId:'post-e2e-'+Date.now()};
            const url=process.env.API_URL+'?jsonp=1&callback='+cb+'&payload='+encodeURIComponent(JSON.stringify(req))+'&_='+Date.now();
            const response=await fetch(url,{redirect:'follow',cache:'no-store'});
            const text=await response.text();
            const m=text.match(/^__nelPostE2EHealth\(([\s\S]*)\);?$/);
            const p=m?JSON.parse(m[1]):null;
            if(response.status!==200||!p||p.ok!==true||!p.result||p.result.ok!==true) throw new Error('Production B2C backend health check failed after E2E.');
            console.log('Production B2C backend health is green after temporary E2E.');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
