name: Deploy Native Elaneeru Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate B2C and B2B PWAs
        run: node scripts/smoke-check.mjs

      - name: Verify live B2C backend health (read-only)
        env:
          API_URL: https://script.google.com/macros/s/AKfycbwWt1gjknt21us91HbFVbFdr5DbkEta-ZmETke-axuepZYp8fQRwAiGTnlgiKrxthb3/exec
        run: |
          node <<'NODE'
          (async () => {
            async function jsonp(method){
              const callback='__nelPagesHealth';
              const request={method,args:[],requestId:'pages-health-'+method+'-'+Date.now()};
              const url=process.env.API_URL+'?jsonp=1&callback='+callback+'&payload='+encodeURIComponent(JSON.stringify(request))+'&_='+Date.now();
              const response=await fetch(url,{redirect:'follow',cache:'no-store'});
              const text=await response.text();
              const match=text.match(/^__nelPagesHealth\(([\s\S]*)\);?$/);
              const payload=match?JSON.parse(match[1]):null;
              if(response.status!==200||!payload||payload.ok!==true) throw new Error(method+' did not return a valid structured response.');
              return payload.result;
            }
            const config=await jsonp('getAppConfig');
            const health=await jsonp('getB2COrderEngineHealthV906');
            const products=config&&Array.isArray(config.products)?config.products:[];
            const tender=products.some(p=>String(p.id||p.productId||p['Product ID']||'').toUpperCase()==='TC'||/tender coconut/i.test(String(p.name||p.productName||p['Product Name']||'')));
            if(products.length<1||!tender) throw new Error('B2C live catalogue is missing Tender Coconut.');
            if(!health||health.ok!==true||health.engineVersion!=='9.0.5'||health.canonicalOrderHandler!==true||health.idempotency!==true||health.serverControlledPayment!==true) throw new Error('B2C Checkout Engine V2 health is not ready.');
            console.log(JSON.stringify({products:products.length,tenderCoconut:true,checkoutEngine:health.engineVersion}));
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live B2C and B2B PWAs in Chrome
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/live-browser-e2e.mjs
