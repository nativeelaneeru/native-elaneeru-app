<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(155deg,#053d25,#0a7a43 58%,#14a866);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#142019}.box{width:min(430px,100%);background:#fff;border-radius:26px;padding:21px;box-shadow:0 28px 80px #002b1b66}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.logo{width:76px;height:76px;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 8px 24px #0002}.lang{border:1px solid #d7e6dc;border-radius:11px;padding:8px 10px;background:#f7fbf8;color:#075b34;font-weight:900}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:#0a7a43;font-weight:900;margin-top:15px}h1{font-size:29px;line-height:1.05;margin:5px 0 7px;color:#075b34}p{font-size:12px;line-height:1.55;color:#68766d;margin:0 0 15px}.field{width:100%;border:1px solid #d8e5dc;border-radius:13px;padding:13px;font:inherit;outline:0;margin-top:9px}.field:focus{border-color:#55ad7b;box-shadow:0 0 0 4px #dff4e8}.pin{letter-spacing:5px;text-align:center;font-weight:900}.btn{width:100%;margin-top:10px;border:0;border-radius:13px;padding:13px;background:#075b34;color:#fff;font-weight:900;font:inherit}.btn.alt{background:#edf7f0;color:#075b34}.btn.ghost{background:#fff;color:#075b34;border:1px solid #cfe0d5}.btn:disabled{opacity:.55}.msg{font-size:11px;color:#a03d26;min-height:18px;margin-top:8px}.info{font-size:11px;color:#486052;background:#eff8f2;border-radius:12px;padding:10px;margin-top:10px}.fine{font-size:10px;color:#7c877f;text-align:center;margin-top:10px}.hide{display:none!important}
</style>
</head>
<body>
<main class="box">
<div class="head"><img class="logo" src="../icons/native-elaneeru.svg" alt="Native Elaneeru"><select id="language" class="lang"><option value="en">EN</option><option value="kn">ಕನ್ನಡ</option><option value="te">తెలుగు</option><option value="hi">हिन्दी</option></select></div>
<div class="eyebrow">Sri Govindadri Ventures</div><h1 id="title"></h1><p id="intro"></p>
<section id="mobileStep"><input id="mobile" class="field" inputmode="numeric" maxlength="10" autocomplete="tel"><button id="continueBtn" class="btn"></button></section>
<section id="pinLoginStep" class="hide"><div id="pinLoginInfo" class="info"></div><input id="loginPin" class="field pin" inputmode="numeric" maxlength="4" type="password"><button id="loginBtn" class="btn"></button><button class="btn ghost backBtn"></button></section>
<section id="noPinStep" class="hide"><div id="noPinInfo" class="info"></div><button id="showCreateBtn" class="btn"></button><button id="skipPinBtn" class="btn alt"></button><button class="btn ghost backBtn"></button></section>
<section id="createPinStep" class="hide"><div id="createInfo" class="info"></div><input id="newPin" class="field pin" inputmode="numeric" maxlength="4" type="password"><input id="confirmPin" class="field pin" inputmode="numeric" maxlength="4" type="password"><button id="createPinBtn" class="btn"></button><button id="createBackBtn" class="btn alt"></button></section>
<div id="msg" class="msg"></div><div id="fine" class="fine"></div>
</main>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycby4tO2Y1xWbVv1XqzbIYjuTKOt4XRWPzB9MseMC1x-qc8gbNYPvqvG1z6PuCPGZi5O2/exec',K='nel_b2c_language',seq=0,currentMobile='';
var T={
en:{title:'Welcome to Native Elaneeru',intro:'Enter your mobile number. Continue without a PIN or create an optional 4-digit PIN for safer login on another device.',mobile:'10 digit mobile number',cont:'Continue',checking:'Checking account…',hasPin:'A PIN is already set for this mobile number.',pin:'4 digit PIN',login:'Login',change:'Change mobile number',noPin:'No PIN is set. Create one now or continue without a PIN.',create:'Create 4-digit PIN',skip:'Continue without PIN',createInfo:'Create a 4-digit PIN. Only a secure hash is stored.',newPin:'New 4 digit PIN',confirm:'Confirm PIN',createContinue:'Create PIN & Continue',back:'Back',fine:'This device will remember your login until you log out.',invalid:'Enter a valid 10 digit mobile number.',pinInvalid:'Enter your 4 digit PIN.',mismatch:'PINs do not match.',creating:'Creating PIN…'},
kn:{title:'Native Elaneeru ಗೆ ಸ್ವಾಗತ',intro:'ನಿಮ್ಮ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ. PIN ಇಲ್ಲದೇ ಮುಂದುವರಿಯಬಹುದು ಅಥವಾ ಐಚ್ಛಿಕ 4 ಅಂಕಿಯ PIN ರಚಿಸಬಹುದು.',mobile:'10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ',cont:'ಮುಂದುವರಿಸಿ',checking:'ಖಾತೆ ಪರಿಶೀಲಿಸಲಾಗುತ್ತಿದೆ…',hasPin:'ಈ ಮೊಬೈಲ್ ಸಂಖ್ಯೆಗೆ PIN ಈಗಾಗಲೇ ಇದೆ.',pin:'4 ಅಂಕಿಯ PIN',login:'ಲಾಗಿನ್',change:'ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ಬದಲಿಸಿ',noPin:'PIN ಹೊಂದಿಸಲಾಗಿಲ್ಲ. ಈಗ ರಚಿಸಿ ಅಥವಾ PIN ಇಲ್ಲದೇ ಮುಂದುವರಿಸಿ.',create:'4 ಅಂಕಿಯ PIN ರಚಿಸಿ',skip:'PIN ಇಲ್ಲದೇ ಮುಂದುವರಿಸಿ',createInfo:'4 ಅಂಕಿಯ PIN ರಚಿಸಿ. ಸುರಕ್ಷಿತ ಹ್ಯಾಶ್ ಮಾತ್ರ ಸಂಗ್ರಹಿಸಲಾಗುತ್ತದೆ.',newPin:'ಹೊಸ 4 ಅಂಕಿಯ PIN',confirm:'PIN ದೃಢೀಕರಿಸಿ',createContinue:'PIN ರಚಿಸಿ ಮತ್ತು ಮುಂದುವರಿಸಿ',back:'ಹಿಂದೆ',fine:'ಲಾಗ್ ಔಟ್ ಮಾಡುವವರೆಗೆ ಈ ಸಾಧನ ಲಾಗಿನ್ ನೆನಪಿಡುತ್ತದೆ.',invalid:'ಮಾನ್ಯ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ನಮೂದಿಸಿ.',pinInvalid:'4 ಅಂಕಿಯ PIN ನಮೂದಿಸಿ.',mismatch:'PINಗಳು ಹೊಂದಿಕೆಯಾಗುತ್ತಿಲ್ಲ.',creating:'PIN ರಚಿಸಲಾಗುತ್ತಿದೆ…'},
te:{title:'Native Elaneeru కు స్వాగతం',intro:'మీ మొబైల్ నంబర్ నమోదు చేయండి. PIN లేకుండా కొనసాగవచ్చు లేదా ఐచ్ఛిక 4 అంకెల PIN సృష్టించవచ్చు.',mobile:'10 అంకెల మొబైల్ నంబర్',cont:'కొనసాగించండి',checking:'ఖాతా తనిఖీ చేస్తోంది…',hasPin:'ఈ మొబైల్ నంబర్‌కు PIN ఇప్పటికే ఉంది.',pin:'4 అంకెల PIN',login:'లాగిన్',change:'మొబైల్ నంబర్ మార్చండి',noPin:'PIN సెట్ చేయలేదు. ఇప్పుడు సృష్టించండి లేదా PIN లేకుండా కొనసాగండి.',create:'4 అంకెల PIN సృష్టించండి',skip:'PIN లేకుండా కొనసాగండి',createInfo:'4 అంకెల PIN సృష్టించండి. సురక్షిత హ్యాష్ మాత్రమే నిల్వ చేస్తాం.',newPin:'కొత్త 4 అంకెల PIN',confirm:'PIN నిర్ధారించండి',createContinue:'PIN సృష్టించి కొనసాగండి',back:'వెనుకకు',fine:'లాగ్ అవుట్ చేసే వరకు ఈ డివైస్ లాగిన్‌ను గుర్తుంచుకుంటుంది.',invalid:'చెల్లుబాటు అయ్యే 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి.',pinInvalid:'4 అంకెల PIN నమోదు చేయండి.',mismatch:'PINలు సరిపోలడం లేదు.',creating:'PIN సృష్టిస్తోంది…'},
hi:{title:'Native Elaneeru में आपका स्वागत है',intro:'अपना मोबाइल नंबर दर्ज करें। बिना PIN जारी रखें या वैकल्पिक 4 अंकों का PIN बनाएं।',mobile:'10 अंकों का मोबाइल नंबर',cont:'जारी रखें',checking:'खाता जांचा जा रहा है…',hasPin:'इस मोबाइल नंबर के लिए PIN पहले से सेट है।',pin:'4 अंकों का PIN',login:'लॉगिन',change:'मोबाइल नंबर बदलें',noPin:'PIN सेट नहीं है। अभी बनाएं या बिना PIN जारी रखें।',create:'4 अंकों का PIN बनाएं',skip:'बिना PIN जारी रखें',createInfo:'4 अंकों का PIN बनाएं। केवल सुरक्षित हैश स्टोर होता है।',newPin:'नया 4 अंकों का PIN',confirm:'PIN की पुष्टि करें',createContinue:'PIN बनाएं और जारी रखें',back:'वापस',fine:'लॉग आउट करने तक यह डिवाइस आपका लॉगिन याद रखेगा।',invalid:'मान्य 10 अंकों का मोबाइल नंबर दर्ज करें।',pinInvalid:'अपना 4 अंकों का PIN दर्ज करें।',mismatch:'PIN मेल नहीं खाते।',creating:'PIN बनाया जा रहा है…'}};
function $(x){return document.getElementById(x)}function digits(v){return String(v||'').replace(/\D/g,'').slice(-10)}function lang(){var x='en';try{x=localStorage.getItem(K)||'en'}catch(e){}return T[x]?x:'en'}function text(){return T[lang()]}
function apply(c){c=T[c]?c:'en';try{localStorage.setItem(K,c)}catch(e){}document.documentElement.lang=c;$('language').value=c;var t=T[c];$('title').textContent=t.title;$('intro').textContent=t.intro;$('mobile').placeholder=t.mobile;$('continueBtn').textContent=t.cont;$('pinLoginInfo').textContent=t.hasPin;$('loginPin').placeholder=t.pin;$('loginBtn').textContent=t.login;document.querySelectorAll('.backBtn').forEach(function(b){b.textContent=t.change});$('noPinInfo').textContent=t.noPin;$('showCreateBtn').textContent=t.create;$('skipPinBtn').textContent=t.skip;$('createInfo').textContent=t.createInfo;$('newPin').placeholder=t.newPin;$('confirmPin').placeholder=t.confirm;$('createPinBtn').textContent=t.createContinue;$('createBackBtn').textContent=t.back;$('fine').textContent=t.fine}
function say(x){$('msg').textContent=x||''}function show(id){['mobileStep','pinLoginStep','noPinStep','createPinStep'].forEach(function(x){$(x).classList.toggle('hide',x!==id)})}
function rpc(method,args){return new Promise(function(resolve,reject){args=Array.isArray(args)?args:[];var cb='__nelLogin'+Date.now()+(++seq)+Math.floor(Math.random()*10000),script=document.createElement('script'),done=false,timer;function clean(){if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){}try{script.remove()}catch(e){}}window[cb]=function(p){clean();p=p||{};p.ok?resolve(p.result):reject(new Error(p.error||'Request failed.'))};script.onerror=function(){clean();reject(new Error('Unable to connect. Please check internet and retry.'))};script.src=API+'?jsonp=1&callback='+encodeURIComponent(cb)+'&payload='+encodeURIComponent(JSON.stringify({method:method,args:args,requestId:cb}))+'&v=1090&_='+Date.now();timer=setTimeout(function(){clean();reject(new Error('Connection timed out. Please retry.'))},15000);document.head.appendChild(script)})}
function saveOpen(m,p){p=p||{};p.mobile=m;try{localStorage.setItem('nel_b2c_session_mobile',m);localStorage.setItem('nel_b2c_profile',JSON.stringify(p));localStorage.setItem('nel_profile_v9',JSON.stringify(p))}catch(e){}location.replace('../index.html?v=1090')}
async function lookup(){var t=text(),m=digits($('mobile').value);say('');if(!/^[6-9]\d{9}$/.test(m)){say(t.invalid);return}currentMobile=m;$('continueBtn').disabled=true;$('continueBtn').textContent=t.checking;try{var s=await rpc('getCustomerPinStatusV107',[m]);show(s&&s.hasPin?'pinLoginStep':'noPinStep');if(s&&s.hasPin)$('loginPin').focus()}catch(e){say(e.message)}finally{$('continueBtn').disabled=false;$('continueBtn').textContent=t.cont}}
async function pinLogin(){var t=text(),p=digits($('loginPin').value);say('');if(p.length!==4){say(t.pinInvalid);return}try{var r=await rpc('customerLoginWithPinV107',[currentMobile,p]);saveOpen(currentMobile,r&&r.profile)}catch(e){say(e.message)}}
async function skip(){try{var r=await rpc('customerLoginV95',[currentMobile]);saveOpen(currentMobile,r&&r.profile)}catch(e){say(e.message)}}
async function createPin(){var t=text(),a=digits($('newPin').value),b=digits($('confirmPin').value);say('');if(a.length!==4){say(t.pinInvalid);return}if(a!==b){say(t.mismatch);return}$('createPinBtn').disabled=true;$('createPinBtn').textContent=t.creating;try{await rpc('setCustomerPinV107',[currentMobile,a,'']);var r=await rpc('customerLoginWithPinV107',[currentMobile,a]);saveOpen(currentMobile,r&&r.profile)}catch(e){say(e.message);$('createPinBtn').disabled=false;$('createPinBtn').textContent=t.createContinue}}
$('language').onchange=function(){apply(this.value)};$('continueBtn').onclick=lookup;$('loginBtn').onclick=pinLogin;$('skipPinBtn').onclick=skip;$('showCreateBtn').onclick=function(){show('createPinStep');$('newPin').focus()};$('createBackBtn').onclick=function(){show('noPinStep')};document.querySelectorAll('.backBtn').forEach(function(b){b.onclick=function(){currentMobile='';$('mobile').value='';$('loginPin').value='';show('mobileStep');$('mobile').focus()}});['mobile','loginPin','newPin','confirmPin'].forEach(function(id){$(id).oninput=function(){this.value=digits(this.value)}});$('mobile').onkeydown=function(e){if(e.key==='Enter')lookup()};$('loginPin').onkeydown=function(e){if(e.key==='Enter')pinLogin()};apply(lang());var saved=digits(localStorage.getItem('nel_b2c_session_mobile')||'');if(/^[6-9]\d{9}$/.test(saved))location.replace('../index.html?v=1090');
})();
</script>
</body></html>
