<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075b34"><title>Native Elaneeru Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(155deg,#053d25,#0a7a43 58%,#14a866);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#142019}.box{width:min(420px,100%);background:#fff;border-radius:26px;padding:21px;box-shadow:0 28px 80px #002b1b66}.logo{width:72px;height:72px;border-radius:20px;object-fit:contain;background:#fff;box-shadow:0 8px 24px #0002}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:#0a7a43;font-weight:900;margin-top:15px}h1{font-size:29px;line-height:1.05;margin:5px 0 7px;color:#075b34}p{font-size:12px;line-height:1.55;color:#68766d;margin:0 0 15px}.field{width:100%;border:1px solid #d8e5dc;border-radius:13px;padding:13px;font:inherit;outline:0}.field:focus{border-color:#55ad7b;box-shadow:0 0 0 4px #dff4e8}.btn{width:100%;margin-top:10px;border:0;border-radius:13px;padding:13px;background:#075b34;color:#fff;font-weight:900;font:inherit}.btn:disabled{opacity:.55}.msg{font-size:11px;color:#a03d26;min-height:18px;margin-top:8px}.fine{font-size:10px;color:#7c877f;text-align:center;margin-top:8px}</style></head><body><main class="box"><img class="logo" src="../icons/native-elaneeru.svg" alt="Native Elaneeru"><div class="eyebrow">Sri Govindadri Ventures</div><h1>Welcome to Native Elaneeru</h1><p>Enter your mobile number to continue. During the B2C soft launch, customers do not need a PIN or OTP.</p><input id="mobile" class="field" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number" autocomplete="tel"><button id="btn" class="btn">Continue</button><div id="msg" class="msg"></div><div class="fine">This device will remember your login until you log out.</div></main><script src="../config.js"></script><script>
const $=id=>document.getElementById(id),pending=new Map();
function digits(v){return String(v||'').replace(/\D/g,'').slice(-10)}
window.addEventListener('message',e=>{const d=e.data;if(!d||d.nelBridge!==true||!d.payload)return;const p=d.payload,h=pending.get(String(p.requestId||''));if(!h)return;pending.delete(String(p.requestId||''));h.cleanup();p.ok?h.resolve(p.result):h.reject(new Error(p.error||'Request failed.'))});
function rpc(method,args=[]){return new Promise((resolve,reject)=>{const api=(window.NEL_CONFIG&&window.NEL_CONFIG.apiUrl)||'';if(!api)return reject(new Error('App API is not configured.'));const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).toString(),frame=document.createElement('iframe'),form=document.createElement('form');frame.name='nel_'+id;frame.style.display='none';form.method='POST';form.target=frame.name;form.action=api+(api.includes('?')?'&':'?')+'bridge=1';form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({method,args,requestId:id});form.appendChild(input);document.body.append(frame,form);const timer=setTimeout(()=>{pending.delete(id);frame.remove();form.remove();reject(new Error('Request timed out.'))},12000);const cleanup=()=>{clearTimeout(timer);setTimeout(()=>{frame.remove();form.remove()},20)};pending.set(id,{resolve,reject,cleanup});form.submit()})}
function saveAndOpen(m,profile){localStorage.setItem('nel_b2c_session_mobile',m);const p=profile||{mobile:m,name:'',area:'',pincode:'',address:'',latitude:'',longitude:''};localStorage.setItem('nel_b2c_profile',JSON.stringify(p));localStorage.setItem('nel_profile_v9',JSON.stringify(p));location.replace('../index.html')}
async function login(){const m=digits($('mobile').value);$('msg').textContent='';if(!/^[6-9]\d{9}$/.test(m)){ $('msg').textContent='Enter a valid 10 digit mobile number.';return }$('btn').disabled=true;$('btn').textContent='Opening app…';localStorage.setItem('nel_b2c_session_mobile',m);try{const r=await rpc('customerLoginV95',[m]);const profile=r&&r.exists?r.profile:{mobile:m,name:'',area:'',pincode:'',address:'',latitude:'',longitude:''};if(r&&!r.exists)localStorage.setItem('nel_b2c_new_customer','1');else localStorage.removeItem('nel_b2c_new_customer');saveAndOpen(m,profile)}catch(e){saveAndOpen(m,{mobile:m,name:'',area:'',pincode:'',address:'',latitude:'',longitude:''})}}
$('btn').onclick=login;$('mobile').addEventListener('keydown',e=>{if(e.key==='Enter')login()});const saved=digits(localStorage.getItem('nel_b2c_session_mobile')||'');if(/^[6-9]\d{9}$/.test(saved)){location.replace('../index.html')}
</script></body></html>
