<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native Elaneeru Business</title><style>
:root{--n:#083d2e;--a:#0b7a4c;--ink:#13281e;--mut:#63746b;--bg:#f3f7f4;--line:#d9e6dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);padding-bottom:76px}.top{background:linear-gradient(115deg,#063322,#087847);padding:16px;color:#fff}.topin,.wrap{max-width:860px;margin:auto}.brand{font-weight:900;font-size:20px}.sub{opacity:.8;font-size:12px}.wrap{padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin:11px 0;box-shadow:0 8px 28px #0a43230c}.hidden{display:none!important}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font:inherit}.primary{border:0;border-radius:12px;padding:12px 14px;background:var(--a);color:#fff;font-weight:900;cursor:pointer}.login{max-width:430px;margin:48px auto}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px;border:1px solid var(--line);border-radius:14px}.metric small,.muted{color:var(--mut);font-size:12px}.metric b{display:block;font-size:21px;margin-top:5px}.grow{background:linear-gradient(135deg,#e7f8ed,#fff5d7)}h1,h2,h3{margin:0}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}.img{height:105px;border-radius:13px;background:linear-gradient(135deg,#e8f5ef,#fff0c9);display:grid;place-items:center;font-size:55px}.price{font-size:22px;font-weight:900;color:var(--n)}.addrow{display:flex;gap:7px;margin-top:8px}.addrow input{min-width:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:40px;padding:10px}.nav{border:0;background:none;color:var(--mut);font-weight:800}.nav.on{color:var(--a)}.toast{font-size:12px;color:#a33;margin-top:8px}@media(max-width:520px){.products{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><div class="topin"><div class="brand">🥥 Native Elaneeru Business</div><div class="sub">Vendor growth & bulk ordering</div></div></header><main class="wrap"><section id="login" class="card login"><h2>Business login</h2><p class="muted">Use your registered vendor mobile and B2B PIN.</p><input id="mobile" class="field" maxlength="10" inputmode="numeric" placeholder="Registered mobile"><input id="pin" class="field" type="password" inputmode="numeric" placeholder="B2B PIN" style="margin-top:8px"><button class="primary" id="loginBtn" style="width:100%;margin-top:9px">Open business app</button><div id="msg" class="toast"></div></section><section id="app" class="hidden"><div id="hero" class="card grow"></div><div class="section"><h2>Today’s market</h2><span class="muted">Live catalogue price</span></div><div id="market" class="card"></div><div class="section"><h2>Business catalogue</h2><span class="muted">Your negotiated price</span></div><div id="products" class="products"></div><div class="section"><h2>Recent orders</h2></div><div id="orders" class="card"></div></section></main><nav id="nav" class="bottom hidden"><button class="nav on">🏪 Home</button><button class="nav">📦 Orders</button><button class="nav" id="logout">↪ Logout</button></nav><script>
const API='https://script.google.com/macros/s/AKfycbx2s0l5A8LAdD1j24395XJSTMd5cEU7QdUkTI8LarDzatF-vVw6ODfm5x7MVJUkP9aB/exec';let token='',data=null;const $=x=>document.getElementById(x),money=x=>'₹'+Number(x||0).toLocaleString('en-IN');function rpc(method,args=[]){return new Promise((resolve,reject)=>{let id=Date.now()+'_'+Math.random(),f=document.createElement('iframe'),form=document.createElement('form'),i=document.createElement('input'),bridge=document.createElement('input'),timer=setTimeout(()=>reject(new Error('Connection timed out')),35000);f.name='b_'+id;f.style.display='none';form.method='POST';form.action=API+'?bridge=1';form.target=f.name;bridge.name='bridge';bridge.value='1';i.name='payload';i.value=JSON.stringify({method,args,requestId:id});form.append(bridge,i);document.body.append(f,form);let h=e=>{let d=e.data;if(d&&d.nelBridge&&d.payload&&d.payload.requestId===id){window.removeEventListener('message',h);clearTimeout(timer);f.remove();form.remove();d.payload.ok?resolve(d.payload.result):reject(new Error(d.payload.error||'Request failed'))}};window.addEventListener('message',h);form.submit()})}function render(){let v=data.vendor||{},t=data.target||{};$('hero').innerHTML='<h1>'+v.businessName+'</h1><p class="muted">'+(v.ownerName||'')+' · '+(v.area||'')+'</p><div class="metrics"><div class="metric"><small>Outstanding</small><b>'+money(v.outstanding)+'</b></div><div class="metric"><small>Available credit</small><b>'+money(v.availableCredit)+'</b></div><div class="metric"><small>30-day target</small><b>'+Number(t.achievedQty||0)+'/'+Number(t.targetQty||0)+'</b></div></div>';$('market').innerHTML=(data.products||[]).map(p=>'<b>'+p.productName+'</b><div class="muted">Your price '+money(p.price)+' / '+(p.unit||'pc')+' · MOQ '+p.moq+'</div>').join('')||'No market prices available.';$('products').innerHTML=(data.products||[]).map(p=>'<div class="product"><div class="img">🥥</div><h3>'+p.productName+'</h3><div class="price">'+money(p.price)+' <span class="muted">/'+(p.unit||'pc')+'</span></div><div class="muted">MOQ '+p.moq+' · Step '+p.qtyStep+'</div><div class="addrow"><input class="field" type="number" value="'+p.moq+'"><button class="primary">Add</button></div></div>').join('')||'<div class="card">No B2B products have been assigned.</div>';$('orders').innerHTML=(data.orders||[]).map(o=>'<b>'+o.orderId+'</b> · '+o.status+' · '+money(o.amount)).join('<hr>')||'<span class="muted">No orders yet.</span>'}async function login(){try{$('loginBtn').disabled=true;let r=await rpc('vendorLogin',[$('mobile').value,$('pin').value]);token=r.token;data=await rpc('getB2BAppDataV9',[token]);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('nav').classList.remove('hidden');render()}catch(e){$('msg').textContent=e.message}finally{$('loginBtn').disabled=false}}$('loginBtn').onclick=login;$('logout').onclick=()=>location.reload();</script></body></html>
