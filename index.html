    setHTML('.hero h1','Grow Farmers.<br><span>Empower Vendors.</span><br>Serve Everyone.');

    setText('.purposeText','We build a dependable tender-coconut supply chain where farmers find stronger demand and Bengaluru vendors get reliable wholesale access.');
    setText('.bridgeHead p','Native Elaneeru connects farm sourcing with dependable tender-coconut wholesale supply for roadside vendors and businesses across Bengaluru.');

    const vendorImg=parsed.querySelector('#vendors img');
