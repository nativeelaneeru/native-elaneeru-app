<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Native Elaneeru Business Demo v4</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f0}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="demo" src="../b2b-demo-final-v3/" title="Native Elaneeru Business Demo"></iframe>
<script>
const frame=document.getElementById('demo');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;
  const nav=(active)=>`<nav class="nav">
    <button class="${active==='home'?'on':''}" onclick="show('home')"><span>⌂</span>Home</button>
    <button class="${active==='products'?'on':''}" onclick="show('products')"><span>▦</span>Products</button>
    <button class="${active==='cart'?'on':''}" onclick="show('cart')"><span>🛒</span>Cart</button>
    <button class="${active==='orders'?'on':''}" onclick="show('orders')"><span>▣</span>Orders</button>
    <button class="${active==='account'?'on':''}" onclick="show('account')"><span>♙</span>Account</button>
  </nav>`;
  ['home','products','cart','orders','account'].forEach(id=>{
    const s=d.getElementById(id);
    if(!s)return;
    const old=s.querySelector(':scope > nav.nav');
    if(old)old.remove();
    s.insertAdjacentHTML('beforeend',nav(id));
  });
});
</script>
</body>
</html>
