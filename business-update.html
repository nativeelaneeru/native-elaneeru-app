<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f40">
<title>Updating Native Elaneeru Business</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f3faf5;color:#12301e}.wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,420px);background:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 18px 50px rgba(7,78,39,.12)}.mark{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;background:#e8f8ed;color:#078843;font-weight:950;font-size:22px}.card h1{font-size:22px;margin:0 0 8px}.card p{font-size:13px;line-height:1.5;color:#65766b;margin:0}.bar{height:9px;border-radius:999px;background:#e8efe9;overflow:hidden;margin:22px 0 12px}.bar i{display:block;width:35%;height:100%;background:#0a9b4b;border-radius:999px;animation:move 1.1s ease-in-out infinite}.status{font-size:12px;font-weight:800;color:#287147}.fallback{display:none;margin-top:18px}.fallback a{display:inline-block;text-decoration:none;background:#0a9b4b;color:white;padding:12px 18px;border-radius:12px;font-weight:900}@keyframes move{0%{transform:translateX(-100%)}100%{transform:translateX(285%)}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="mark">NE</div><h1>Updating Business App</h1><p>Refreshing the installed Native Elaneeru Business app and removing old cached versions.</p><div class="bar"><i></i></div><div id="status" class="status">Preparing update…</div><div id="fallback" class="fallback"><a href="./b2b/?build=1200">Open updated Business app</a></div></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const fallback=document.getElementById('fallback');
  try{
    status.textContent='Removing old Business app workers…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg=>{
        const scope=String(reg.scope||'');
        if(scope.includes('/b2b/')||scope.includes('/b2b-v2/')||scope.includes('/b2c/business/')) return reg.unregister();
        return Promise.resolve(false);
      }));
    }
    status.textContent='Clearing old Business app cache…';
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/native-elaneeru-(business|b2b)/i.test(k)).map(k=>caches.delete(k)));
    }
    status.textContent='Opening the updated app…';
    const url='./b2b/?build=1200&fresh='+Date.now();
    setTimeout(()=>location.replace(url),350);
  }catch(err){
    status.textContent='Update prepared. Open the latest app below.';
    fallback.style.display='block';
  }
})();
</script>
</body>
</html>
