<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15834f">
<title>Native Elaneeru B2B Demo + Voice</title>
</head>
<body style="margin:0;background:#e9f3eb">
<div style="min-height:100vh;display:grid;place-items:center;font:600 14px system-ui;color:#0c5f3a">Loading Native Elaneeru demo…</div>
<script>
(async()=>{
  const response=await fetch('./base.html?v=2',{cache:'no-store'});
  if(!response.ok) throw new Error('Demo base could not be loaded');
  let html=await response.text();
  const css=String.raw`
/* v2 refinement patch */
.scroll{padding-bottom:78px}
.screen[data-screen="home"] .scroll{height:100%}
.screen[data-screen="home"] .page{padding-bottom:82px}
.product-body h3{cursor:pointer}
.product-note{font-size:8px;color:var(--green);font-weight:800;margin-top:4px}
.track-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--green-soft);color:var(--green-dark);font-size:9px;line-height:1.45}
.account-note{margin:14px 0;padding:11px;border-radius:10px;background:#eef5f0;color:var(--muted);font-size:9px;line-height:1.45}
/* v3 login refinement */
.screen.login .scroll{height:100%;padding:0}
.login-wrap{display:flex;flex-direction:column;min-height:100%;background:#fff}
.login-art{height:34%;min-height:235px;max-height:300px}
.login-art:after{background:linear-gradient(180deg,rgba(7,55,34,.10),rgba(7,55,34,.88))}
.login-copy{left:20px;right:20px;bottom:18px}
.login-copy .brand img{width:44px;height:44px}
.login-copy .brand-text strong{font-size:15px}
.login-copy .brand-text span{font-size:7px;color:rgba(255,255,255,.82);letter-spacing:.04em;text-transform:none}
.login-copy h1{font-size:23px;line-height:1.14;margin:16px 0 0}
.login-form{padding:20px 22px 24px;flex:1}
.login-form h2{font-size:22px;margin:4px 0 5px}
.login-form .muted{font-size:11px;margin:0 0 14px}
.login-phone-wrap{display:flex;align-items:center;border:1px solid #dbe5de;border-radius:10px;background:#fff;overflow:hidden}
.login-phone-prefix{padding:11px 10px 11px 12px;font-size:13px;font-weight:800;border-right:1px solid var(--line);background:#f6f9f7}
.login-phone-wrap input{border:0!important;box-shadow:none!important;border-radius:0!important;padding:11px 12px!important;min-width:0}
.login-helper{font-size:8px;color:var(--muted);margin-top:5px}
.login-secure{display:flex;align-items:center;gap:6px;font-size:8px;color:var(--muted);margin:8px 0 12px}
.login-secure b{color:var(--green-dark)}
.demo-hint{font-size:9px;margin:8px 0 10px;padding:8px 10px}
.login-support{margin-top:11px;text-align:center;font-size:9px;color:var(--muted)}
.login-support button{border:0;background:none;color:var(--green-dark);font-weight:800;padding:2px 4px}
@media(max-width:500px){.login-art{height:31%;min-height:215px}.login-form{padding-top:18px}.login-copy h1{font-size:22px}}
`;
  const patch=String.raw`
(()=>{
  const DEMO_STAGE_MS=8000;
  state.orderPlacedAt=Date.now()-16000;
  state.orderQty=200;

  // Production-shaped demo login: phone + 4-digit PIN. Phone is locked after sign-in.
  const loginBrandSub=document.querySelector('[data-screen="login"] .brand-text span');if(loginBrandSub)loginBrandSub.textContent='Grow Farmers • Empower Vendors • Serve Everyone.';
  const loginHero=document.querySelector('[data-screen="login"] .login-copy h1');if(loginHero)loginHero.innerHTML='Freshness from the farm.<br>Built for your business.';
  const loginEyebrow=document.querySelector('[data-screen="login"] .eyebrow');if(loginEyebrow)loginEyebrow.textContent='NATIVE ELANEERU BUSINESS';
  const loginHeading=document.querySelector('[data-screen="login"] .login-form h2');if(loginHeading)loginHeading.textContent='Partner login';
  const loginIntro=document.querySelector('[data-screen="login"] .login-form .muted');if(loginIntro)loginIntro.textContent='Use your registered mobile number and 4-digit PIN.';
  const lockedPhone=document.querySelector('[data-screen="login"] .locked');
  if(lockedPhone){lockedPhone.outerHTML='<div class="login-phone-wrap"><span class="login-phone-prefix">+91</span><input class="input" id="mobileInput" inputmode="numeric" autocomplete="tel" maxlength="10" placeholder="Registered mobile number"></div><div class="login-helper">Enter the 10-digit mobile number registered with Native Elaneeru.</div>';}
  const pin=document.getElementById('pinInput');if(pin){pin.setAttribute('autocomplete','current-password');pin.placeholder='Enter 4-digit PIN';}
  const hint=document.querySelector('[data-screen="login"] .demo-hint');if(hint)hint.innerHTML='Demo access: enter any 10-digit mobile number • PIN <strong>1234</strong>';
  const loginBtn=document.querySelector('[data-screen="login"] .login-form .btn.block');if(loginBtn)loginBtn.textContent='Continue securely →';
  const loginLegal=document.querySelector('[data-screen="login"] .legal');if(loginLegal)loginLegal.insertAdjacentHTML('beforebegin','<div class="login-secure">🔒 <span>Your phone is used only to identify your vendor account. <b>It becomes locked after login.</b></span></div><div class="login-support">Need help signing in? <button type="button" onclick="toast(\'Contact Native Elaneeru support for login help\')">Contact Support</button></div>');
  const savedPhone=localStorage.getItem('ne_demo_phone')||'';const mobileInput=document.getElementById('mobileInput');if(mobileInput&&savedPhone)mobileInput.value=savedPhone;
  const maskPhone=(phone)=>{const d=String(phone||'').replace(/\D/g,'').slice(-10);return d.length===10?'+91 ••••• '+d.slice(-5):'+91 ••••• •••••'};
  const baseLogin=login;
  login=function(){
    const mobile=(document.getElementById('mobileInput')?.value||'').replace(/\D/g,'').slice(-10);
    const pinValue=(document.getElementById('pinInput')?.value||'').replace(/\D/g,'');
    const err=document.getElementById('loginError');
    if(mobile.length!==10){if(err)err.textContent='Enter a valid 10-digit registered mobile number.';document.getElementById('mobileInput')?.focus();return;}
    if(pinValue.length!==4){if(err)err.textContent='Enter your 4-digit PIN.';document.getElementById('pinInput')?.focus();return;}
    if(pinValue!=='1234'){if(err)err.textContent='Incorrect demo PIN. Use 1234.';return;}
    if(err)err.textContent='';state.demoPhone=mobile;localStorage.setItem('ne_demo_phone',mobile);baseLogin();
    const ap=document.getElementById('accountPhone');if(ap)ap.textContent=maskPhone(mobile);
  };
  [document.getElementById('mobileInput'),document.getElementById('pinInput')].forEach(el=>el&&el.addEventListener('keydown',e=>{if(e.key==='Enter')login()}));

  const oldGo=go;
  go=function(name,reset=false){ oldGo(name,reset); if(name==='tracking') renderTracking(); if(name==='orders') renderOrders(); if(name==='home') syncDeliveryUI(); };

  function deliveryStates(){return [['Confirmed','Order has been confirmed'],['Packed','Coconuts are packed'],['Out for Delivery','Order is on the way'],['Delivered','Order has been delivered']]}
  currentDeliveryStep=function(){const elapsed=Math.max(0,Date.now()-Number(state.orderPlacedAt||Date.now()));return Math.min(3,Math.floor(elapsed/DEMO_STAGE_MS))};
  syncDeliveryUI=function(){
    state.deliveryStep=currentDeliveryStep();
    const stages=deliveryStates(); const stage=stages[state.deliveryStep];
    const heading=document.querySelector('[data-screen="home"] .section-heading h2'); if(heading) heading.textContent='Latest order';
    const pill=document.querySelector('[data-screen="home"] .section-heading .pill'); if(pill) pill.textContent=stage[0].toUpperCase();
    const delivery=document.querySelector('[data-screen="home"] .delivery');
    if(delivery){const strong=delivery.querySelector('strong'); if(strong) strong.textContent=(state.orderQty||200)+' Tender Coconuts'; const spans=delivery.querySelectorAll('span,small'); if(spans[0])spans[0].textContent='Order '+state.orderId; if(spans[1])spans[1].textContent=stage[1]; const bar=delivery.querySelector('.mini-progress i');if(bar)bar.style.width=((state.deliveryStep+1)/4*100)+'%'}
    if(document.querySelector('[data-screen="tracking"].active'))renderTracking(false);
    if(document.querySelector('[data-screen="orders"].active'))renderOrders();
  };

  renderTracking=function(sync=true){
    if(sync)state.deliveryStep=currentDeliveryStep();
    document.getElementById('trackOrderId').textContent='Order '+state.orderId;
    const stages=deliveryStates();
    document.getElementById('stepper').innerHTML=stages.map((st,i)=>'<div class="step '+(i<=state.deliveryStep?'done':'')+'"><i>'+(i<state.deliveryStep?'✓':i+1)+'</i><div><strong>'+st[0]+'</strong><small>'+st[1]+'</small></div></div>').join('');
    document.getElementById('trackEta').textContent=state.deliveryStep===3?'Delivered':'Today, 4:30 PM';
    document.getElementById('trackSub').textContent=state.deliveryStep===3?'Delivery completed':stages[state.deliveryStep][1];
    const note=document.querySelector('[data-screen="tracking"] .legal');if(note){note.className='track-note';note.textContent='Demo status updates automatically. Production will use actual operations / dispatch status.'}
  };
  setDeliveryStep=function(){/* manual tracking disabled */};

  const originalPlaceOrder=placeOrder;
  placeOrder=function(){
    if(!Object.keys(state.cart).length)return toast('Add products first');
    state.orderId='NE-DEMO-'+String(Date.now()).slice(-6);
    state.orderPlacedAt=Date.now(); state.deliveryStep=0;
    state.orderQty=Object.entries(state.cart).reduce((sum,[id,qty])=>sum+Number(qty||0),0);
    const total=cartTotals();
    document.getElementById('confirmOrderId').textContent=state.orderId;
    document.getElementById('confirmTotal').textContent=money(total);
    document.getElementById('confirmDate').textContent=document.getElementById('deliveryDate').value||'Selected date';
    go('confirmation');
  };

  updateCartBadge=function(){const count=Object.keys(state.cart).length;const badge=document.getElementById('cartBadge');badge.textContent=count;badge.style.display=count?'grid':'none'};
  renderCart=function(){
    const list=document.getElementById('cartList'),actions=document.getElementById('cartActions'),items=Object.entries(state.cart);
    if(!items.length){list.innerHTML='<div class="empty"><div class="big">🛒</div><h3>Your cart is empty</h3><p>Add coconuts to start an order.</p></div>';actions.innerHTML='<button class="btn block" onclick="go(\'products\')">Browse products</button>';updateCartBadge();return}
    list.innerHTML=items.map(([id,qty])=>{const p=products.find(x=>x.id===id);return '<article class="cart-item"><img src="'+p.img+'" alt=""><div><h3>'+p.name+'</h3><p>'+money(p.price)+' / piece</p><div class="qty"><button onclick="cartQty(\''+p.id+'\',-10)">−</button><strong>'+qty+'</strong><button onclick="cartQty(\''+p.id+'\',10)">+</button></div></div><div><strong style="font-size:11px">'+money(p.price*qty)+'</strong><button class="icon-btn danger" onclick="removeCart(\''+p.id+'\')">×</button></div></article>'}).join('');
    const sub=cartTotals();
    actions.innerHTML='<button class="btn block outline" onclick="go(\'products\')">+ Continue shopping</button><div class="totals"><div><span>Products</span><strong>'+money(sub)+'</strong></div><div><span>Delivery</span><strong>Included</strong></div><div class="grand"><span>Order total</span><strong>'+money(sub)+'</strong></div></div><button class="btn block" onclick="go(\'checkout\')">Proceed to checkout →</button>';
    updateCartBadge();
  };
  renderCheckout=function(){const box=document.getElementById('checkoutSummary');box.innerHTML=Object.entries(state.cart).map(([id,qty])=>{const p=products.find(x=>x.id===id);return '<div class="row-between" style="font-size:10px;padding:5px 0"><span>'+p.name+' × '+qty+'</span><strong>'+money(p.price*qty)+'</strong></div>'}).join('')+'<div class="row-between" style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:13px"><span>Total</span><strong>'+money(cartTotals())+'</strong></div>'};

  products.forEach(p=>p.img='../assets/direct-delivery-v2.webp');
  renderProducts=function(){
    const q=(document.getElementById('productSearch').value||'').toLowerCase();
    const list=document.getElementById('productList');
    const shown=products.filter(p=>p.name.toLowerCase().includes(q));
    list.innerHTML=shown.map(p=>{const qty=state.listQty[p.id]||p.moq;return '<article class="product-card"><button style="border:0;padding:0;background:none" onclick="openProduct(\''+p.id+'\')"><img src="'+p.img+'" alt="'+p.name+'"></button><div class="product-body"><div><h3 onclick="openProduct(\''+p.id+'\')">'+p.name+'</h3><p>'+p.detail+'</p><div class="product-note">Tap product for details</div></div><div class="buy-row"><div class="price"><strong>'+money(p.price)+'</strong><span>/ piece • MOQ '+p.moq+'</span></div><div><div class="qty"><button '+(qty<=p.moq?'disabled':'')+' onclick="listQty(\''+p.id+'\',-10)">−</button><strong>'+qty+'</strong><button onclick="listQty(\''+p.id+'\',10)">+</button></div><button class="btn small" style="margin-top:6px;width:100%" onclick="addListToCart(\''+p.id+'\')">'+(state.cart[p.id]?'✓ Added':'+ Add')+'</button></div></div></div></article>'}).join('')||'<div class="empty"><h3>No products found</h3><p>Try another search.</p></div>';
  };

  renderSchemes=function(){
    document.getElementById('activeSchemesTab').classList.toggle('active',state.schemeTab==='active');document.getElementById('benefitsTab').classList.toggle('active',state.schemeTab==='benefits');const box=document.getElementById('schemeContent');
    if(state.schemeTab==='benefits'){box.innerHTML='<div class="empty"><div class="big">🎁</div><h3>No benefits earned yet</h3><p>Completed scheme benefits will appear here.</p><button class="btn small" style="margin-top:12px" onclick="setSchemeTab(\'active\')">View active schemes</button></div>';return}
    if(!schemes.length){box.innerHTML='<div class="empty"><div class="big">🎯</div><h3>No active schemes</h3><p>Active schemes will appear here when available.</p></div>';return}
    box.innerHTML='<div class="row-between" style="font-size:9px;color:var(--muted);margin-bottom:8px"><span>'+schemes.length+' active schemes</span><span>Demo data</span></div>'+schemes.map(sc=>{const pct=Math.round(sc.progress/sc.total*100);return '<article class="scheme"><div class="scheme-top"><div class="scheme-icon">'+sc.icon+'</div><div><h3>'+sc.name+'</h3></div><b style="font-size:12px;color:var(--green)">'+pct+'%</b></div><p>'+sc.target+'</p><div class="progress"><i style="width:'+pct+'%"></i></div><div class="progress-label"><span>'+sc.progress.toLocaleString('en-IN')+' completed</span><strong>'+sc.total.toLocaleString('en-IN')+'</strong></div><div class="reward"><div>🎁</div><div><small>REWARD</small><strong>'+sc.reward+'</strong></div></div></article>'}).join('');
  };

  renderOrders=function(){document.getElementById('orderActiveTab').classList.toggle('active',state.ordersTab==='active');document.getElementById('orderPastTab').classList.toggle('active',state.ordersTab==='past');const box=document.getElementById('ordersContent');if(state.ordersTab==='past'){box.innerHTML='<div class="empty"><div class="big">📦</div><h3>No past orders</h3><p>Delivered orders will appear here.</p><button class="btn small" style="margin-top:12px" onclick="go(\'products\')">Browse products</button></div>';return}state.deliveryStep=currentDeliveryStep();const status=deliveryStates()[state.deliveryStep][0];box.innerHTML='<article class="order-card"><div class="row-between"><span class="pill">'+status.toUpperCase()+'</span><small class="muted">Today</small></div><h3>'+state.orderId+'</h3><p>'+(state.orderQty||200)+' Tender Coconuts</p><div class="mini-progress"><i style="width:'+((state.deliveryStep+1)/4*100)+'%"></i></div><button class="btn block" onclick="go(\'tracking\')">🚚 Track delivery</button></article>'};

  const voiceTitle=document.querySelector('.sheet-head h3');if(voiceTitle)voiceTitle.textContent='Ask NE';
  const voiceSub=document.querySelector('.sheet-head p');if(voiceSub)voiceSub.textContent='Speak naturally — NE will open the right section or add your issue to Support.';
  const voiceFabLabel=document.querySelector('.voice-label');if(voiceFabLabel)voiceFabLabel.textContent='Ask NE';
  const labels=[...document.querySelectorAll('#voiceBackdrop .field-label')];if(labels[0])labels[0].textContent='Choose language';if(labels[1])labels[1].textContent='What I heard';
  const auto=document.querySelector('#voiceLang option[value="auto"]');if(auto)auto.textContent='Automatic';
  const voiceStatus=document.getElementById('voiceStatus');if(voiceStatus)voiceStatus.textContent='Tap the mic and speak';
  const help=document.querySelector('.voice-help');if(help)help.textContent='Try: “Place an order”, “Track my order”, “Show schemes”, “Check credit”, “I need support”';
  const listen=document.getElementById('listenBtn');if(listen)listen.textContent='🎙️ Start speaking';
  const voiceText=document.getElementById('voiceText');if(voiceText)voiceText.placeholder='Speak or type what you need…';
  const intentSmall=document.querySelector('.intent-box small');if(intentSmall)intentSmall.textContent='NE UNDERSTOOD';
  const intent=document.getElementById('intentLabel');if(intent)intent.textContent='Waiting for you';
  const note=document.querySelector('.voice-note');if(note)note.textContent='Voice accuracy depends on your browser and device. If the microphone is unavailable, type your request above.';

  detectIntent=function(text){const t=normalize(text);const defs=[
    {id:'tracking',label:'Track my order',words:['track delivery','track order','delivery status','eta','where is my order','ಡೆಲಿವರಿ','ಟ್ರ್ಯಾಕ್','ఎక్కడ','డెలివరీ','ట్రాక్','डिलीवरी','ट्रैक']},
    {id:'orders',label:'Orders',words:['my orders','order status','orders','ನನ್ನ ಆರ್ಡರ್','నా ఆర్డర్','मेरे ऑर्डर']},
    {id:'products',label:'Order coconuts',words:['place order','buy','order coconut','products','price','ಖರೀದಿ','ಆರ್ಡರ್','కొనాలి','ఆర్డర్','खरीद','ऑर्डर']},
    {id:'cart',label:'Cart',words:['cart','basket','ಕಾರ್ಟ್','కార్ట్','कार्ट']},
    {id:'schemes',label:'Schemes',words:['scheme','offer','benefit','target','ಸ್ಕೀಮ್','ಆಫರ್','స్కీమ్','ఆఫర్','स्कीम','ऑफर']},
    {id:'payments',label:'Payments & credit',words:['payment','credit','balance','invoice','ಪಾವತಿ','ಕ್ರೆಡಿಟ್','చెల్లింపు','క్రెడిట్','भुगतान','क्रेडिट']},
    {id:'support',label:'Support',words:['help','support','problem','complaint','issue','ಸಹಾಯ','ಸಮಸ್ಯೆ','సహాయం','సమస్య','मदद','समस्या']}
  ];return defs.find(d=>d.words.some(w=>t.includes(w)))||null};
  detectIntentUI=function(){const text=document.getElementById('voiceText').value;const found=detectIntent(text);state.voiceIntent=found;document.getElementById('intentLabel').textContent=found?found.label:(text.trim()?'I’m not sure yet — edit the request or send it to Support':'Waiting for you');document.getElementById('voiceActionBtn').textContent=state.voiceContext==='support'?'Add to ticket':found?('Go to '+found.label):'Send to Support'};

  const account=document.querySelector('[data-screen="account"] .scroll');if(account)account.innerHTML='<div class="profile"><div class="avatar">NE</div><div><span>REGISTERED VENDOR</span><h2>Native Elaneeru Vendor</h2><p>Vendor profile</p></div><div>✓</div></div><div class="menu-label">PROFILE</div><div class="menu-row"><div>👤</div><span><strong>Vendor profile</strong><small>Profile details from approved vendor record</small></span><div></div></div><div class="menu-row"><div>🏪</div><span><strong>Shop details</strong><small>Your approved shop information</small></span><div></div></div><div class="menu-row"><div>📍</div><span><strong>Delivery addresses</strong><small>Saved delivery location</small></span><div></div></div><div class="menu-row"><div>🔒</div><span><strong id="accountPhone">+91 ••••• •••••</strong><small>Registered phone • locked</small></span><div></div></div><div class="menu-label">BUSINESS</div><button class="menu-row" onclick="go(\'payments\')"><div>💳</div><span><strong>Payments & Credit</strong><small>₹0 current balance</small></span><div>›</div></button><button class="menu-row" onclick="go(\'schemes\')"><div>🎯</div><span><strong>Schemes & Benefits</strong><small>View active schemes</small></span><div>›</div></button><button class="menu-row" onclick="go(\'notifications\')"><div>🔔</div><span><strong>Notifications</strong><small>Order and scheme updates</small></span><div>›</div></button><div class="menu-label">ASSISTANT & SUPPORT</div><button class="menu-row" onclick="openVoice(\'global\')"><div>🎙️</div><span><strong>Ask NE</strong><small>Speak or type a request</small></span><div>›</div></button><button class="menu-row" onclick="go(\'support\')"><div>🛟</div><span><strong>Help & Support</strong><small>Create a demo NE AI ticket</small></span><div>›</div></button><div class="account-note">Demo profile fields are placeholders only. Production values will come from the approved vendor record and cannot be edited here unless allowed by admin.</div><button class="btn block outline" style="margin-top:8px;color:#b43838" onclick="logout()">↪ Logout</button><div class="legal">Native Elaneeru B2B Demo + Voice</div>';

  const qActions=[...document.querySelectorAll('[data-screen="home"] .quick')];const voiceQuick=qActions.find(b=>b.textContent.includes('Voice help'));if(voiceQuick){voiceQuick.querySelector('strong').textContent='Ask NE';voiceQuick.setAttribute('onclick',"openVoice('global')")}
  const h2=document.querySelector('[data-screen="home"] .section-heading h2');if(h2)h2.textContent='Latest order';

  const accountPhone=document.getElementById('accountPhone');if(accountPhone)accountPhone.textContent=maskPhone(state.demoPhone||savedPhone);
  renderProducts();renderSchemes();renderOrders();updateCartBadge();syncDeliveryUI();
  setInterval(()=>{if(state.loggedIn)syncDeliveryUI()},1000);
})();`;
  html=html.replace('</style>',css+'\n</style>');
  html=html.replace('</body>','<script>'+patch+'<\\/script></body>');
  document.open();document.write(html);document.close();
})().catch(err=>{document.body.innerHTML='<div style="padding:32px;font:600 14px system-ui;color:#a33">Unable to load demo. Please refresh.<br><small>'+String(err.message||err)+'</small></div>'});
</script>
</body>
</html>
