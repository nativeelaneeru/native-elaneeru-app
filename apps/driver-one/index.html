<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075738"><title>Native Elaneeru | Driver One</title>
<style>
:root{--green:#075738;--soft:#e8f4eb;--ink:#162620;--muted:#65776d;--line:#deebe1}*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:white}.pale{background:var(--soft);color:var(--green)}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}.top{background:var(--green);color:#fff;padding:24px 18px 20px;border-radius:0 0 24px 24px}.top small{opacity:.85}.top h1{font-size:23px;margin:8px 0 4px}.demo{background:#fff1c9;border:1px solid #f2d68b;color:#755119;padding:10px 13px;border-radius:12px;font-size:12px;margin:13px 15px}.section{padding:0 15px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 5px 18px #123b1e0a}.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.pill{border-radius:20px;background:var(--soft);color:var(--green);padding:5px 9px;font-weight:700;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef6ee;padding:13px 8px;text-align:center;border-radius:13px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted);font-size:11px}.bar{background:#e3eee4;height:9px;border-radius:50px;overflow:hidden;margin:13px 0}.bar i{display:block;background:#0b8752;height:100%;width:0;transition:width .2s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{font-size:13px}.stop{border-left:5px solid #0c7547}.stop.done{border-left-color:#b0c2b7}.number{display:inline-grid;place-items:center;border-radius:50%;background:var(--green);color:#fff;width:30px;height:30px;font-weight:700}.field{width:100%;padding:11px;border:1px solid #cad9ce;border-radius:10px;margin:6px 0 10px;background:white}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 10px 15px;z-index:4}.tabs button{background:none;color:var(--muted);font-size:12px;padding:8px}.tabs button.selected{color:var(--green);background:var(--soft)}h2{font-size:17px;margin:15px 0 7px}.hidden{display:none}.block{width:100%}.danger{color:#9a342a}.margin{margin-top:10px}a{color:var(--green)}
</style></head><body><main class="app"><header class="top"><div class="spread"><strong>🥥 NATIVE ELANEERU</strong><span style="font-size:12px">DRIVER ONE</span></div><h1>Good morning, Arvind</h1><small>KA04MA2128 · B2B delivery · 25 Oct 2026</small></header>
<div class="demo">PROTOTYPE ONLY — Changes stay in this browser. No operations sheets, delivery records, stock, or payments are updated.</div>
<div class="section"><div id="home"></div><div id="deliveries" class="hidden"></div><div id="settlement" class="hidden"></div></div>
<nav class="tabs"><button id="tab-home" class="selected" onclick="tab('home')">⌂<br>Dashboard</button><button id="tab-deliveries" onclick="tab('deliveries')">☷<br>Stops</button><button id="tab-settlement" onclick="tab('settlement')">₹<br>Settlement</button></nav></main>
<script>
const HUB=[12.809051894563096,77.59800019834104];
const routeId='RB-MANUAL-261025-ARVIND-01';
const stops=[
{id:'ST-MANUAL-261025-ARV-1',name:'Basavaju Coconut',where:'Ragihalli Gate, Bannerghatta',qty:100,amount:4000,phone:'7259978398',lat:12.799979,lng:77.599729},
{id:'ST-MANUAL-261025-ARV-2',name:'Chinna Swamy',where:'Opposite Kafe Khadya',qty:500,amount:21500,phone:'9980895878',lat:12.91051905,lng:77.5991026},
{id:'ST-MANUAL-261025-ARV-3',name:'Manjunath',where:'BTM 1st Stage, behind KEB office',qty:300,amount:12900,phone:'9844441204',lat:12.9172285,lng:77.6103711},
{id:'ST-MANUAL-261025-ARV-4',name:'Bagyamma',where:'Banashankari 2nd Stage, 27th Cross',qty:200,amount:8600,phone:'9900621028',lat:12.922504,lng:77.5658129}
];
const initial={loaded:false,items:stops.map(s=>({status:'PENDING',delivered:0,method:'Cash',paid:0,note:''}))};
let state;try{state=JSON.parse(localStorage.getItem('ne_driver_one_demo')||'null')||initial;if(!Array.isArray(state.items)||state.items.length!==4)state=initial}catch(e){state=initial}
const el=id=>document.getElementById(id);const fmt=n=>Number(n).toLocaleString('en-IN');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem('ne_driver_one_demo',JSON.stringify(state));render()};
const count=()=>state.items.filter(x=>x.status==='DELIVERED').length;
const qty=()=>state.items.reduce((a,x)=>a+Number(x.delivered||0),0);
const collected=()=>state.items.reduce((a,x)=>a+Number(x.paid||0),0);
function nav(lat,lng){window.open('https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=driving','_blank','noopener')}
function fullRoute(){window.open('https://www.google.com/maps/dir/?api=1&origin='+HUB.join(',')+'&destination='+stops[3].lat+','+stops[3].lng+'&waypoints='+stops.slice(0,3).map(s=>s.lat+','+s.lng).join('%7C')+'&travelmode=driving','_blank','noopener')}
function tab(t){for(const x of ['home','deliveries','settlement']){el(x).classList.toggle('hidden',x!==t);el('tab-'+x).classList.toggle('selected',x===t)}}
function load(){state.loaded=!state.loaded;save()}
function update(i){const s=stops[i],old=state.items[i];const status=el('status'+i).value,delivered=Number(el('qty'+i).value),paid=Number(el('paid'+i).value),method=el('method'+i).value,note=el('note'+i).value;
if(!state.loaded)return alert('Mark the vehicle loaded first.');
if(!Number.isInteger(delivered)||delivered<0||delivered>s.qty)return alert('Enter a valid delivered quantity up to '+s.qty);
if(!Number.isFinite(paid)||paid<0||paid>s.amount)return alert('Enter a valid collection amount.');
if(status==='DELIVERED'&&delivered===0)return alert('Enter delivered quantity.');
state.items[i]={status,delivered,paid,method,note};save();alert('Demo updated locally only. No live delivery or payment recorded.')}
function reset(){if(confirm('Reset the local demonstration?')){state=JSON.parse(JSON.stringify(initial));save()}}
function render(){const total=stops.reduce((a,s)=>a+s.qty,0),cash=collected(),done=count();
el('home').innerHTML='<section class="card"><div class="spread"><div><div class="muted">Assigned trip</div><h2>'+routeId+'</h2></div><span class="pill">PLANNED</span></div><div class="stats"><div class="stat"><b>'+stops.length+'</b><small>Stops</small></div><div class="stat"><b>'+fmt(total)+'</b><small>Load qty</small></div><div class="stat"><b>'+done+'/4</b><small>Delivered</small></div></div><div class="bar"><i style="width:'+done*25+'%"></i></div><div class="spread"><span class="muted">Vehicle capacity 1,800</span><b>'+fmt(1800-total)+' spare</b></div></section><section class="card"><div class="spread"><div><h2>Loading checklist</h2><div class="muted">Manual order • Hub dispatch</div></div><span class="pill">'+(state.loaded?'LOADED':'NOT LOADED')+'</span></div><p>Verify 1,100 coconuts and bunch loading at the hub before departure.</p><button class="block '+(state.loaded?'pale':'primary')+'" onclick="load()">'+(state.loaded?'Undo demo load':'Mark loaded (demo)')+'</button></section><section class="card"><h2>Route plan</h2><div class="muted">Sequence is provisional; live-traffic optimization not verified.</div><button class="primary block margin" onclick="fullRoute()">🧭 Open complete route in Maps</button><button class="pale block margin" onclick="tab(\'deliveries\')">View all 4 stops →</button></section>';
el('deliveries').innerHTML='<h2>Today's delivery stops</h2>'+stops.map((s,i)=>{const x=state.items[i];return '<section class="card stop '+(x.status==='DELIVERED'?'done':'')+'"><div class="spread"><div><span class="number">'+(i+1)+'</span> <strong>'+esc(s.name)+'</strong></div><span class="pill">'+esc(x.status)+'</span></div><p class="muted">'+esc(s.where)+'</p><div class="spread"><strong>'+fmt(s.qty)+' coconuts</strong><strong>₹'+fmt(s.amount)+'</strong></div><div class="actions"><button class="pale" onclick="nav('+s.lat+','+s.lng+')">🧭 Navigate</button><button class="pale" onclick="location.href=\'tel:'+s.phone+'\'">📞 Call</button></div><div class="margin"><label class="muted">Delivery outcome</label><select class="field" id="status'+i+'"><option '+(x.status==='PENDING'?'selected':'')+'>PENDING</option><option '+(x.status==='DELIVERED'?'selected':'')+'>DELIVERED</option><option '+(x.status==='PARTIAL'?'selected':'')+'>PARTIAL</option><option '+(x.status==='FAILED'?'selected':'')+'>FAILED</option></select><label class="muted">Actual delivered quantity</label><input class="field" id="qty'+i+'" type="number" min="0" max="'+s.qty+'" value="'+x.delivered+'"><label class="muted">Collection mode</label><select class="field" id="method'+i+'"><option '+(x.method==='Cash'?'selected':'')+'>Cash</option><option '+(x.method==='UPI'?'selected':'')+'>UPI</option><option '+(x.method==='Pending'?'selected':'')+'>Pending</option></select><label class="muted">Amount collected (₹)</label><input class="field" id="paid'+i+'" type="number" min="0" max="'+s.amount+'" value="'+x.paid+'"><label class="muted">Driver notes</label><input class="field" id="note'+i+'" maxlength="200" value="'+esc(x.note)+'"><button class="primary block" onclick="update('+i+')">Save demo stop</button></div></section>'}).join('');
el('settlement').innerHTML='<section class="card"><h2>Trip settlement</h2><div class="stats"><div class="stat"><b>₹'+fmt(47000)+'</b><small>Order value</small></div><div class="stat"><b>₹'+fmt(cash)+'</b><small>Demo collected</small></div><div class="stat"><b>'+fmt(qty())+'</b><small>Demo delivered qty</small></div></div><p class="muted">Collection entries here are local simulation only. Cash and UPI are not reconciled with a payment gateway or V8.</p><div class="spread"><span>Uncollected / unconfirmed</span><b>₹'+fmt(47000-cash)+'</b></div></section><section class="card"><h2>Go-live checks</h2><p>Connect manual orders to authenticated driver routes, backend proofs of delivery, GPS events and payment reconciliation before enabling real submissions.</p><button class="pale block" onclick="reset()">Reset demo data</button></section>';}
render();
</script></body></html>
