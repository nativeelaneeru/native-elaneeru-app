<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075738"><title>Native Elaneeru | Driver One</title>
<style>
:root{--green:#075738;--soft:#e8f4eb;--ink:#162620;--muted:#65776d;--line:#deebe1}*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--green);color:white}.pale{background:var(--soft);color:var(--green)}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:88px}.top{background:var(--green);color:#fff;padding:24px 18px 20px;border-radius:0 0 24px 24px}.top small{opacity:.85}.top h1{font-size:23px;margin:8px 0 4px}.demo{background:#fff1c9;border:1px solid #f2d68b;color:#755119;padding:10px 13px;border-radius:12px;font-size:12px;margin:13px 15px}.section{padding:0 15px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 5px 18px #123b1e0a}.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.pill{border-radius:20px;background:var(--soft);color:var(--green);padding:5px 9px;font-weight:700;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#eef6ee;padding:13px 8px;text-align:center;border-radius:13px}.stat b{display:block;font-size:23px}.stat small{color:var(--muted);font-size:11px}.bar{background:#e3eee4;height:9px;border-radius:50px;overflow:hidden;margin:13px 0}.bar i{display:block;background:#0b8752;height:100%;width:0;transition:width .2s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{font-size:13px}.stop{border-left:5px solid #0c7547}.stop.done{border-left-color:#b0c2b7}.number{display:inline-grid;place-items:center;border-radius:50%;background:var(--green);color:#fff;width:30px;height:30px;font-weight:700}.field{width:100%;padding:11px;border:1px solid #cad9ce;border-radius:10px;margin:6px 0 10px;background:white}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:white;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 10px 15px;z-index:4}.tabs button{background:none;color:var(--muted);font-size:12px;padding:8px}.tabs button.selected{color:var(--green);background:var(--soft)}h2{font-size:17px;margin:15px 0 7px}.hidden{display:none}.block{width:100%}.danger{color:#9a342a}.margin{margin-top:10px}a{color:var(--green)}
</style></head><body><main class="app"><header class="top"><div class="spread"><strong>🥥 NATIVE ELANEERU</strong><span style="font-size:12px">DRIVER ONE</span></div><h1>Good morning, Arvind</h1><small>KA04MA2128 · B2B delivery · 25 Oct 2026</small></header>
<div class="demo">PROTOTYPE ONLY — Changes stay in this browser. No operations sheets, delivery records, stock, or payments are updated.</div>
<div class="section"><div style="padding-top:12px"><a href="./dispatch.html">📥 Import Excel / CSV customer route</a></div><div id="home"></div><div id="deliveries" class="hidden"></div><div id="settlement" class="hidden"></div></div>
<nav class="tabs"><button id="tab-home" class="selected" onclick="tab('home')">⌂<br>Dashboard</button><button id="tab-deliveries" onclick="tab('deliveries')">☷<br>Stops</button><button id="tab-settlement" onclick="tab('settlement')">₹<br>Settlement</button></nav></main>
<script>
let stops=[
{name:"Basavaju Coconut",area:"Ragihalli Gate, Bannerghatta",qty:100,amount:4000,phone:"7259978398",lat:12.799979,lng:77.599729},
{name:"Chinna Swamy",area:"Opposite Kafe Khadya",qty:500,amount:21500,phone:"9980895878",lat:12.91051905,lng:77.5991026},
{name:"Manjunath",area:"BTM 1st Stage",qty:300,amount:12900,phone:"9844441204",lat:12.9172285,lng:77.6103711},
{name:"Bagyamma",area:"Banashankari 2nd Stage",qty:200,amount:8600,phone:"9900621028",lat:12.922504,lng:77.5658129}
];
let route="RB-MANUAL-261025-ARVIND-01";const key="nel_driver_one_v2_demo";let imported=false;try{const x=JSON.parse(localStorage.getItem("nel_driver_one_imported_route")||"null");if(x&&Array.isArray(x.stops)&&x.stops.length>0&&x.stops.length<=200){stops=x.stops;route="DEMO-IMPORTED-ROUTE";imported=true}}catch(e){}
const fresh=()=>({loaded:false,started:false,closed:false,items:stops.map(()=>({status:"PENDING",delivered:0,paid:0,method:"Cash",note:""}))});
let state=fresh();try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved&&Array.isArray(saved.items)&&saved.items.length===stops.length&&!imported)state=saved}catch(e){}
const el=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString("en-IN");
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const persist=()=>{localStorage.setItem(key,JSON.stringify(state));render()};
function tab(name){for(const t of ["home","deliveries","settlement"]){el(t).classList.toggle("hidden",name!==t);el("tab-"+t).classList.toggle("selected",name===t)}}
function openMap(i){const s=stops[i];window.open("https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng+"&travelmode=driving","_blank","noopener")}
function wholeRoute(){const s=stops[0];if(!s)return;window.open("https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng+"&travelmode=driving","_blank","noopener")}
function loading(){if(state.started)return alert("Trip already started");state.loaded=!state.loaded;persist()}
function begin(){if(!state.loaded)return alert("Confirm loading first");if(stops.reduce((n,s)=>n+s.qty,0)>1800)return alert("Load exceeds vehicle capacity 1,800");state.started=true;persist();tab("deliveries")}
function saveStop(i){
if(!state.started||state.closed)return alert("Trip must be active");
const s=stops[i],status=el("status"+i).value,q=Number(el("qty"+i).value),p=Number(el("paid"+i).value),method=el("method"+i).value,note=el("note"+i).value;
if(!Number.isInteger(q)||q<0||q>s.qty)return alert("Check delivered quantity");
if(!Number.isFinite(p)||p<0||p>s.amount)return alert("Check collected amount");
if(status==="DELIVERED"&&q!==s.qty)return alert("Full delivery requires full ordered quantity");
if(status==="PARTIAL"&&(q<1||q>=s.qty))return alert("Check partial quantity");
if(status==="FAILED"&&(q!==0||p!==0))return alert("Failed stop cannot have delivery or collection");
if(status==="PENDING"&&(q!==0||p!==0))return alert("Pending stop cannot have delivery or collection");
state.items[i]={status,delivered:q,paid:p,method,note};persist();alert("Saved locally in demo only")
}
function closeTrip(){if(!state.started||state.closed)return;if(state.items.some(x=>x.status==="PENDING"))return alert("Resolve all four stops first");state.closed=true;persist()}
function reset(){if(confirm("Reset local demo data?")){state=fresh();persist();tab("home")}}
function render(){
const done=state.items.filter(x=>x.status==="DELIVERED"||x.status==="PARTIAL").length,delivered=state.items.reduce((n,x)=>n+x.delivered,0),paid=state.items.reduce((n,x)=>n+x.paid,0),totalQty=stops.reduce((n,s)=>n+s.qty,0),totalAmt=stops.reduce((n,s)=>n+s.amount,0);
el("home").innerHTML=`<section class="card"><div class="spread"><h2>Today's Trip</h2><span class="pill">${state.closed?"CLOSED":state.started?"IN PROGRESS":"PLANNED"}</span></div><p class="muted">${route}</p><div class="stats"><div class="stat"><b>${stops.length}</b><small>Stops</small></div><div class="stat"><b>${fmt(totalQty)}</b><small>Coconuts</small></div><div class="stat"><b>${done}/${stops.length}</b><small>Completed</small></div></div><div class="bar"><i style="width:${done/stops.length*100}%"></i></div></section><section class="card"><h2>Vehicle Loading</h2><p>Arvind · KA04MA2128 · Capacity 1,800 coconuts</p><p>Required load ${fmt(totalQty)} · Spare ${fmt(1800-totalQty)}</p><button class="pale block" ${state.started?"disabled":""} onclick="loading()">${state.loaded?"Loading confirmed":"Confirm loading (demo)"}</button><button class="primary block margin" ${!state.loaded||state.started?"disabled":""} onclick="begin()">Start trip</button></section><section class="card"><h2>Navigation</h2><button class="primary block" onclick="wholeRoute()">Open route in Google Maps</button><p class="muted">Route order follows the Excel row order; not road/traffic optimized.</p></section>`;
el("deliveries").innerHTML="<h2>Assigned Deliveries</h2>"+stops.map((s,i)=>{const x=state.items[i];return `<section class="card stop"><div class="spread"><strong><span class="number">${i+1}</span> ${escapeHtml(s.name)}</strong><span class="pill">${x.status}</span></div><p class="muted">${escapeHtml(s.area)}</p><div class="spread"><strong>${s.qty} coconuts</strong><strong>₹${fmt(s.amount)}</strong></div><div class="actions"><button class="pale" onclick="openMap(${i})">🧭 Navigate</button><button class="pale" onclick="location.href='tel:${s.phone}'">📞 Call</button></div><label class="muted">Delivery status</label><select class="field" id="status${i}">${["PENDING","DELIVERED","PARTIAL","FAILED"].map(v=>`<option ${v===x.status?"selected":""}>${v}</option>`).join("")}</select><label class="muted">Delivered quantity</label><input class="field" type="number" min="0" max="${s.qty}" id="qty${i}" value="${x.delivered}"><label class="muted">Payment mode</label><select class="field" id="method${i}">${["Cash","UPI","Pending"].map(v=>`<option ${v===x.method?"selected":""}>${v}</option>`).join("")}</select><label class="muted">Collected amount (₹)</label><input class="field" type="number" min="0" max="${s.amount}" id="paid${i}" value="${x.paid}"><label class="muted">Delivery remarks</label><input class="field" id="note${i}" maxlength="200" value="${escapeHtml(x.note)}"><button class="primary block" ${!state.started||state.closed?"disabled":""} onclick="saveStop(${i})">Save delivery (demo)</button><p class="muted">No OTP or invoice printing. Real photo/signature and GPS proofs require backend integration.</p></section>`}).join("");
el("settlement").innerHTML=`<section class="card"><h2>Trip settlement</h2><div class="stats"><div class="stat"><b>₹${fmt(totalAmt)}</b><small>Order value</small></div><div class="stat"><b>₹${fmt(paid)}</b><small>Demo collected</small></div><div class="stat"><b>${delivered}</b><small>Delivered</small></div></div><p>Undelivered / return quantity: <strong>${totalQty-delivered}</strong></p><p>Uncollected / pending amount: <strong>₹${fmt(totalAmt-paid)}</strong></p><button class="primary block" ${!state.started||state.closed||state.items.some(x=>x.status==="PENDING")?"disabled":""} onclick="closeTrip()">${state.closed?"Trip closed":"Close trip (demo)"}</button></section><section class="card"><p class="muted">All entries are stored only in this browser. No changes are sent to V8 Operations, payment ledgers or live driver dispatch.</p><button class="pale block" onclick="reset()">Reset demo</button></section>`;
}render();
</script></body></html>
