<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8f5;color:#17231a}.top{background:#fff;padding:14px 16px;border-bottom:1px solid #e2e8e2;position:sticky;top:0;z-index:4}.brand{font-weight:900;font-size:20px}.online{display:inline-block;background:#e6f6ea;color:#0b6b35;border-radius:20px;padding:5px 9px;font-size:11px;font-weight:900}.wrap{max-width:650px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e1e8e1;border-radius:18px;padding:15px;margin:11px 0;box-shadow:0 7px 22px #24312612}.hero{background:#0f6a3e;color:white}.big{font-size:24px;font-weight:900}.muted{font-size:12px;color:#6d786f}.hero .muted{color:#d9eee0}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,button{width:100%;padding:13px;border-radius:12px;border:1px solid #dbe4dc;font:inherit}button{border:0;background:#0f6a3e;color:#fff;font-weight:900}.secondary{background:#edf7f0;color:#0f6a3e}.hidden{display:none!important}.queue{display:flex;gap:7px;overflow:auto}.q{min-width:100px;background:#f2f6f2;padding:9px;border-radius:12px}.activeCard{border:2px solid #0f6a3e}.pill{background:#e9f7ee;color:#0c6338;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:520px){.row,.actions{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="brand">🥥 Native Elaneeru Delivery <span class="online">B2C</span></div></div><div class="wrap">
<div id="login" class="card"><div class="row"><input id="mobile" placeholder="Delivery partner mobile"><input id="pin" type="password" placeholder="PIN"></div><button style="margin-top:9px" onclick="login()">Go Online</button><div id="msg" class="muted" style="margin-top:7px"></div></div>
<div id="app" class="hidden"><div id="hero" class="card hero"></div><div id="active"></div><div class="card"><b>Next deliveries</b><div id="queue" class="queue" style="margin-top:10px"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);let MOB='',PIN='',DATA=null,WATCH=null,LAST=0;
function call(fn,args=[]){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message?e.message:e)))[fn](...args))}
async function login(){MOB=$('mobile').value.trim();PIN=$('pin').value.trim();try{await call('driverLoginV8',[MOB,PIN,'B2C']);$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh()}catch(e){$('msg').textContent=e.message}}
async function refresh(){DATA=await call('getDriverDayRouteV8',[MOB,PIN,'B2C',new Date().toISOString().slice(0,10)]);render()}
function render(){const r=DATA.route,s=DATA.stops||[];if(!r){$('hero').innerHTML='<div class="big">You’re all caught up 🎉</div><div class="muted">No B2C deliveries assigned right now.</div>';$('active').innerHTML='';$('queue').innerHTML='';return}const a=s.find(x=>!['COMPLETED','CANCELLED'].includes(x.status));
 $('hero').innerHTML=`<div class="muted">TODAY'S DELIVERY RUN</div><div class="big">${r.completedStops}/${r.totalStops} completed</div><div class="muted">${r.roadKm} road km • real-route sequence</div>`;
 $('active').innerHTML=a?`<div class="card activeCard"><span class="pill">CURRENT DELIVERY</span><h2>${esc(a.name)}</h2><div class="muted">${esc(a.address)}<br>${a.requiredQty} items • ${a.roadKm} km • ETA ${esc(a.eta)}</div><div class="actions"><button class="secondary" onclick="nav(${a.lat},${a.lng})">🧭 Navigate</button><button onclick="checkin('${a.stopId}')">I've Reached</button></div><div class="row" style="margin-top:9px"><input id="otp" placeholder="Customer OTP"><input id="remarks" placeholder="Remarks"></div><div class="actions"><button onclick="deliver('${a.stopId}')">✅ Mark Delivered</button><button class="secondary" onclick="checkout('${a.stopId}')">Finish & Next →</button></div></div>`:'';
 $('queue').innerHTML=s.filter(x=>a&&x.sequence>a.sequence&&x.status!=='COMPLETED').slice(0,4).map(x=>`<div class="q"><b>#${x.sequence}</b><div class="muted">${esc(x.name)}<br>${x.roadKm} km</div></div>`).join('')||'<div class="muted">No more deliveries.</div>'}
function pos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000}))}
async function checkin(id){try{const p=await pos();await call('driverCheckInV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude]);startGps(id);await refresh()}catch(e){alert(e.message)}}
async function deliver(id){try{const p=await pos();await call('driverDeliverV8',[MOB,PIN,'B2C',id,$('otp').value,p.coords.latitude,p.coords.longitude,$('remarks').value]);await refresh()}catch(e){alert(e.message)}}
async function checkout(id){try{const p=await pos();await call('driverCheckOutV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude]);stopGps();await refresh()}catch(e){alert(e.message)}}
function startGps(id){stopGps();WATCH=navigator.geolocation.watchPosition(async p=>{if(Date.now()-LAST<12000)return;LAST=Date.now();try{await call('updateDriverLiveV8',[MOB,PIN,'B2C',id,p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.heading||0])}catch(e){}},()=>{},{enableHighAccuracy:true,maximumAge:5000,timeout:20000})}
function stopGps(){if(WATCH!==null){navigator.geolocation.clearWatch(WATCH);WATCH=null}}
function nav(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
