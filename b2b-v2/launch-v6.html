<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087a3b">
<title>Native Elaneeru Business</title>
<style>html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#087a3b;color:#fff}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{width:min(100%,360px)}.mark{font-size:44px}.title{font-size:22px;font-weight:900;margin:10px 0 5px}.sub{font-size:12px;opacity:.82}.bar{height:7px;background:#ffffff2b;border-radius:99px;margin-top:22px;overflow:hidden}.bar i{display:block;height:100%;width:45%;background:#fff;border-radius:99px;animation:move 1s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-20%)}to{transform:translateX(150%)}}</style>
</head>
<body><main><div class="box"><div class="mark">🥥</div><div class="title">Native Elaneeru Business</div><div class="sub" id="status">Loading the corrected app…</div><div class="bar"><i></i></div></div></main>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('native-elaneeru-b2b-v2-')).map(k=>caches.delete(k)));}
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./sw.js?v=6',{scope:'./',updateViaCache:'none'});
      try{await reg.update()}catch(e){}
      if(reg.waiting)reg.waiting.postMessage('SKIP_WAITING');
      if(reg.installing){await new Promise(resolve=>{const w=reg.installing;const done=()=>{if(w.state==='activated'||w.state==='redundant')resolve()};w.addEventListener('statechange',done);setTimeout(resolve,3500)})}
    }
    status.textContent='Opening your app…';
  }catch(e){status.textContent='Opening your app…'}
  location.replace('./?build=6&fresh='+Date.now());
})();
</script></body></html>
