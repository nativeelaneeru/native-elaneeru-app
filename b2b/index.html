<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a5a"><meta name="description" content="Native Elaneeru bulk tender coconut ordering for business customers."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><link rel="apple-touch-icon" href="../icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Native Elaneeru Business</title><style>
:root{--n:#0c2940;--b:#123a5a;--t:#0f7280;--bg:#f2f5f8;--card:#fff;--ink:#172634;--muted:#6a7885;--line:#dbe3ea;--gold:#d5a53c;--good:#0c7a5c;--bad:#b42318;--shadow:0 12px 30px rgba(18,58,90,.09)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f5f8fa,#edf2f5);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:84px}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(135deg,var(--n),var(--b) 58%,var(--t));padding:calc(11px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 8px 28px rgba(12,41,64,.28)}.topin{max-width:820px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px}.logo{width:42px;height:42px;border-radius:12px;background:#fff;object-fit:cover}.brand b{display:block;font-size:18px}.brand small{opacity:.82}.topActions{display:flex;gap:7px}.iconBtn{border:1px solid #ffffff3c;background:#ffffff16;color:#fff;border-radius:11px;padding:8px 10px}.wrap{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow)}.login{max-width:440px;margin:36px auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field,input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff;color:var(--ink)}.primary{border:0;background:var(--b);color:#fff;border-radius:13px;padding:12px 14px;font-weight:900}.secondary{border:0;background:#edf4f7;color:var(--b);border-radius:13px;padding:12px 14px;font-weight:900}.hero{background:radial-gradient(circle at 90% 0,rgba(213,165,60,.22),transparent 32%),linear-gradient(135deg,#fffaf0,#edf5f7);border:0}.hero h1{font-size:27px;margin:0 0 5px}.muted{font-size:12px;color:var(--muted);line-height:1.45}.credit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.metric span{font-size:10px;color:var(--muted)}.metric b{display:block;font-size:18px;margin-top:4px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 9px}.sectionHead h2{margin:0;font-size:18px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{border:1px solid var(--line);background:#fff;border-radius:18px;padding:11px}.visual{height:125px;border-radius:15px;background:linear-gradient(145deg,#e3eef4,#fff0c8);display:grid;place-items:center;font-size:62px}.pname{font-weight:950;margin-top:9px}.price{font-size:20px;font-weight:950;color:var(--b)}.rules{font-size:10px;color:var(--muted);margin-top:3px}.qty{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.qty input{padding:9px}.add{border:0;background:var(--b);color:#fff;border-radius:11px;padding:8px 11px;font-weight:900}.order{padding:11px 0;border-bottom:1px solid var(--line)}.order:last-child{border:0}.orderTop{display:flex;justify-content:space-between;gap:8px}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e9f2f6;color:var(--b);font-size:9px;font-weight:950}.mini{border:1px solid var(--line);background:#fff;color:var(--b);border-radius:10px;padding:7px 9px;font-size:10px;font-weight:900}.cartBar{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:35;width:min(790px,calc(100% - 24px));background:linear-gradient(135deg,var(--n),var(--b));color:#fff;border-radius:17px;padding:11px 12px;display:none;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 16px 40px #0c294055}.cartBar.show{display:flex}.cartBar button{border:0;background:#fff;color:var(--b);border-radius:10px;padding:9px 11px;font-weight:900}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.bottomIn{max-width:820px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.nav{border:0;background:#fff;padding:9px;color:#7b8791;font-size:10px;font-weight:850}.nav b{display:block;font-size:20px}.nav.on{color:var(--t)}.sheet{position:fixed;inset:0;background:#0008;z-index:80;display:none;align-items:flex-end}.sheet.show{display:flex}.sheetBox{width:100%;max-width:820px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 14px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.grab{width:44px;height:4px;background:#d7dde1;border-radius:999px;margin:2px auto 10px}.cartItem{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.sum{display:flex;justify-content:space-between;padding:5px 0}.total{font-size:18px;font-weight:950;border-top:1px solid var(--line);margin-top:5px;padding-top:9px}.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;transition:.2s;z-index:120;background:#102e45;color:#fff;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:850;max-width:calc(100% - 28px)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.legalRow{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}@media(max-width:560px){.grid2{grid-template-columns:1fr}.credit{grid-template-columns:1fr 1fr}.products{grid-template-columns:1fr 1fr}.visual{height:110px}.wrap{padding:11px}}@media(max-width:390px){.products{grid-template-columns:1fr}.credit{grid-template-columns:1fr 1fr}}
</style></head><body><div id="toast" class="toast"></div><header class="top"><div class="topin"><div class="brand"><img class="logo" src="../icons/icon-192.png" alt="Native Elaneeru"><div><b>Native Elaneeru Business</b><small>Bulk ordering · Sri Govindadri Ventures</small></div></div><div class="topActions"><button id="legalBtn" class="iconBtn hidden">FSSAI</button><button id="installBtn" class="iconBtn hidden">Install</button><button id="logoutBtn" class="iconBtn hidden">Logout</button></div></div></header><main class="wrap"><section id="login" class="card login"><h2 style="margin-top:0">Business login</h2><div class="grid2"><input id="mobile" inputmode="numeric" maxlength="10" placeholder="Registered mobile"><input id="pin" type="password" inputmode="numeric" placeholder="PIN"></div><button id="loginBtn" class="primary" style="width:100%;margin-top:9px">Login</button><div id="msg" class="muted" style="margin-top:8px"></div></section><section id="app" class="hidden"><div id="homeView"><div id="hero" class="card hero"></div><div class="sectionHead"><h2>Business catalogue</h2><span class="muted">Your negotiated pricing</span></div><div id="products" class="products"></div></div><div id="ordersView" class="hidden"><div class="sectionHead"><h2>Your orders</h2><button class="secondary" onclick="refresh()">Refresh</button></div><div id="orders" class="card"></div></div><div id="profileView" class="hidden"><div class="sectionHead"><h2>Business account</h2></div><div id="profile" class="card"></div></div></section></main><div id="cartBar" class="cartBar"><div><b id="cartSummary">0 items</b><div style="font-size:11px;opacity:.75" id="cartAmount">₹0</div></div><button onclick="openCart()">View Cart →</button></div><nav id="bottom" class="bottom hidden"><div class="bottomIn"><button class="nav on" data-view="home"><b>🏪</b>Order</button><button class="nav" data-view="orders"><b>📦</b>Orders</button><button class="nav" data-view="profile"><b>👤</b>Account</button></div></nav><div id="cartSheet" class="sheet"><div class="sheetBox"><div class="grab"></div><h3 style="margin:0">Business Cart</h3><div id="cartItems"></div><div style="margin-top:10px"><label class="muted">Payment</label><select id="payment" style="margin-top:5px"></select><label class="muted" style="display:block;margin-top:9px">Delivery slot</label><input id="slot" placeholder="Preferred delivery slot" value="8:00 AM - 11:00 AM" style="margin-top:5px"></div><div style="margin-top:10px"><div class="sum"><span>Subtotal</span><b id="subtotal">₹0</b></div><div class="sum total"><span>Total</span><span id="total">₹0</span></div></div><div class="grid2" style="margin-top:10px"><button class="secondary" onclick="closeCart()">Continue Shopping</button><button class="primary" onclick="placeOrder()">Place Order</button></div></div></div><div id="legalSheet" class="sheet"><div class="sheetBox"><div class="grab"></div><h3 style="margin:0">Legal & Food Safety</h3><div id="legalBody" style="margin-top:8px"></div><button class="secondary" style="width:100%;margin-top:10px" onclick="document.getElementById('legalSheet').classList.remove('show')">Close</button></div></div><script src="./config.js?v=3"></script><script>
const CFG=window.NEL_B2B_CONFIG||{};const $=id=>document.getElementById(id);let TOKEN='',DATA=null,CART={},LEGAL=null,INSTALL_PROMPT=null;const pending=new Map();window.addEventListener('message',e=>{const d=e.data;if(!d||d.nelBridge!==true||!d.payload)return;const p=d.payload,h=pending.get(String(p.requestId||''));if(!h)return;pending.delete(String(p.requestId||''));h.cleanup();p.ok?h.resolve(p.result):h.reject(new Error(p.error||'Request failed.'))});function rpc(method,args=[]){return new Promise((resolve,reject)=>{const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).toString(),frame=document.createElement('iframe');frame.name='nel_'+id;frame.style.display='none';const form=document.createElement('form');form.method='POST';form.action=CFG.apiUrl+'?bridge=1';form.target=frame.name;form.style.display='none';const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({method,args,requestId:id});form.appendChild(input);document.body.append(frame,form);const timer=setTimeout(()=>{const h=pending.get(id);if(h){pending.delete(id);h.cleanup();reject(new Error('Request timed out.'))}},35000);const cleanup=()=>{clearTimeout(timer);setTimeout(()=>{frame.remove();form.remove()},50)};pending.set(id,{resolve,reject,cleanup});form.submit()})}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(t.x);t.x=setTimeout(()=>t.classList.remove('show'),2500)}async function login(){const m=$('mobile').value.trim(),p=$('pin').value.trim();$('loginBtn').disabled=true;try{const r=await rpc('vendorLogin',[m,p]);TOKEN=r.token;sessionStorage.setItem('nel_b2b_token',TOKEN);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('bottom').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');await refresh();await loadLegal()}catch(e){$('msg').textContent=e.message;toast(e.message)}finally{$('loginBtn').disabled=false}}async function refresh(){try{DATA=await rpc('getB2BAppDataV9',[TOKEN]);render()}catch(e){if(/expired/i.test(e.message))logout();toast(e.message)}}function render(){const v=DATA.vendor||{},t=DATA.target;$('hero').innerHTML='<h1>'+esc(v.businessName||'Business Account')+'</h1><div class="muted">'+esc(v.ownerName||'')+' · '+esc(v.area||'')+'</div><div class="credit"><div class="metric"><span>Outstanding</span><b>'+money(v.outstanding)+'</b></div><div class="metric"><span>Available credit</span><b>'+money(v.availableCredit)+'</b></div><div class="metric"><span>Payment</span><b style="font-size:14px">'+esc(v.paymentType||'COD')+'</b></div></div>'+(t?'<div style="margin-top:10px" class="muted">'+esc(t.name)+' · '+Number(t.achievedQty||0)+'/'+Number(t.targetQty||0)+' · '+Number(t.percent||0)+'%</div>':'');$('products').innerHTML=(DATA.products||[]).map(productCard).join('')||'<div class="card">No live B2B products.</div>';$('orders').innerHTML=(DATA.orders||[]).map(orderCard).join('')||'<div class="muted">No orders yet.</div>';$('profile').innerHTML='<b>'+esc(v.businessName||'')+'</b><div class="muted" style="margin-top:6px">'+esc(v.ownerName||'')+'<br>'+esc(v.mobile||'')+'<br>'+esc(v.address||'')+'</div><div class="credit"><div class="metric"><span>Credit limit</span><b>'+money(v.creditLimit)+'</b></div><div class="metric"><span>Outstanding</span><b>'+money(v.outstanding)+'</b></div><div class="metric"><span>Available</span><b>'+money(v.availableCredit)+'</b></div></div>';renderCart()}function productCard(p){const q=CART[p.productId]?.qty||0;return '<div class="product"><div class="visual">🥥</div><div class="pname">'+esc(p.productName)+'</div><div class="price">'+money(p.price)+' <span class="muted">/'+esc(p.unit||'pc')+'</span></div><div class="rules">MOQ '+Number(p.moq||1)+' · Step '+Number(p.qtyStep||1)+'</div><div class="qty"><input id="qty_'+esc(p.productId)+'" inputmode="numeric" type="number" min="'+Number(p.moq||1)+'" step="'+Number(p.qtyStep||1)+'" value="'+(q||Number(p.moq||1))+'"><button class="add" onclick="add(\''+esc(p.productId)+'\')">'+(q?'Update':'Add')+'</button></div></div>'}function add(id){const p=(DATA.products||[]).find(x=>x.productId===id),q=Math.floor(Number($('qty_'+id).value||0));if(!p)return;if(q<Number(p.moq||1))return toast('MOQ is '+p.moq);if(Number(p.qtyStep||1)>1&&q%Number(p.qtyStep||1))return toast('Quantity must be in steps of '+p.qtyStep);CART[id]={product:p,qty:q};renderCart();toast('Cart updated')}function renderCart(){const xs=Object.values(CART),subtotal=xs.reduce((a,x)=>a+x.qty*Number(x.product.price||0),0),qty=xs.reduce((a,x)=>a+x.qty,0);$('cartBar').classList.toggle('show',xs.length>0);$('cartSummary').textContent=qty+' items';$('cartAmount').textContent=money(subtotal);$('cartItems').innerHTML=xs.map(x=>'<div class="cartItem"><div><b>'+esc(x.product.productName)+'</b><div class="muted">'+x.qty+' × '+money(x.product.price)+'</div></div><div><b>'+money(x.qty*x.product.price)+'</b><br><button class="mini" onclick="removeItem(\''+esc(x.product.productId)+'\')">Remove</button></div></div>').join('');$('subtotal').textContent=money(subtotal);$('total').textContent=money(subtotal);const v=DATA?.vendor||{},opts=['COD'];if(String(v.paymentType||'').toUpperCase()==='CREDIT'&&Number(v.availableCredit||0)>0)opts.push('CREDIT');$('payment').innerHTML=opts.map(x=>'<option>'+x+'</option>').join('')}function removeItem(id){delete CART[id];renderCart()}function openCart(){renderCart();$('cartSheet').classList.add('show')}function closeCart(){$('cartSheet').classList.remove('show')}async function placeOrder(){const items=Object.values(CART).map(x=>({productId:x.product.productId,quantity:x.qty}));if(!items.length)return toast('Cart is empty');try{const r=await rpc('placeB2BOrderV9',[TOKEN,{items,paymentType:$('payment').value,deliverySlot:$('slot').value,deliveryAddress:DATA.vendor.address,area:DATA.vendor.area,deliveryCharge:0}]);toast('Order placed · '+r.orderId);CART={};closeCart();await refresh();showView('orders')}catch(e){toast(e.message)}}function orderCard(o){return '<div class="order"><div class="orderTop"><div><b>'+esc(o.orderId)+'</b> <span class="badge">'+esc(o.status)+'</span><div class="muted">'+esc(o.orderedAt||'')+' · '+esc(o.paymentType||'')+'</div><div class="muted">'+(o.items||[]).map(i=>esc(i.productName)+' × '+Number(i.quantity||0)).join(' · ')+'</div></div><b>'+money(o.amount)+'</b></div><div style="margin-top:8px"><button class="mini" onclick="invoice(\''+esc(o.orderId)+'\')">🧾 Invoice</button></div></div>'}async function invoice(id){try{const d=await rpc('getB2BInvoiceV91',[TOKEN,id]);const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to open invoice');w.document.write(invoiceHtml(d));w.document.close()}catch(e){toast(e.message)}}function invoiceHtml(d){const l=d.legal||{},rows=(d.items||[]).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.productName)+'</td><td>'+esc(x.hsn)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+money(x.lineAmount)+'</td></tr>').join('');return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(d.invoiceNo)+'</title><style>body{font-family:Arial,sans-serif;margin:28px;color:#172634}.brand{font-size:24px;font-weight:900;color:#123a5a}.muted{color:#687683;font-size:12px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:9px;border-bottom:1px solid #dde5ea;font-size:12px;text-align:left}.right{text-align:right}.total{font-size:18px;font-weight:900}@media print{button{display:none}body{margin:12mm}}</style></head><body><div class="brand">Native Elaneeru</div><b>'+esc(l.legalName||'Sri Govindadri Ventures')+'</b><div class="muted">'+esc(l.businessAddress||'')+'</div><h2>'+esc(d.documentType||'Commercial Invoice / Receipt')+'</h2><div class="muted">Invoice '+esc(d.invoiceNo)+' · '+esc(d.invoiceDate)+'<br>Order '+esc(d.orderId)+'</div><p><b>'+esc(d.partyName)+'</b><br><span class="muted">'+esc(d.address)+' · '+esc(d.mobile)+'</span></p><table><tr><th>#</th><th>Product</th><th>HSN</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>'+rows+'</table><p class="right total">Total '+money(d.total)+'</p><div class="muted">Payment: '+esc(d.paymentType)+'<br>FSSAI: '+esc(l.fssaiNo||'Application Pending')+'<br>GST: '+esc(l.gstin||'Not registered')+'<br>Grievance Officer: '+esc(l.grievanceOfficer||'')+' · '+esc(l.grievanceEmail||'')+'<br>Customer care: '+esc(l.supportPhone||'')+'</div><button onclick="print()" style="margin-top:18px">Print / Save PDF</button></body></html>'}async function loadLegal(){try{LEGAL=await rpc('getCompliancePublicV91',[]);$('legalBtn').textContent=LEGAL.fssaiNo?'FSSAI ✓':'FSSAI Pending';$('legalBtn').classList.remove('hidden');$('legalBody').innerHTML=[['Legal entity',LEGAL.legalName+' ('+LEGAL.legalStructure+')'],['Business address',LEGAL.businessAddress],['FSSAI',LEGAL.fssaiNo||'Application Pending'],['GST',LEGAL.gstin||'Not registered'],['Grievance Officer',LEGAL.grievanceOfficer],['Grievance email',LEGAL.grievanceEmail||'To be confirmed'],['Customer care',LEGAL.supportPhone],['Invoice type',LEGAL.invoiceDocumentType]].map(x=>'<div class="legalRow"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')}catch(e){}}function showView(v){['home','orders','profile'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='orders')refresh()}function logout(){if(TOKEN)rpc('vendorLogout',[TOKEN]).catch(()=>{});TOKEN='';DATA=null;CART={};sessionStorage.removeItem('nel_b2b_token');$('app').classList.add('hidden');$('bottom').classList.add('hidden');$('logoutBtn').classList.add('hidden');$('legalBtn').classList.add('hidden');$('login').classList.remove('hidden');$('pin').value=''}$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('legalBtn').onclick=()=>$('legalSheet').classList.add('show');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>showView(b.dataset.view));window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_PROMPT=e;$('installBtn').classList.remove('hidden')});$('installBtn').onclick=async()=>{if(INSTALL_PROMPT){INSTALL_PROMPT.prompt();await INSTALL_PROMPT.userChoice;INSTALL_PROMPT=null;$('installBtn').classList.add('hidden')}else toast('Use browser menu → Add to Home Screen')};if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
